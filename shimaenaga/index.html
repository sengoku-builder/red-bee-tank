<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe5ea">
<title>シマエナガの森</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe5ea;color:#26313b;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
body.wall #ui{display:none}
.glass{background:rgba(250,252,253,.74);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 24px rgba(40,60,80,.12)}
button{font:inherit;color:#26313b;border-radius:14px;padding:10px 14px;cursor:pointer;border:1px solid rgba(255,255,255,.9)}
button:disabled{opacity:.45;cursor:default}
button.main{background:#3e6f8e;color:#fff;border-color:#3e6f8e}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.6;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hud b{font-size:17px;font-variant-numeric:tabular-nums}
.hud .muted{color:#5d6b77;font-size:12px}
.hud .stage{text-align:right;font-size:12.5px;max-width:60%}
.dock{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px}
.dock button{flex:1;padding:11px 4px;font-size:13px;white-space:nowrap}
.panel{display:none;position:absolute;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));max-height:68%;overflow:auto;padding:16px;border-radius:18px}
.panel.open{display:block}
.panel h2{font-size:17px;margin:0 0 6px}
.panel p{font-size:13px;color:#4a5864;line-height:1.65;margin:6px 0}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(60,80,100,.12)}
.item .info{flex:1;min-width:0}
.item small{display:block;color:#5d6b77;font-size:12px;margin-top:2px;line-height:1.5}
.item .price{color:#9a5b1e;font-variant-numeric:tabular-nums;font-weight:600}
.item .btns{display:flex;flex-direction:column;gap:5px}
.item .btns button{padding:7px 11px;font-size:12.5px;white-space:nowrap}
.thumb{flex:0 0 54px;width:54px;height:54px;border-radius:12px;overflow:hidden;background:#cfd8de}
.thumb img{width:100%;height:100%;object-fit:cover}
.note{border-top:1px solid rgba(60,80,100,.12);padding:10px 0}
.note h3{font-size:14px;margin:0 0 4px;color:#3e6f8e}
.note div{font-size:13px;line-height:1.75;color:#33414d}
.note.locked h3{color:#8995a0}
.log{font-size:12.5px;line-height:1.85;color:#4a5864}
.sec{margin:14px 0 4px;font-size:13px;color:#3e6f8e;font-weight:700}
.modal{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 28px));max-height:86%;overflow:auto;padding:20px;border-radius:20px;text-align:center;z-index:30}
.modal.open{display:block}
.modal .tag{font-size:12px;color:#9a5b1e;letter-spacing:.08em}
.modal h2{margin:4px 0 6px;font-size:19px}
.modal .body{font-size:14px;line-height:1.85;text-align:left;margin:10px 0 14px;color:#33414d}
.big{font-size:42px;font-weight:700;margin:8px 0;color:#3e6f8e;font-variant-numeric:tabular-nums}
.names{display:flex;flex-direction:column;gap:7px;margin:10px 0 14px}
.names label{display:flex;align-items:center;gap:8px;font-size:13px;color:#4a5864}
.names input{flex:1;padding:9px 10px;border-radius:10px;border:1px solid #c5d0d8;font:inherit;font-size:15px;background:#fff;color:#26313b}
.toast{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));max-width:calc(100% - 24px);padding:10px 15px;border-radius:14px;font-size:13.5px;text-align:center;z-index:25}
.toast.show{display:block}
.trial{display:none;position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:10px;border-radius:16px;gap:8px;align-items:center;z-index:20}
.trial.show{display:flex}
.trial span{flex:1;font-size:13px}
body.trialing .dock,body.trialing .panel{display:none}
.debug{position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:5px;flex-wrap:wrap}
.debug button{font-size:11.5px;padding:6px 8px}
.debug[hidden]{display:none}
#whud{display:none;position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.42);color:#26313b;font-size:12px;line-height:1.6;text-align:right;pointer-events:none;font-variant-numeric:tabular-nums;max-width:62%}
body.wall.showhud #whud{display:block}
#whud .sale{display:block;margin-top:3px;padding:2px 7px;border-radius:8px;background:rgba(255,236,190,.85);color:#7a4310;font-weight:600}
#whud.saleon{box-shadow:0 0 0 1.5px rgba(255,196,90,.75),0 0 16px rgba(255,190,70,.55);animation:saleglow 2.4s ease-in-out infinite}
@keyframes saleglow{50%{box-shadow:0 0 0 1.5px rgba(255,196,90,.45),0 0 6px rgba(255,190,70,.25)}}
.item .old{text-decoration:line-through;color:#8a96a0;font-weight:400;margin-right:6px}
.item .off{display:inline-block;margin-left:6px;padding:0 6px;border-radius:7px;background:#c2551d;color:#fff;font-size:11px}
.zukan{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.zukan div{text-align:center;font-size:11.5px;color:#4a5864}
.zukan .ph{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#cfd8de;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8995a0;margin-bottom:3px}
.zukan .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 47%;transform:scale(2.2)}
body.hudedit #whud{display:block;pointer-events:auto;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;outline:2px dashed rgba(62,111,142,.55);outline-offset:3px}
#whud.lift{transform:scale(1.07);background:rgba(255,255,255,.78);box-shadow:0 10px 28px rgba(40,60,80,.28);outline-style:solid;transition:transform .12s}
body.hudedit #ui>*:not(#hudBar){display:none!important}
#hudBar{display:none;position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:12px;border-radius:16px;font-size:13px;line-height:1.6}
body.hudedit #hudBar{display:block}
#hudBar .row{display:flex;gap:8px;margin-top:8px}#hudBar .row button{flex:1}
.fam{border-top:1px solid rgba(60,80,100,.12);padding:10px 0;font-size:13px;line-height:1.7}
.fam b{color:#3e6f8e}
.seasons{display:flex;gap:6px;margin:6px 0}.seasons button{flex:1;padding:9px 0;font-size:14px}.seasons button.on{background:#3e6f8e;color:#fff;border-color:#3e6f8e}
.thumb.emo{display:flex;align-items:center;justify-content:center;font-size:28px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.album img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;cursor:pointer;display:block}
#mPhoto img{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;margin:8px 0}
#mPhoto .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s ease}
#flash.on{opacity:.85;transition:none}
#bShot{display:none;position:absolute;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;font-size:24px;padding:0}
body.cam #bShot{display:block}
body.trialing #bShot,body.paneling #bShot{display:none}
</style></head>
<body>
<canvas id="gl"></canvas><canvas id="fx"></canvas><div id="flash"></div>
<div id="whud"></div>
<div id="ui">
 <div class="hud glass" id="hud"></div>
 <div class="toast glass" id="toast"></div>
 <div class="dock">
  <button class="glass" id="bShop">ショップ</button>
  <button class="glass" id="bFam">家族</button>
  <button class="glass" id="bNote">知識ノート</button>
  <button class="glass" id="bAlbum" style="display:none">アルバム</button>
  <button class="glass" id="bLog">記録</button>
 </div>
 <section class="panel glass" id="pShop"><h2>森の道具屋</h2><p>道具をそろえるほど、シマエナガがよく来る森になります。「試し置き」で買う前に森に置いた様子を見られます。</p><div id="shopList"></div></section>
 <section class="panel glass" id="pFam"><h2>シマエナガの家族</h2><div id="famList"></div></section>
 <button class="glass" id="bShot" aria-label="写真を撮る">📷</button>
 <section class="panel glass" id="pAlbum"><h2>アルバム</h2><p id="albumMsg"></p><div class="album" id="albumList"></div></section>
 <section class="panel glass" id="pNote"><h2>知識ノート</h2><p>出来事が起きると、カードが1枚ずつ増えていきます。</p><div id="noteList"></div></section>
 <section class="panel glass" id="pLog"><h2>記録</h2><div class="log" id="logList"></div>
  <div class="sec">壁紙</div><div id="wpBox"></div><label style="display:block;font-size:13px;margin:4px 0"><input type="checkbox" id="hudChk"> 壁紙に状態（Gや子育ての様子）を表示する</label><button class="glass" id="bHudMove" style="margin-top:4px">壁紙の表示を動かす</button>
  <div class="sec">季節</div><div class="seasons" id="seasonBox"></div><p id="seasonMsg"></p>
  <div class="sec">やり直し</div><button class="glass" id="bReset">最初からやり直す</button></section>
 <div class="glass" id="hudBar">壁紙に出る表示です。<b>長押し</b>すると持ち上がるので、そのまま指で好きな場所へ動かしてください。<div class="row"><button class="glass" id="hudReset">元の位置に戻す</button><button class="main" id="hudDone">完了</button></div></div>
 <div class="trial glass" id="trial"><span id="trialMsg"></span><button class="main" id="trialBuy">買う</button><button class="glass" id="trialEnd">やめる</button></div>
 <div class="modal glass" id="mLot"><div class="tag">今日のくじ</div><h2 id="lotTitle">今日の単価を決めよう</h2><div class="big" id="lotBig">？</div><p class="body" id="lotMsg" style="text-align:center"></p><button class="main" id="bDraw">くじを引く</button></div>
 <div class="modal glass" id="mNote"><div class="tag">知識カード</div><h2 id="mnTitle"></h2><div class="body" id="mnBody"></div><button class="main" id="bNoteOk">わかった</button></div>
 <div class="modal glass" id="mPhoto"><div class="tag" id="mpDate"></div><h2 id="mpTitle"></h2><img id="mpImg" alt=""><div class="row"><button class="main" id="mpSave">スマホに保存</button><button class="glass" id="mpDel">削除</button><button class="glass" id="mpClose">閉じる</button></div></div>
 <div class="modal glass" id="mEvt"><div class="tag" id="meTag"></div><h2 id="meTitle"></h2><div class="body" id="meBody"></div><div class="names" id="meNames"></div><button class="main" id="meOk">OK</button></div>
 <div class="debug" id="debug" hidden><button class="glass" data-skip="3600000">＋1時間</button><button class="glass" data-skip="86400000">＋1日</button><button class="glass" id="dRich">＋1万G</button><button class="glass" id="dVisit">来訪</button></div>
</div>

/* ================= 保存データ ================= */
const KEY='shimaenagaForest_v1',MIN=60000,HOUR=3600000,DAY=86400000,SCALE=3,BASE=1;
const blank=()=>({ver:1,g:1000,created:Date.now(),lastTick:Date.now(),rates:{},owned:{},notes:[],seen:{},log:[],visits:0,offset:0,lv3At:0,broods:{},parents:{},hud:true});
let S;
function load(){try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=S||blank()}}
load();
const save=()=>{if(WALL)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=()=>Date.now()+(S.offset||0);
const pad=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const G=n=>Math.floor(n).toLocaleString('ja-JP')+'G';
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addLog(s,at){const d=new Date(at||now());S.log.unshift((d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'　'+s);if(S.log.length>80)S.log.length=80}
function toast(s,ms){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms||3500)}

/* ================= お金：閉じていた間も日ごとの単価で貯まる ================= */
function tick(){const t=now();let a=S.lastTick;
 while(a<t){const e=Math.min(t,dayStart(a)+DAY);S.g+=(e-a)/MIN*(S.rates[dkey(a)]||BASE);a=e}
 S.lastTick=Math.max(S.lastTick,t)}

/* ================= くじ ================= */
const LOT=[[1,67,'今日はいつもどおり。のんびり森を見守りましょう。'],[2,25,'いい日！今日は1分2G。'],[3,8,'大当たり！今日は1分3G。森でいいことがあるかも…！']];
function drawLot(){tick();const t=now(),k=dkey(t);if(S.rates[k])return;
 let r=Math.random()*100,p=LOT[0];for(const L of LOT){if((r-=L[1])<0){p=L;break}}
 S.rates[k]=p[0];const from=Math.max(dayStart(t),S.created);S.g+=(p[0]-BASE)*Math.max(0,t-from)/MIN;
 for(const d of Object.keys(S.rates))if(d<dkey(t-40*DAY))delete S.rates[d];
 addLog('くじ：1分'+p[0]+'G');save();
 $('lotTitle').textContent=p[0]===3?'大当たり！':'今日の単価';$('lotBig').textContent=p[0]+'G / 分';$('lotMsg').textContent=p[2];
 $('bDraw').textContent='閉じる';$('bDraw').onclick=()=>{$('mLot').classList.remove('open');pump()};render()}
function maybeLottery(){if(WALL||S.rates[dkey(now())]||anyModal())return;
 $('lotTitle').textContent='今日の単価を決めよう';$('lotBig').textContent='？';$('lotMsg').textContent='くじを引くと、今日1日（0時から）の1分あたりのGが決まります。';
 $('bDraw').textContent='くじを引く';$('bDraw').onclick=drawLot;$('mLot').classList.add('open');return true}
const jackpot=()=>S.rates[dkey(now())]===3;

function hstr(x){let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const SALE_MIN=60*MIN;
function saleInfo(t){t=t||now();const d=dkey(t),h=hstr('sale'+d);
 const start=dayStart(t)+(7*60+h%(15*60))*MIN,end=start+SALE_MIN;  // 7:00〜21:59のどこかで始まる
 if(t<start||t>=end)return null;
 const before=id=>S.owned[id]&&S.owned[id]<start;
 const c=ITEMS.filter(it=>!it.soon&&!before(it.id)&&(!it.need||before(it.need)));
 if(!c.length)return null;
 const it=c[(h>>>12)%c.length];if(S.owned[it.id])return null;   // もう買った
 return{it,pct:[20,30,40,50][(h>>>8)%4],end}}
function priceOf(it){const sl=saleInfo();return sl&&sl.it===it?Math.round(it.price*(100-sl.pct)/100/10)*10:it.price}
const level=()=>S.owned.icicle&&S.owned.nest?4:S.owned.nest?3:S.owned.water?2:S.owned.feeder?1:0;

 S.g-=pr;if(it.id==='sunflower')setNextFriend(now()+rnd(3,8)*HOUR);S.owned[it.id]=now();if(it.id==='nest')S.lv3At=now();
 {const g=visitGap();if(nextVisit()>now()+g[1])setNextVisit(now()+rnd(g[0],g[1]))}
 addLog(it.name+(it.group==='obs'?'を買った':'を置いた')+(onSale?'（セールで'+G(pr)+'）':''));unlock(it.note);save();toast(it.group==='obs'?it.name+'を手に入れました':it.name+'を森に置きました');if(trial){trial=null;document.body.classList.remove('trialing');$('trial').classList.remove('show')}scheduleNext();render();renderShop();pump();return true}

// 巣材を置いてから2時間後に最初のつがいが生まれ、以後は1年ごとにくり返す
const PH=[['nest',14],['egg',15],['chick',16],['dango',4],['family',12],['winter',10]];
const CYCLE=PH.reduce((a,p)=>a+p[1],0);
const PAIR_DELAY=2*HOUR;
const gday=ms=>ms*SCALE/DAY;
function life(t){t=t||now();
 if(!S.lv3At||t<S.lv3At+PAIR_DELAY)return{phase:'pre'};
 const gd=gday(t-S.lv3At-PAIR_DELAY),k=Math.floor(gd/CYCLE);let r=gd-k*CYCLE;
 for(const [p,d] of PH){if(r<d)return{phase:p,k,left:(d-r)*DAY/SCALE,start:t-r*DAY/SCALE};r-=d}
 return{phase:'winter',k,left:0}}

 switch(L.phase){

 }}

const nextVisit=()=>Math.max(S.nextVisitAt||0,localNext);

 if(!S.visits&&(!S.nextVisitAt||S.nextVisitAt>t+2*MIN))setNextVisit(t+rnd(1,2)*MIN); // 初めては1〜2分で来る
 else if(!S.nextVisitAt){const g=visitGap();setNextVisit(t+rnd(g[0],g[1]))}}

function prefetch(){const se=curSeason(),win=se==='winter',P=win?'':se+'_',lv=level();
 const ks=lv===0?[P+'v0a',P+'v0b']:lv===1?[P+'v1a',P+'v1b']:[win?'s1_lv'+lv:P+'flock_lv'+Math.min(lv,3)];

}

// 初めて会った仲間を図鑑に。壁紙は全体を保存しないので、その部分だけ書き足す

const warp=s=>`
 for(int i=0;i<${MAXN};i++){
  if(i>=n${s})break;

  float cy=(b.y+b.z)*.5,ry=(b.z-b.y)*.5+8.;

  if(m<=0.)continue;
  vec2 foot=vec2(b.x,b.z);
  q=foot+(q-foot)/(1.+a.x*m);
  vec2 neck=vec2(b.x,b.y+(b.z-b.y)*.42);
  float hm=m*smoothstep(neck.y+10.,neck.y-18.,px.y);
  float ang=a.y*hm;float cs=cos(ang),sn=sin(ang);
  vec2 r=q-neck;q=neck+vec2(cs*r.x-sn*r.y,sn*r.x+cs*r.y);
  float lm=m*smoothstep(b.z,b.y,px.y);
  q.x-=a.z*lm*(b.z-px.y)*.08;

 }`;

function renderShop(soft){const sl0=saleInfo(),sig=ITEMS.map(it=>(S.owned[it.id]?1:0)+''+(S.g>=priceOf(it)?1:0)).join('')+(sl0?sl0.it.id+Math.ceil((sl0.end-now())/MIN):'');if(soft&&sig===shopSig)return;shopSig=sig;const L=$('shopList');L.innerHTML='';L.dataset.g='-';
 for(const it of ITEMS){const owned=S.owned[it.id],locked=it.need&&!S.owned[it.need];
  const d=document.createElement('div');d.className='item';
  if((it.group||'')!==L.dataset.g){L.insertAdjacentHTML('beforeend','<div class="sec">'+(it.group==='obs'?'観察の道具':'森の道具')+'</div>');L.dataset.g=it.group||''}
  d.innerHTML=(it.img?'<div class="thumb"><img alt="" src="'+A[itemImg(it)].img+'"></div>':'<div class="thumb emo">'+(it.emo||'')+'</div>')+
   '<div class="info"><div>'+it.name+'</div><small>'+it.desc+'</small><small class="price">'+(it.soon?'準備中':owned?(it.group==='obs'?'持っています':'置いてあります'):locked?'前の道具を置くと買えます':priceTag(it))+'</small></div><div class="btns"></div>';
  const B=d.querySelector('.btns');
  if(!it.soon&&!owned&&!locked){if(it.img){const t=document.createElement('button');t.className='glass';t.textContent=it.group==='obs'?'のぞいてみる':'試し置き';t.onclick=()=>startTrial(it);B.appendChild(t)}
   const b=document.createElement('button');b.className='main';b.textContent='買う';b.disabled=S.g<priceOf(it);b.onclick=()=>buy(it);B.appendChild(b)}
  L.appendChild(d)}}
function priceTag(it){const pr=priceOf(it);if(pr===it.price)return G(it.price);const sl=saleInfo();
 return '<span class="old">'+G(it.price)+'</span>'+G(pr)+'<span class="off">'+sl.pct+'%オフ・あと'+Math.ceil((sl.end-now())/MIN)+'分</span>'}
function renderNotes(){const L=$('noteList');L.innerHTML='';
 {const z=S.zukan||{},ks=Object.keys(FRIENDS),got=ks.filter(k=>z[k]).length,box=document.createElement('div');
  box.innerHTML='<div class="sec">森の仲間図鑑 '+got+' / '+ks.length+'</div><div class="zukan">'+ks.map(k=>{const fk='f_autumn_'+k+'_lv1';
   return '<div><div class="ph">'+(z[k]&&A[fk]?'<img alt="" src="'+A[fk].img+'">':'？')+'</div>'+(z[k]?FRIENDS[k]+'<br>'+z[k].count+'回':'？？？')+'</div>'}).join('')+'</div>'+
   (got?'':'<p>ひまわりの種のエサ台を置いたり、群れをよく見ていると、ほかの小鳥に会えるかも。</p>');L.appendChild(box)}
 for(const id of NOTE_ORDER){const n=NOTES[id],has=S.notes.includes(id),d=document.createElement('div');d.className='note'+(has?'':' locked');
  d.innerHTML='<h3>'+(has?n[0]:'？？？')+'</h3>'+(has?'<div>'+n[1]+'</div>':'');L.appendChild(d)}}
function renderFam(){const L=$('famList');L.innerHTML='';const lf=life();
 if(lf.phase==='pre'){L.innerHTML='<p>まだつがいはいません。道具をそろえて、シマエナガが安心して子育てできる森にしましょう。</p><p>これまでに来たシマエナガ：'+S.visits+'回</p>';return}
 const p=document.createElement('div');p.className='fam';p.innerHTML='<b>つがい</b><div class="names"><label>お父さん<input data-p="a" maxlength="10" value="'+(S.parents.a||'')+'"></label><label>お母さん<input data-p="b" maxlength="10" value="'+(S.parents.b||'')+'"></label></div>';L.appendChild(p);
 p.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.parents[i.dataset.p]=i.value.trim();save();render()});
 for(let k=lf.k;k>=0;k--){const b=S.broods[k];if(!b||!b.names.length)continue;const d=document.createElement('div');d.className='fam';
  d.innerHTML='<b>'+(k+1)+'年目のヒナ</b><div class="names">'+b.names.map((n,i)=>'<label>'+(i+1)+'羽目<input data-i="'+i+'" maxlength="10" value="'+n+'"></label>').join('')+'</div>';
  d.querySelectorAll('input').forEach(i=>i.onchange=()=>{b.names[+i.dataset.i]=i.value.trim();save()});L.appendChild(d)}
 const f=document.createElement('p');f.textContent='今の様子：'+PNAME[lf.phase]+'（'+(lf.k+1)+'年目）。これまでに来たシマエナガ：'+S.visits+'回';L.appendChild(f)}
function closePanels(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));document.body.classList.remove('paneling')}
/* ----- アルバム（写真はこの端末の中に保存） ----- */
const ALBUM_MAX=60;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('shimaenagaAlbum',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('p',mode),st=tx.objectStore('p');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}))}
const albumAll=()=>idbDo('readonly',st=>st.getAll()).then(a=>(a||[]).sort((x,y)=>y.id-x.id));
const SCENE_NAME={s1:'冬の群れ',s1_lv2:'冬の群れ',s1_lv3:'冬の群れ',s1_lv4:'冬の群れ',v0a:'通りかかった1羽',v0b:'通りかかった1羽',v1a:'エサ台に来た2羽',v1b:'エサ台に来た3羽',c1:'すぐ近くの1羽',c2:'寄り添う2羽',c3:'毛繕い',s2:'巣作り',s3:'巣の中のヒナ',s4:'エナガ団子',s5:'巣立ち後の親子',dango_old:'ごほうびの団子',s0b:'晩冬の森',s0c:'早春の森'};
const SEASON_SCENE={lv0:'森',lv1:'森',lv2:'森',lv3:'森',v0a:'1羽',v0b:'1羽',v1a:'2羽',v1b:'3羽',flock_lv2:'群れ',flock_lv3:'群れ',flock5:'ごほうびの団子'};
function shotLabel(){const k=curKey||'';{const fm=/^f_\w+?_(\w+)_lv\d$/.exec(k);if(fm)return '森の仲間：'+FRIENDS[fm[1]]}const sm=/^(spring|summer|autumn)_(.+)$/.exec(k);
 let n=sm?SEASONS[sm[1]]+'の'+(SEASON_SCENE[sm[2]]||'森'):(SCENE_NAME[k]||'冬の森');const L=life();
 if((k==='s3'||k==='s4')&&S.broods[L.k]){const a=S.broods[L.k].names.filter(Boolean);if(a.length)n+='（'+a.join('・')+'）'}
 if(k==='s2'&&(S.parents.a||S.parents.b))n+='（'+parentNames()+'）';return n}
let shotReq=false;
function doShot(){const w=720,h=Math.round(w*H/W),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.drawImage(cv,0,0,w,h);x.drawImage(fx,0,0,w,h);const img=c.toDataURL('image/jpeg',.85),rec={id:Date.now(),at:now(),label:shotLabel(),img};
 const f=$('flash');f.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')));
 albumAll().then(a=>{if(a.length>=ALBUM_MAX){toast('アルバムがいっぱいです（'+ALBUM_MAX+'枚まで）。いらない写真を削除してください');return}
  return idbDo('readwrite',st=>st.put(rec)).then(()=>{toast('「'+rec.label+'」を撮りました');addLog('写真を撮った：'+rec.label);save()})}).catch(()=>toast('この端末ではアルバムに保存できませんでした'))}
$('bShot').onclick=()=>{shotReq=true};
function fmtDate(t){const d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function renderAlbum(){const L=$('albumList');L.innerHTML='';
 albumAll().then(a=>{$('albumMsg').textContent=a.length?a.length+'枚（'+ALBUM_MAX+'枚まで）。写真を押すと大きく見られます。':'まだ写真はありません。森の右下の📷ボタンで撮れます。';
  for(const r of a){const i=document.createElement('img');i.src=r.img;i.alt=r.label;i.onclick=()=>openPhoto(r);L.appendChild(i)}}).catch(()=>{$('albumMsg').textContent='この端末ではアルバムを使えません'})}
function openPhoto(r){$('mpDate').textContent=fmtDate(r.at);$('mpTitle').textContent=r.label;$('mpImg').src=r.img;
 $('mpSave').onclick=()=>savePhoto(r);$('mpDel').onclick=()=>{if(confirm('この写真を削除しますか？'))idbDo('readwrite',st=>st.delete(r.id)).then(()=>{$('mPhoto').classList.remove('open');renderAlbum()})};
 $('mPhoto').classList.add('open')}
$('mpClose').onclick=()=>$('mPhoto').classList.remove('open');
function savePhoto(r){const d=new Date(r.at),name='shimaenaga_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'.jpg';
 if(window.ShimaApp){if(ShimaApp.savePhoto){let ok=false;try{ok=ShimaApp.savePhoto(r.img,name)}catch(e){}toast(ok?'スマホの「Pictures」→「シマエナガの森」に保存しました':'保存できませんでした')}
  else toast('アプリを最新版にすると、スマホに保存できます');return}
 const a=document.createElement('a');a.href=r.img;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('写真をダウンロードしました')}
function camUI(){document.body.classList.toggle('cam',!!S.owned.camera&&!WALL);$('bAlbum').style.display=S.owned.camera?'':'none'}
function toggle(id,fn){const p=$(id),o=p.classList.contains('open');closePanels();if(!o){fn&&fn();p.classList.add('open');document.body.classList.add('paneling')}}
$('bShop').onclick=()=>toggle('pShop',renderShop);
$('bFam').onclick=()=>toggle('pFam',renderFam);
$('bNote').onclick=()=>toggle('pNote',renderNotes);
$('bAlbum').onclick=()=>toggle('pAlbum',renderAlbum);
$('bLog').onclick=()=>toggle('pLog',()=>{renderSeasons();$('logList').innerHTML=S.log.slice(0,40).join('<br>')||'まだ記録はありません';$('hudChk').checked=S.hud!==false});
(function(){const b=$('wpBox');if(window.ShimaApp){b.innerHTML='<button class="main" id="bWp">この森を壁紙にする</button><p>ホーム画面の壁紙が、この森の動く写真になります。遊んだ内容はそのまま壁紙に反映されます。</p>';$('bWp').onclick=()=>{try{ShimaApp.setWallpaper()}catch(e){}}}
 else b.innerHTML='<p>スマホの「シマエナガの森」アプリで開くと、この森をそのまま壁紙にできます。</p>'})();
$('hudChk').onchange=e=>{S.hud=e.target.checked;save();render()};
function renderSeasons(){const b=$('seasonBox');b.innerHTML='';const cur=S.season||'winter';
 for(const k of ['auto','spring','summer','autumn','winter']){const x=document.createElement('button');x.className='glass'+(k===cur?' on':'');x.textContent=SEASONS[k];
  x.onclick=()=>{S.season=k;save();renderSeasons();lastSig='';const ph=life().phase;
   toast(k==='auto'?'今の月に合わせて、森の季節が変わります（今は'+SEASONS[curSeason()]+'）':SEASONS[k]+'の森にしました'+(ph==='pre'||ph==='winter'?'':'。子育ての場面が終わると'+SEASONS[curSeason()]+'の森になります'))};b.appendChild(x)}
 $('seasonMsg').textContent='春・夏・秋は、冬とは少しちがう場所の枝になります。'+(S.season==='auto'?'自動：12〜3月は冬、4〜5月は春、6〜8月は夏、9〜11月は秋。':'')}
/* ----- 壁紙の表示を長押しで好きな場所へ（位置は画面に対する割合で覚える） ----- */
const WH=$('whud');let hudDrag=null;
function placeHud(){if(hudDrag)return;const p=S.hudPos;
 if(!p){WH.style.left='';WH.style.top='';WH.style.right='';return}
 const w=WH.offsetWidth||140,h=WH.offsetHeight||44,x=Math.max(6,Math.min(innerWidth-w-6,p.x*innerWidth)),y=Math.max(6,Math.min(innerHeight-h-6,p.y*innerHeight));
 WH.style.right='auto';WH.style.left=x+'px';WH.style.top=y+'px'}
addEventListener('resize',placeHud);
$('bHudMove').onclick=()=>{closePanels();document.body.classList.add('hudedit');render()};
$('hudDone').onclick=()=>{document.body.classList.remove('hudedit');toast('壁紙の表示の位置を覚えました')};
$('hudReset').onclick=()=>{delete S.hudPos;save();placeHud();toast('元の位置（右上）に戻しました')};
WH.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('hudedit'))return;e.preventDefault();
 const r=WH.getBoundingClientRect();hudDrag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,live:false,
  timer:setTimeout(()=>{if(hudDrag){hudDrag.live=true;WH.classList.add('lift');try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}},380)};
 try{WH.setPointerCapture(e.pointerId)}catch(_){}});
WH.addEventListener('pointermove',e=>{if(!hudDrag||e.pointerId!==hudDrag.id)return;
 if(!hudDrag.live){if(Math.hypot(e.clientX-hudDrag.sx,e.clientY-hudDrag.sy)>10){clearTimeout(hudDrag.timer);hudDrag=null}return}
 const w=WH.offsetWidth,h=WH.offsetHeight,x=Math.max(6,Math.min(innerWidth-w-6,e.clientX-hudDrag.ox)),y=Math.max(6,Math.min(innerHeight-h-6,e.clientY-hudDrag.oy));
 WH.style.right='auto';WH.style.left=x+'px';WH.style.top=y+'px'});
function hudUp(e){if(!hudDrag||e.pointerId!==hudDrag.id)return;clearTimeout(hudDrag.timer);
 WH.classList.remove('lift');
 if(hudDrag.live){const r=WH.getBoundingClientRect();S.hudPos={x:r.left/innerWidth,y:r.top/innerHeight};save()}hudDrag=null;placeHud()}
WH.addEventListener('pointerup',hudUp);WH.addEventListener('pointercancel',hudUp);
cv.addEventListener('click',closePanels);
$('bReset').onclick=()=>{if(confirm('森を最初からやり直しますか？（G・道具・家族・カードがすべて消えます）')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
if(DEBUG){$('debug').hidden=false;document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{S.offset=(S.offset||0)+ +b.dataset.skip;tick();checkLife();save();render();scheduleNext();pump()});
 $('dRich').onclick=()=>{S.g+=10000;save();render()};$('dVisit').onclick=()=>{visiting=false;setNextVisit(0)}}

/* ================= 起動 ================= */
if(WALL)document.body.classList.add('wall');
tick();unlock('start');unlock('protect');checkLife();initVisit();save();render();
scheduleNext();
let last=0,sec=0,lastSig=level()+'/'+life().phase+'/'+curSeason();
function frame(ts){if(WALL&&ts-last<30){requestAnimationFrame(frame);return}
 const dt=Math.min(.25,(ts-last)/1000||0),t=ts/1000;last=ts;
 if(ts-sec>1000){sec=ts;
  if(WALL&&Math.floor(ts/5000)!==Math.floor((ts-1000)/5000)){load()}
  tick();if(!WALL){checkLife();save()}render();{const sig=level()+'/'+life().phase+'/'+curSeason();if(sig!==lastSig){lastSig=sig;if(!trial)scheduleNext()}}sceneTick();if(!WALL&&!anyModal()&&(evtQ.length||noteQ.length))pump()}
 if(ready){if(fading){fading.t+=dt;const x=Math.min(1,fading.t/fading.dur);mx=x*x*(3-2*x);if(x>=1)finishFade()}
  gl.viewport(0,0,W,H);const v=view();gl.uniform4f(U('vw'),v[0],v[1],v[2],v[3]);gl.uniform1f(U('mx'),mx);
  animSlot(0,t,dt);if(fading)animSlot(1,t,dt);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
 snow(dt);if(shotReq&&ready){shotReq=false;try{doShot()}catch(e){toast('撮影できませんでした')}}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
setTimeout(pump,800);
/* ----- 新しい版が公開されていたら読み込み直す（森のデータはそのまま） ----- */
let updBusy=false;
function checkUpdate(){if(updBusy||!/^https?:/.test(location.protocol))return;updBusy=true;
 fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{updBusy=false;
  if(!v||!v.build||v.build===BUILD)return;
  // 同じ版への読み込み直しは10分に1回まで（公開直後の行き違いで繰り返さないように）
  let tried=null;try{tried=JSON.parse(localStorage.getItem('shimaUpd')||'null')}catch(e){}
  if(tried&&tried.b===v.build&&Date.now()-tried.t<10*MIN)return;
  if(!WALL&&(anyModal()||trial||document.querySelector('.panel.open')||document.body.classList.contains('hudedit')))return; // 遊んでいる途中は待つ
  try{localStorage.setItem('shimaUpd',JSON.stringify({b:v.build,t:Date.now()}))}catch(e){}
  save();const q=new URLSearchParams(location.search);q.set('v',v.build);location.replace(location.pathname+'?'+q.toString())
 }).catch(()=>{updBusy=false})}
setTimeout(checkUpdate,4000);setInterval(()=>{if(!document.hidden)checkUpdate()},30*MIN);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(WALL)load();tick();if(!WALL)checkLife();render();scheduleNext();pump()}});
addEventListener('storage',e=>{if(e.key===KEY&&WALL){load();render();scheduleNext()}});
})();
</script>
