name: Androidの壁紙アプリを組み立てる
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APKを組み立てる
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: ファイル名を整える
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RedBeeTank.apk
      - name: リリースに置く
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: レッドビー水槽 壁紙アプリ（最新版）
          body: スマホでこのページを開き、下の RedBeeTank.apk を押してダウンロード・インストールしてください。
          files: RedBeeTank.apk
          make_latest: true
