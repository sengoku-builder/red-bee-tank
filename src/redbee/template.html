<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レッドビー水槽</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1013;color:#eef6f4;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
body.wall #ui{display:none}
#whud{display:none;position:fixed;right:18px;bottom:64px;padding:8px 12px;border-radius:12px;background:#05100e66;color:#eef6f4e6;font-size:12.5px;line-height:1.6;text-align:right;text-shadow:0 1px 3px #000c;pointer-events:none;font-variant-numeric:tabular-nums}
#whud b{font-size:15px}
body.wall.showhud #whud{display:block}
@media (max-aspect-ratio:1/1){#whud{bottom:16vh;right:12px;font-size:12px}}
.glass{background:#07100fd0;border:1px solid #dff3ee40;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hud{position:absolute;top:12px;left:12px;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.65;min-width:170px}
.hud b{font-size:17px;font-variant-numeric:tabular-nums}
.hud .muted{color:#b6c9c4}
.dock{position:absolute;right:12px;bottom:12px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:#eef6f4;border-radius:12px;padding:9px 13px;cursor:pointer}
button.glass:hover{border-color:#dff3ee90}
button:disabled{opacity:.42;cursor:default}
.panel{display:none;position:absolute;right:12px;bottom:62px;width:min(380px,calc(100% - 24px));max-height:70%;overflow:auto;padding:16px;border-radius:16px;box-shadow:0 14px 40px #0009}
.panel.open{display:block}
.panel h2{font-size:17px;margin:0 0 8px}
.panel p{font-size:13px;color:#c3d4cf;line-height:1.6;margin:6px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #ffffff1c}
.item small{display:block;color:#b6c9c4;font-size:12px;margin-top:2px;line-height:1.45}
.item .price{color:#ffd9a0;font-variant-numeric:tabular-nums}
.item button{white-space:nowrap;padding:7px 11px;font-size:13px}
.note{border-top:1px solid #ffffff1c;padding:10px 0}
.note h3{font-size:14px;margin:0 0 4px;color:#ffd9a0}
.note div{font-size:13px;line-height:1.7;color:#d6e4e0}
.log{font-size:12.5px;line-height:1.8;color:#c3d4cf}
.close{margin-top:10px}
.modal{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 28px));padding:20px;border-radius:18px;text-align:center;box-shadow:0 18px 50px #000a}
.modal.open{display:block}
.modal h2{margin:0 0 6px;font-size:18px}
.modal .tag{font-size:12px;color:#ffd9a0;letter-spacing:.08em}
.modal .body{font-size:14px;line-height:1.8;text-align:left;margin:10px 0 14px;color:#dbe8e4}
.big{font-size:44px;font-weight:700;margin:8px 0;color:#ffd9a0;font-variant-numeric:tabular-nums}
.toast{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:10px 15px;border-radius:13px;font-size:14px;text-align:center}
.toast.show{display:block}
.debug{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.debug button{font-size:12px;padding:6px 9px}
#lay{position:absolute;inset:0;display:none;touch-action:none;cursor:grab}
.modal,.toast{z-index:30}
body.layout #lay{display:block}
body.layout .dock,body.layout .hud,body.layout .debug{display:none}
.tray{display:none;position:absolute;left:10px;right:10px;bottom:10px;padding:8px;border-radius:14px;gap:6px;overflow-x:auto;white-space:nowrap}
body.layout .tray{display:flex}
.tray button{flex:0 0 auto;font-size:12px;padding:7px 9px}
.ltool{display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:7px;border-radius:13px;gap:6px}
.ltool.show{display:flex}
.ltool button{font-size:13px;padding:7px 10px;white-space:nowrap}
@media(max-width:600px){.dock button{font-size:12px;padding:9px 2px;white-space:nowrap}.ltool{left:10px;right:10px;transform:none;justify-content:center}.lhint{max-width:none;right:10px}}
.lhint{display:none;position:absolute;left:12px;top:12px;font-size:12px;padding:7px 10px;border-radius:10px;max-width:60%}
body.layout .lhint{display:block}
.sec{margin:14px 0 2px;font-size:13px;color:#ffd9a0;font-weight:700}
.gr{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:#ffffff1a;margin-left:4px}
.item .btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.thumb{flex:0 0 56px;width:56px;height:56px;border-radius:10px;background:#1b2e2a;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;font-size:28px}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb canvas{width:100%;height:auto;display:block}
.item>.info{flex:1;min-width:0}
#mImg .bigimg{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;min-height:120px;background:#1b2e2a;border-radius:12px;padding:10px}
#mImg .bigimg img{max-width:100%;max-height:46vh;object-fit:contain}
#mImg .bigimg canvas{width:100%;height:auto;display:block}
#mImg .bigimg figure{margin:0;text-align:center;font-size:12px;color:#c3d4cf;flex:1 1 0;min-width:0}
.ttag{position:absolute;pointer-events:none}.debug[hidden]{display:none}
@media(max-width:600px){
 .hud{top:10px;left:10px;font-size:12px;padding:8px 11px}.hud b{font-size:15px}
 .dock{right:10px;bottom:10px;left:10px}.dock button{flex:1;padding:9px 6px;font-size:13px}
 .panel{right:10px;left:10px;width:auto;bottom:60px;max-height:66%}
 .toast{top:auto;bottom:62px}
 .debug{bottom:60px}
}
</style></head>
<body>
<canvas id="gl"></canvas><canvas id="fx"></canvas>
<div id="whud"></div>
<div id="ui">
 <div class="hud glass" id="hud"></div>
 <div class="toast glass" id="toast"></div>
 <div class="dock">
  <button class="glass" id="bShop">ショップ</button>
  <button class="glass" id="bLay">レイアウト</button>
  <button class="glass" id="bLight">💡照明</button>
  <button class="glass" id="bNote">知識ノート</button>
  <button class="glass" id="bLog">記録</button>
  <button class="glass" id="bWall">壁紙表示</button>
 </div>
 <section class="panel glass" id="pShop"><h2>アクアショップ</h2><p>入門用の設備はすぐに一式そろいます。上位版は入門用を買うと解放されます。</p><div id="shopList"></div><button class="glass close" data-close>閉じる</button></section>
 <section class="panel glass" id="pNote"><h2>知識ノート</h2><div id="noteList"></div><button class="glass close" data-close>閉じる</button></section>
 <section class="panel glass" id="pLog"><h2>記録</h2><div class="log" id="logList"></div><div class="note"><h3>スマホ・PCの共有</h3><div>Googleスプレッドシートに置いた Apps Script の「ウェブアプリのURL」を貼り付けて保存すると、どの端末でも同じ水槽になります。</div>
 <input id="syncIn" placeholder="https://script.google.com/macros/s/…/exec" style="width:100%;margin:8px 0;padding:8px;border-radius:9px;border:1px solid #dff3ee55;background:#0b1715;color:#eef6f4;font:inherit;font-size:12px">
 <button class="glass" id="syncSave">保存</button> <button class="glass" id="syncCopy">壁紙用アドレスをコピー</button><label style="display:block;font-size:12.5px;margin-top:8px"><input type="checkbox" id="hudChk" checked> 壁紙の右下に状態（Gや水の様子）も表示する</label><p id="syncStat" style="font-size:12px"></p></div>
 <button class="glass close" data-close>閉じる</button> <button class="glass close" id="bReset">最初からやり直す</button></section>
 <div class="modal glass" id="mLot"><div class="tag">今日のくじ</div><h2 id="lotTitle">今日の単価を決めよう</h2><div class="big" id="lotBig">？</div><p class="body" id="lotMsg" style="text-align:center">くじを引くと、今日1日（0時から）の1分あたりのGが決まります。</p><button class="glass" id="bDraw">くじを引く</button></div>
 <div class="modal glass" id="mImg"><div class="tag" id="miTag">商品の画像</div><h2 id="miTitle"></h2><div class="bigimg" id="miBox"></div><button class="glass" id="miClose">閉じる</button></div>
 <div class="modal glass" id="mNote"><div class="tag">知識カード</div><h2 id="mnTitle"></h2><div class="body" id="mnBody"></div><button class="glass" id="bNoteOk">わかった</button></div>
 <div id="lay"></div>
 <div class="lhint glass" id="lhint">水草や石をドラッグして配置。上下に動かすと奥・手前に移動します。</div>
 <div class="ltool glass" id="ltool"><button class="glass" id="lFlip">左右反転</button><button class="glass" id="lTrim">トリミング</button><button class="glass" id="lBack">しまう</button><button class="glass" id="lBuy" style="display:none"></button><button class="glass" id="lCancel" style="display:none">やめる</button></div>
 <div class="tray glass" id="tray"></div>
 <div class="debug" id="debug" hidden><button class="glass" data-skip="3600000">＋1時間</button><button class="glass" data-skip="86400000">＋1日</button><button class="glass" id="bAddShrimp">メス＋1</button><button class="glass" id="bAddMale">オス＋1</button><button class="glass" data-skip="864000000">＋10日</button><button class="glass" id="bRich">＋1万G</button></div>
</div>
<script>
(()=>{
'use strict';
const IMG='__IMG__';
const FIL=__FILTER__;
const THM=__THERM__;
const HTR=__HEATER__;
const SHRS=__SHRIMPS__;
const LAYOUT_IMG=__LAYOUT__;
const KEY='redBeeTank_v2',SCALE=3,BASE=1,IW=__IW__,IH=__IH__,MIN=60000,DAY=86400000;
const qs=new URLSearchParams(location.search),DEBUG=qs.has('debug'),PARAM_WALL=qs.has('wallpaper');
const $=id=>document.getElementById(id);

/* ---------- 保存データ ---------- */
const blank=()=>({ver:2,layout:[],inv:{},shrimp:[],g:8000,created:Date.now(),lastTick:Date.now(),rates:{},owned:{},notes:[],log:[],offset:0});
let S;
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=blank()}
// 旧バージョン（1分10G時代）のデータを新しい単位に直す
if(S.ver!==2){S.ver=2;S.g=S.g/10;for(const k in S.rates)S.rates[k]=({10:1,15:2,20:2,30:3})[S.rates[k]]||1;S.layout=S.layout||[];S.inv=S.inv||{}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=()=>Date.now()+(S.offset||0);
const pad=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const G=n=>Math.floor(n).toLocaleString('ja-JP')+'G';
const rnd=(a,b)=>a+Math.random()*(b-a);
function addLog(s,at){const d=new Date(at||now());S.log.unshift((d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'　'+s);if(S.log.length>60)S.log.length=60}

/* ---------- お金：閉じていた間も日ごとの単価で精算 ---------- */
function tick(){
 const t=now();let a=S.lastTick;
 while(a<t){const e=Math.min(t,dayStart(a)+DAY);S.g+=(e-a)/MIN*(S.rates[dkey(a)]||BASE);a=e}
 S.lastTick=Math.max(S.lastTick,t);
}

/* ---------- くじ ---------- */
const LOT=[[1,67,'今日は通常運転。コツコツ貯めよう。'],[2,25,'いい日！今日は1分2G！'],[3,8,'大当たり！今日は1分3G。何かいいことがあるかも…！']];
function drawLot(){
 tick();const t=now(),k=dkey(t);if(S.rates[k])return;
 let r=Math.random()*100,pick=LOT[0];for(const L of LOT){if((r-=L[1])<0){pick=L;break}}
 S.rates[k]=pick[0];
 const from=Math.max(dayStart(t),S.created);S.g+=(pick[0]-BASE)*Math.max(0,t-from)/MIN; // 0時からさかのぼって適用
 for(const d of Object.keys(S.rates))if(d<dkey(t-40*DAY))delete S.rates[d];
 addLog('くじ：1分'+pick[0]+'G');save();markDirty();
 $('lotTitle').textContent=pick[0]===3?'大当たり！':'今日の単価';$('lotBig').textContent=pick[0]+'G / 分';$('lotMsg').textContent=pick[2];
 $('bDraw').textContent='閉じる';$('bDraw').onclick=()=>{$('mLot').classList.remove('open');nextNote()};
 render();
}

/* ---------- 水槽の状態（ゲーム内時間＝現実の3倍） ---------- */
const gdays=ms=>ms*SCALE/DAY;
const gday=t=>Math.floor(gdays(t-S.created));          // ゲーム内の通算日
const tOfDay=d=>S.created+d*DAY/SCALE;
const has=(id,t)=>!!S.owned[id]&&S.owned[id]<=t;
function waterState(t=now()){
 let clar=Math.min(.25,gdays(t-S.created)/4*.25),mat=0;
 if(has('filter',t)){const f=gdays(t-S.owned.filter);clar=Math.max(clar,Math.min(1,f/7));mat=Math.min(1,f/21)}
 return{clar,mat};
}
const ROOM=[12,13,15,18,21,24,28,29,26,21,17,14]; // 月ごとの室内水温のめやす
const roomT=t=>ROOM[new Date(t).getMonth()];
function heating(t=now()){return (has('heater',t)||has('heater2',t))&&roomT(t)<23}
function waterTemp(t=now()){
 let r=roomT(t);
 if(has('heater2',t))r=Math.max(r,23);                       // 温度調整式：安定して23℃
 else if(has('heater',t)){                                    // 入門用：真冬は力不足、日によって±1℃ぶれる
  let h=r<=13?22:23;const dd=new Date(t),j=Math.round(Math.sin(dd.getFullYear()*372+dd.getMonth()*31+dd.getDate())*1.2);
  r=Math.max(r,h+Math.max(-1,Math.min(1,j)));
 }
 if(has('fan',t))r=Math.min(r,26);return r}
function lighting(){
 const d=new Date(now()),h=d.getHours()+d.getMinutes()/60;
 const on=(a,b)=>Math.max(0,Math.min(1,Math.min(h-a,b-h)/.5+.5));
 const man=(S.lightOn||0)>now();  // ボタンで手動点灯中（3時間で自動解除）
 if(S.owned.light2){const l=man?1:on(9,19);return{bright:.42+.6*l,night:(1-l)*.85,lit:l>.5}}
 if(S.owned.light){const l=man?1:on(9,19);return{bright:.42+.44*l,night:(1-l)*.85,lit:l>.5}}
 const r=on(6.5,20.5);return{bright:.5+.24*r,night:(1-r)*.7,lit:false};
}

/* ---------- 知識カード ---------- */
const NOTES={
 start:['水槽の立ち上げ','ソイルを敷いて水を張ったばかりの水槽は、細かい粒が舞って白くにごっています。レッドビーシュリンプの水槽には、水を弱酸性に保ってくれる「ソイル」という土がよく使われます。<br>まだ生き物を入れられる状態ではありません。まずはろ過フィルターを用意しましょう。'],
 filter:['スポンジフィルター','エアポンプの空気で水を循環させるフィルターです。スポンジに住みつくバクテリアが、エビのフンや食べ残しから出る有害な物質を分解してくれます。<br>吸い込み口がスポンジなので稚エビが吸い込まれにくく、スポンジの表面はエビの餌場にもなります。レッドビー水槽の定番です。'],
 clear:['にごりが取れた','水が澄んできました。でも、見た目がきれいになっても「水ができた」わけではありません。<br>栄養の多いソイルは、立ち上げ直後にエビに有害なアンモニアを出すことがあります。それを分解するバクテリアが十分に増えるまで、もう少し待ちましょう。'],
 thermo:['水温計','レッドビーシュリンプの適温はおよそ20〜25℃です。特に高水温に弱く、28℃を超える状態が続くと弱ったり死んでしまったりします。<br>水温は毎日見る習慣をつけましょう。'],
 heater:['ヒーター','冬は室温とともに水温も下がります。決まった温度まで自動で温めるヒーターがあれば安心です。<br>ただし、ヒーターは温めることしかできません。夏の高水温対策には、冷却ファンなど別の道具が必要です。<br>【置き方】温かい水は上に昇るので、底の近くに横向きや斜めに付けると水槽全体が温まりやすくなります。ソイルに埋めたり触れさせたりせず、2〜3cm浮かせて吸盤で固定します。コードは奥の角に沿わせると目立ちません。水槽の外ではコードを一度下にたるませて（ドリップループ）、伝った水がコンセントに入らないようにしましょう。'],
 shrimp:['エビを迎える：水合わせ','お店の水とこの水槽の水は、水温も水質も違います。いきなり移すとエビはショックで弱ってしまいます。<br>袋ごと水槽に浮かべて水温を合わせたあと、細いチューブで水槽の水を1滴ずつ加えて、1〜2時間かけてゆっくり水質を慣らします（点滴法）。レッドビーは水質の変化に特に敏感なので、この「水合わせ」がとても大切です。'],
 berry:['抱卵','メスがお腹に卵を抱えました（抱卵）。卵は約3〜4週間でふ化します。<br>抱卵中のメスは、お腹の脚（腹肢）を動かして卵に新鮮な水を送り続けます。この時期に水温や水質が急に変わると、卵を落としてしまう「脱卵」が起きやすくなります。水換えは控えめにして、そっと見守りましょう。'],
 hatch:['稚エビの誕生','レッドビーシュリンプの卵からは、親と同じ姿の小さな稚エビ（約2mm）が生まれます。<br>稚エビは水草の陰に隠れ、そこに付く微生物を食べて育ちます。ウィローモスがあると生き残りやすくなります。親と同じくらいの大きさになるまで、3〜4か月ほどかかります。'],
 death:['エビが死んでしまったら','死んだエビは、見つけたらすぐに取り出しましょう。そのままにすると水が汚れて、ほかのエビにも悪影響が出ます。<br>何匹も続けて死ぬときは、水温・水質の急な変化や、餌のあげすぎを疑ってみましょう。'],
 heat:['夏の高水温','水温が27℃を超えました。レッドビーにとって危険な温度です。28℃以上が続くと弱って死んでしまったり、抱卵中のメスが卵を落としたりします。<br>水面に風を当てる「冷却ファン」や、部屋のエアコンで対策しましょう。'],
 fan:['冷却ファン','水面に風を当てると、水が蒸発するときに熱を奪い、水温が2〜4℃ほど下がります。<br>ただし蒸発した分だけ水が減るので、こまめに足し水をしましょう。足し水には、カルキ（塩素）を抜いた水を使います。'],
 grade:['グレードの見方','レッドビーシュリンプは日本生まれのエビです。1990年代に愛知県のブリーダー・鈴木久康さんが、黒いビーシュリンプの中に現れた赤い個体を殖やして品種にしました。<br>そこから「白をより多く、より濃く」と改良が重ねられたので、<b>白が多いほど高いグレード</b>になります。<br>見るポイントは、①白の量と濃さ（透けた白より、陶器のような厚い白）②赤の深さ（オレンジがかった赤より深い赤）③模様の形（縞が途切れず左右対称）。<br>このゲームでは、並 → S → A〜SS → SSS → 日の丸 → モスラ の順にグレードが上がります。'],
 moss:['ウィローモス','流木や石に巻き付いて育つ、丈夫な水草です。細かい葉の間に微生物がたくさん住みつくので、稚エビの隠れ家と餌場になります。<br>このゲームでも、モスがあると稚エビが生き残りやすくなります。'],
 wood:['流木のアク抜き','流木からは、水を茶色くする「アク（タンニン）」が出ます。入れる前に煮沸したり、数日〜数週間バケツの水に浸けたりしてアクを抜くのが一般的です。<br>また、樹皮が付いたままの木は水中で腐ってカビの原因になるので、アクアリウムでは樹皮をはいだ流木を使います。'],

const POP_BASE=50,ADULT=100,HATCH=25;
const popMax=()=>S.owned.filter2?100:POP_BASE;
const alive=()=>S.shrimp.filter(s=>!s.dead);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const seedOf=d=>((Math.floor(S.created/1000)%2147483647)^Math.imul(d+1,2654435761))>>>0;
function newShrimp(sex,bd,gr,R){const r=R||Math.random,rr=(a,b)=>a+r()*(b-a);
 return{id:(R?'h'+bd+'_':Date.now().toString(36))+Math.floor(r()*2176782336).toString(36),sex,bd,gr:gr??2,v:sex==='M'?2:(r()<.5?0:1),sz:sex==='M'?rr(.85,.95):rr(.95,1.08),life:Math.round(rr(450,650)),egg:null,dead:null}}
function addShrimp(sex,bd,gr){const s=newShrimp(sex,bd,gr);S.shrimp.push(s);syncActors();return s}

/* ---------- 一生のシミュレーション（ゲーム内1日ずつ） ---------- */
function migrate(){for(const s of S.shrimp){if(s.gr==null)s.gr=2;if(s.bd==null){s.bd=gday(now())-150;s.sex=s.sex||'F';s.v=s.v??(Math.random()<.5?0:1);s.sz=s.sz||s.size||1;s.life=s.life||Math.round(rnd(450,650));s.egg=s.egg??null;s.dead=s.dead??null}}}
function kill(s,cause,t){s.dead=t;s.egg=null;addLog((s.bd>gday(t)-ADULT?'稚エビ':s.sex==='M'?'オス':'メス')+'が死んでしまいました（'+cause+'）',t);unlock('death')}
function simDay(d){
 const R=mulberry32(seedOf(d)),rd=(a,b)=>a+R()*(b-a);
 const t=tOfDay(d),T=waterTemp(t),live=alive(),Q=waterQ(t),moss=S.layout.some(o=>ITEMS[o.k]&&ITEMS[o.k].moss),bad=Q.ph>=7.2||Q.gh>=9,worse=Q.ph>=7.6||Q.gh>=12;
 if(!live.length)return;
 if(T>=27)unlock('heat');
 const males=live.filter(s=>s.sex==='M'&&d-s.bd>=ADULT),male=males.length>0;
 for(const s of live){
  const age=d-s.bd,juv=age<ADULT;
  let p=0,cause='';
  if(age>=s.life){p=1;cause='寿命'}
  else if(T>=28){p=juv?.12:.08;cause='高水温'}
  else if(T>=27){p=.01;cause='高水温'}
  else if(worse){p=juv?.02:.01;cause='水質の悪化'}
  if(R()<p){kill(s,cause,t);continue}
  if(juv&&R()<(moss?.003:.006)){s.gone=1;continue}   // 稚エビの自然減（記録しない）
  if(s.egg!=null&&T>=27&&R()<.15){s.egg=null;addLog('暑さで、抱卵していたメスが卵を落としてしまいました',t);continue}
  if(s.sex==='F'&&!juv&&s.egg==null&&male&&T>=20&&T<=26&&R()<.025*(bad?.3:1)*Math.max(0,1-live.length/popMax())){s.egg=d;s.fg=males[Math.floor(R()*males.length)].gr;addLog('メスが抱卵しました',t);unlock('berry');continue}
  if(s.egg!=null&&d-s.egg>=HATCH){
   s.egg=null;
   const want=Math.round(rd(8,18)*(T<=25?1:.6)),k=Math.max(0,Math.min(want,popMax()-alive().length)),pg=((s.gr??2)+(s.fg??2))/2;
   for(let i=0;i<k;i++){const g=Math.max(0,Math.min(5,Math.round(pg+(R()+R()+R()-1.5)*1.1)));S.shrimp.push(newShrimp(R()<.5?'F':'M',d,g,R))}
   if(k>0){addLog('稚エビが'+k+'匹生まれました',t);unlock('hatch')}
  }
 }
}
function waterQ(t=now()){ // pH・硬度（青龍石で少しずつ上がる）
 const d=gday(t);let k=0;for(const o of S.layout)if(ITEMS[o.k]&&ITEMS[o.k].seiryu)k+=Math.min(1,Math.max(0,d-(o.at??d))/10);
 return{ph:Math.min(7.9,6.4+.3*k),gh:Math.min(15,4+2*k)};
}
function simulate(){
 const today=gday(now());
 if(S.simDay==null)S.simDay=today;
 let n=0;while(S.simDay<today&&n++<3000){S.simDay++;simDay(S.simDay)}
 const t=now(),before=S.shrimp.length;
 S.shrimp=S.shrimp.filter(s=>!s.gone&&(!s.dead||t-s.dead<DAY));   // 亡骸は現実の1日で片付ける
 if(n||S.shrimp.length!==before)syncActors();
}

function syncActors(){
 const ids=new Set(S.shrimp.map(s=>s.id));
 for(let i=actors.length-1;i>=0;i--)if(!actors[i].trial&&!ids.has(actors[i].s.id))actors.splice(i,1);

 for(const s of S.shrimp)if(!have.has(s.id))actors.push(newActor(s));

function trialShrimp(gi){
 for(let i=actors.length-1;i>=0;i--)if(actors[i].trial)actors.splice(i,1);
 const s={id:'trial',sex:'F',bd:gday(now())-150,gr:gi,v:0,sz:1,life:9999,egg:null,dead:null};

function pick(a){
 const juv=gday(now())-a.s.bd<ADULT,r=Math.random();
 if(r<.38){a.state='walk';a.t=rnd(2,6);a.vx=rnd(9,20)*(juv?.6:1);if(Math.random()<.35)a.dir*=-1}
 else if(r<.72){a.state='graze';a.t=rnd(3,9)}
 else if(r<.95||juv||a.s.egg!=null){a.state='rest';a.t=rnd(2,6)}
 else{a.state='swim';a.dir=Math.random()<.5?-1:1;a.tx=Math.min(1440,Math.max(260,a.x+a.dir*rnd(150,450)));a.dir=a.tx<a.x?-1:1;a.th=rnd(60,260);a.sx=a.x;a.t=Math.abs(a.tx-a.x)/rnd(45,75);a.T=a.t;a.z2=Math.random()}
}
function stepShrimp(dt){
 for(const a of actors){
  if(!a.s)continue;
  if(a.trial&&now()>a.trial){a.gone=1;continue}
  if(a.s.dead){a.state='dead';a.h=Math.max(0,a.h-dt*60);continue}
  a.t-=dt;a.ph+=dt*(a.state==='walk'?9:a.state==='swim'?16:a.state==='graze'?3:1.2);
  if(a.state==='walk'){a.x+=a.dir*a.vx*dt;a.z=Math.min(1,Math.max(0,a.z+Math.sin(a.ph*.07)*dt*.03));if(a.x<250||a.x>1440){a.dir=a.x<250?1:-1}}
  if(a.state==='swim'){const p=1-Math.max(0,a.t)/a.T;a.x=a.sx+(a.tx-a.sx)*p;a.h=Math.sin(p*Math.PI)*a.th;a.z+=(a.z2-a.z)*dt*.4;a.tilt=-Math.cos(p*Math.PI)*.18}

/* グレードごとの見た目（元画像の赤・白をピクセル単位で加工） */
const GC={};
function gradeCanvas(i,g){
 const key=i+'_'+g;if(GC[key])return GC[key];
 const im=simgs[i];if(!im.complete||!im.width)return null;
 const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
 if(g!==2){
  const d=x.getImageData(0,0,c.width,c.height),p=d.data,W0=c.width,H0=c.height;
  for(let y=0;y<H0;y++)for(let X=0;X<W0;X++){
   const o=(y*W0+X)*4;let r=p[o],gg=p[o+1],b=p[o+2],a=p[o+3];if(!a)continue;
   const red=Math.max(0,(r-Math.max(gg,b))/255),wht=Math.min(r,gg,b)>150&&red<.15;
   const fx=X/W0,fy=y/H0;
   if(g===0){gg+=red*75;b+=red*28;if(wht)a*=.6}
   else if(g===1){gg+=red*38;b+=red*14;if(wht)a*=.8}
   else{
    let keep=1;
    if(g===3)keep=fx<.45?1:(red>.42?1:0);                       // SSS：胴の赤を細く
    if(g===4)keep=((fx-.27)/.11)**2+((fy-.36)/.22)**2<1?1:0;      // 日の丸：頭に赤い丸
    if(g===5)keep=fx<.13?1:0;                                     // モスラ：ほぼ白
    if(!keep&&red>.04){
     const sh=.78+.22*Math.min(1,Math.max(r,gg,b)/170),k=Math.min(1,red*2.4);
     r=r*(1-k)+244*sh*k;gg=gg*(1-k)+240*sh*k;b=b*(1-k)+233*sh*k;
    }
    if(g>=3&&wht)a=Math.min(255,a*1.05);
   }
   p[o]=Math.min(255,r);p[o+1]=Math.min(255,gg);p[o+2]=Math.min(255,b);p[o+3]=a;
  }
  x.putImageData(d,0,0);
 }
 return GC[key]=c;
}

const ROT_CM={straight:24,leggy:22,droop:21,bushy:14};
function rotState(o,d=gday(now())){
 const age=d-(o.since??o.at??d),L=S.owned.light2?2:S.owned.light?1:0;
 if(L===0)return o.trim&&age<4?'bushy':age<7?'straight':'leggy';
 if(o.trim&&age<(L===2?10:15))return'bushy';
 return age<(L===2?20:30)?'straight':'droop';
}
function objGeom(o){ // 水槽画像上の位置と大きさ
 const it=ITEMS[o.k];if(!it)return null;
 const st=it.rot?rotState(o):null,key=it.rot?ROT_SPR[st]:o.k,sp=LAYOUT_IMG[key];if(!sp)return null;
 const cm=it.rot?ROT_CM[st]:it.cm,ppc=26*(.85+.3*o.z),sc=cm*ppc/(it.by==='h'||it.rot?sp.h:sp.w);
 const w=sp.w*sc,h=sp.h*sc*(1-(it.sink||0)),by=groundY(o.z)+4;
 return{key,sp,sc,w,h,x0:o.x-w/2,y0:by-h,by,it};
}
function drawObj(o,vw,L,w,t,sx,sy){
 const gm=objGeom(o);if(!gm)return;const im=limgs[gm.key];if(!im.complete)return;
 const img=tintOf('o'+gm.key+'_'+Math.round(o.z*3),im,L,w,.05+(1-o.z)*.14);
 const X=(gm.x0/IW-vw[0])/vw[2]*W,Y=(gm.y0/IH-vw[1])/vw[3]*H,Wd=gm.w*sx,Hd=gm.h*sy;
 if(X>W||X+Wd<0)return;
 const srcH=gm.sp.h*(1-(gm.it.sink||0)),sw=(gm.it.sway||0);
 ctx.save();if(o.trial)ctx.globalAlpha=.62;
 if(o.flip){ctx.translate(X+Wd/2,0);ctx.scale(-1,1);ctx.translate(-(X+Wd/2),0)}
 // 接地の影
 ctx.fillStyle='rgba(0,0,0,'+(.18*L.bright)+')';ctx.beginPath();ctx.ellipse(X+Wd/2,Y+Hd,Wd*.42,Math.max(2,Wd*.035),0,0,7);ctx.fill();
 if(!sw){ctx.drawImage(img,0,0,gm.sp.w,srcH,X,Y,Wd,Hd)}
 else{
  const N=12,ph=(o.x*.013+o.z*5);
  for(let i=0;i<N;i++){
   const f0=i/N,f1=(i+1)/N,up=1-(f0+f1)/2;
   const dx=sw*5*sx*Math.pow(up,1.6)*(Math.sin(t*1.1+ph+up*1.3)+.35*Math.sin(t*2.3+ph*2));
   ctx.drawImage(img,0,srcH*f0,gm.sp.w,srcH*(f1-f0)+1,X+dx,Y+Hd*f0,Wd,Hd*(f1-f0)+1);
  }
 }
 ctx.restore();
 if(o.trial){ctx.save();ctx.font='bold 12px system-ui,sans-serif';const tw=ctx.measureText('お試し中').width;ctx.fillStyle='rgba(255,217,160,.92)';ctx.fillRect(X+Wd/2-tw/2-6,Y-22,tw+12,18);ctx.fillStyle='#1a1408';ctx.fillText('お試し中',X+Wd/2-tw/2,Y-8);ctx.restore()}
 if(LAY.on&&LAY.sel===o){ctx.save();ctx.strokeStyle='rgba(255,217,160,.9)';ctx.setLineDash([6,5]);ctx.lineWidth=1.5;ctx.strokeRect(X-3,Y-3,Wd+6,Hd+6);ctx.restore()}
}
function drawScene(vw,L,w,t){
 const sx=W/(vw[2]*IW),sy=H/(vw[3]*IH),d=gday(now()),list=[];
 for(const o of S.layout)list.push({z:o.z-.001,o});
 for(const o of TRIAL)list.push({z:o.z-.001,o});
 for(const a of actors)list.push({z:a.z,a});
 list.sort((p,q)=>p.z-q.z);
for(let i=actors.length-1;i>=0;i--)if(actors[i].gone)actors.splice(i,1);
 for(const e of list){if(e.o)drawObj(e.o,vw,L,w,t,sx,sy);else drawShrimpOne(e.a,vw,L,w,d,sx,sy)}
 drawThermo(vw,L,w,sx,sy);
}
/* 水温計は前面ガラスに付いているので一番手前に描く（赤い液の高さ＝水温） */
let thmEmpty=null;
function drawThermo(vw,L,w,sx,sy){
 if(!S.owned.thermo||!timg.complete||!timg.width)return;
 if(!thmEmpty){const c=document.createElement('canvas');c.width=timg.width;c.height=timg.height;const x=c.getContext('2d');x.drawImage(timg,0,0);
  const dd=x.getImageData(0,0,c.width,c.height),p=dd.data,[u0,u1,v0,v1]=THM.col;
  for(let y=Math.floor(v0*c.height);y<Math.ceil(v1*c.height);y++)for(let X=Math.floor(u0*c.width);X<Math.ceil(u1*c.width);X++){const o=(y*c.width+X)*4;if(p[o]-p[o+1]>18){p[o]=222;p[o+1]=228;p[o+2]=228}}
  x.putImageData(dd,0,0);thmEmpty=c}
 const r=THM.rect,X=(r[0]/IW-vw[0])/vw[2]*W,Y=(r[1]/IH-vw[1])/vw[3]*H,Wd=r[2]*sx,Hd=r[3]*sy;
 if(X>W||X+Wd<0)return;
 ctx.drawImage(tintOf('thm',thmEmpty,L,w,.03),X,Y,Wd,Hd);
 const [u0,u1,v0,v1]=THM.col,lev=Math.max(v0,THM.y0-waterTemp()*THM.perDeg),b=L.bright;
 ctx.fillStyle='rgba('+Math.round(205*b)+','+Math.round(28*b)+','+Math.round(22*b)+',.88)';
 ctx.fillRect(X+(u0+.12*(u1-u0))*Wd,Y+lev*Hd,(u1-u0)*.76*Wd,(v1-lev)*Hd+1);
}

/* ---------- レイアウト操作 ---------- */
const LAY={on:false,sel:null,drag:null};const TRIAL=[];let curView=[0,0,1,1];
function toImg(ev){const vw=curView,DP=W/innerWidth;return{x:(ev.clientX*DP/W*vw[2]+vw[0])*IW,y:(ev.clientY*DP/H*vw[3]+vw[1])*IH}}
function renderTray(){
 const t=$('tray');t.innerHTML='';
 const done=document.createElement('button');done.className='glass';done.textContent='完了';done.onclick=exitLayout;t.append(done);
 const ks=Object.keys(S.inv).filter(k=>S.inv[k]>0);
 if(!ks.length){const p=document.createElement('span');p.style.cssText='font-size:12px;color:#c3d4cf;padding:8px';p.textContent=S.layout.length?'配置済みの物はドラッグで動かせます':'ショップで水草・流木・石を買うと、ここに並びます';t.append(p)}
 for(const k of ks){const b=document.createElement('button');b.className='glass';b.textContent=ITEMS[k].n+' ×'+S.inv[k];
  b.onclick=()=>{S.inv[k]--;const vw=curView,o={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),k,x:Math.min(1450,Math.max(220,(vw[0]+vw[2]/2)*IW+rnd(-80,80))),z:.5,flip:Math.random()<.5,at:gday(now()),since:gday(now())};
   S.layout.push(o);LAY.sel=o;save();markDirty();renderTray();showTool()};t.append(b)}
}
function showTool(){const o=LAY.sel;$('ltool').classList.toggle('show',!!o);$('lhint').style.visibility=o?'hidden':'';
 if(!o)return;const tr=!!o.trial;
 $('lTrim').style.display=!tr&&ITEMS[o.k]&&ITEMS[o.k].rot?'':'none';$('lBack').style.display=tr?'none':'';
 $('lBuy').style.display=tr?'':'none';$('lCancel').style.display=tr?'':'none';
 if(tr){const p=ITEMS[o.k].p;$('lBuy').textContent='この位置で購入（'+G(p)+'）';$('lBuy').disabled=S.g<p}}
function trialPlace(k){
 $('pShop').classList.remove('open');if(!LAY.on)enterLayout();
 const vw=curView,o={id:'t'+Date.now().toString(36),k,trial:1,x:Math.min(1450,Math.max(220,(vw[0]+vw[2]/2)*IW+rnd(-60,60))),z:.5,flip:Math.random()<.5,at:gday(now()),since:gday(now())};
 TRIAL.push(o);LAY.sel=o;showTool();toast('お試し中です。動かして見て、気に入ったら「この位置で購入」')}
$('lBuy').onclick=()=>{const o=LAY.sel;if(!o||!o.trial)return;const v=ITEMS[o.k];tick();
 if(S.g<v.p){toast('Gが足りません');return}
 S.g-=v.p;TRIAL.splice(TRIAL.indexOf(o),1);delete o.trial;o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);o.at=gday(now());o.since=o.at;S.layout.push(o);
 addLog('購入：'+v.n+'（'+G(v.p)+'）');if(v.moss)unlock('moss');if(v.cat==='wood')unlock('wood');if(v.cat==='stone')unlock('stone');if(v.seiryu)unlock('seiryu');
 save();markDirty();render();showTool();toast(v.n+'を購入して、この位置に置きました');nextNote()};
$('lCancel').onclick=()=>{const o=LAY.sel;if(!o||!o.trial)return;TRIAL.splice(TRIAL.indexOf(o),1);LAY.sel=null;showTool()};
function enterLayout(){LAY.on=true;LAY.sel=null;document.body.classList.add('layout');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));renderTray();showTool()}
function exitLayout(){LAY.on=false;LAY.sel=null;LAY.drag=null;TRIAL.length=0;document.body.classList.remove('layout');showTool();save()}
$('bLay').onclick=enterLayout;
$('bLight').onclick=()=>{
 if(!S.owned.light&&!S.owned.light2){toast('照明がありません。ショップで照明を買うと使えます');return}
 if((S.lightOn||0)>now()){S.lightOn=0;toast('自動（9時〜19時に点灯）に戻しました')}
 else{const h=new Date(now()).getHours();S.lightOn=now()+3*3600000;toast(h>=9&&h<19?'今は点灯時間です。19時を過ぎても3時間は点いたままにします':'照明を点けました。3時間たつと自動に戻ります')}
 save();markDirty();render()};
$('lFlip').onclick=()=>{if(LAY.sel){LAY.sel.flip=!LAY.sel.flip;save();markDirty()}};
$('lTrim').onclick=()=>{const o=LAY.sel;if(!o)return;o.since=gday(now());o.trim=1;addLog('ロタラをトリミングしました');unlock('trim');save();markDirty();nextNote();toast('トリミングしました。脇芽が出てこんもり茂ります')};
$('lBack').onclick=()=>{const o=LAY.sel;if(!o)return;S.layout=S.layout.filter(x=>x!==o);S.inv[o.k]=(S.inv[o.k]||0)+1;LAY.sel=null;save();markDirty();renderTray();showTool()};
const lay=$('lay');
lay.addEventListener('pointerdown',ev=>{
 const p=toImg(ev);let hit=null;
 for(const o of [...S.layout,...TRIAL].sort((a,b)=>b.z-a.z)){const g=objGeom(o);if(g&&p.x>=g.x0&&p.x<=g.x0+g.w&&p.y>=g.y0-6&&p.y<=g.by+6){hit=o;break}}
 LAY.sel=hit;showTool();
 if(hit){LAY.drag={dx:hit.x-p.x,dy:groundY(hit.z)-p.y};lay.setPointerCapture(ev.pointerId)}
 else if(panStart(ev))lay.setPointerCapture(ev.pointerId);
});
lay.addEventListener('pointermove',ev=>{if(PAN.drag){panMove(ev);return}if(!LAY.drag||!LAY.sel)return;const p=toImg(ev),o=LAY.sel;
 o.x=Math.min(1460,Math.max(210,p.x+LAY.drag.dx));o.z=Math.min(1,Math.max(0,(p.y+LAY.drag.dy-700)/88))});
lay.addEventListener('pointerup',()=>{panEnd();if(LAY.drag){const tr=LAY.sel&&LAY.sel.trial;LAY.drag=null;if(!tr){save();markDirty()}}});
migrate();syncActors();
/* 指で左右に見回す（縦長の画面だけ）。止めた位置は共有して、壁紙でも同じ場所を映す */
PAN.x=S.panX??.5;
let panSaveT=0;function savePan(){S.panX=+PAN.x.toFixed(3);save();clearTimeout(panSaveT);panSaveT=setTimeout(markDirty,1500)}
function panStart(ev){if(W/H>=IW/IH)return false;PAN.drag={x:ev.clientX,px:PAN.x,t:performance.now(),lx:ev.clientX,lt:performance.now()};PAN.v=0;return true}
function panMove(ev){const d=PAN.drag;if(!d)return;const vw=curView,k=vw[2]/(1-vw[2])/innerWidth;
 PAN.x=Math.min(1,Math.max(0,d.px-(ev.clientX-d.x)*k));const tn=performance.now();if(tn-d.lt>0){PAN.v=-(ev.clientX-d.lx)*k/((tn-d.lt)/1000)*.6;d.lx=ev.clientX;d.lt=tn}}
function panEnd(){if(!PAN.drag)return;const moved=Math.abs(PAN.x-PAN.drag.px)>.002;PAN.drag=null;if(performance.now()-0>0&&Math.abs(PAN.v)<1e-3)savePan();return moved}
const glc=$('gl');glc.style.touchAction='none';
glc.addEventListener('pointerdown',ev=>{if(PARAM_WALL)return;if(panStart(ev))glc.setPointerCapture(ev.pointerId)});
glc.addEventListener('pointermove',panMove);
glc.addEventListener('pointerup',ev=>{if(panEnd()){ev.preventDefault();PAN.justPanned=performance.now()}});

/* ---------- ループ ---------- */
let sec=0,lastPull=0;
function frame(ts){
 const dt=Math.min(.1,(ts-lastTs)/1000||0);lastTs=ts;
 if(!PAN.drag&&Math.abs(PAN.v)>1e-4){PAN.x=Math.min(1,Math.max(0,PAN.x+PAN.v*dt));PAN.v*=Math.pow(.04,dt);if(Math.abs(PAN.v)<1e-3){PAN.v=0;savePan()}}
 const w=waterState(),L=lighting(),vw=view(ts);curView=vw;
 if(gl&&prog){
  gl.viewport(0,0,W,H);
  gl.uniform1f(U.t,ts/1000);gl.uniform1f(U.clar,w.clar);gl.uniform1f(U.bright,L.bright);gl.uniform1f(U.night,L.night);
  gl.uniform1f(U.filt,S.owned.filter?1:0);gl.uniform1f(U.thermo,0);gl.uniform1f(U.heat,S.owned.heater?1:0);gl.uniform1f(U.hled,heating()?1:0);gl.uniform1f(U.tlev,THM.y0-waterTemp()*THM.perDeg);gl.uniform4f(U.vw,vw[0],vw[1],vw[2],vw[3]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 }
 ctx.clearRect(0,0,W,H);stepShrimp(dt);drawScene(vw,L,w,ts/1000);stepBubbles(dt);drawBubbles(vw,L);
 if(ts-sec>1000){sec=ts;tick();simulate();checkEvents();save();render();maybeLottery();if(SYNC.id&&ts-lastPull>(PARAM_WALL?60000:30000)){lastPull=ts;pull()}}
 requestAnimationFrame(frame);
}
const img=new Image();
const fimg=new Image(),timg=new Image(),himg=new Image();let loaded=0;
const ready=()=>{if(++loaded<4)return;
 try{if(!gl)throw 0;initGL(img,fimg)}catch(e){console.error(e);document.body.style.background='#0a1013 url('+IMG+') center/cover no-repeat';cv.style.display='none'}
 requestAnimationFrame(frame);
};
img.onload=fimg.onload=timg.onload=himg.onload=ready;
img.src=IMG;fimg.src=FIL.img;timg.src=THM.img;himg.src=HTR.img;

/* ---------- スマホ・PCの共有（Googleスプレッドシート＋Apps Script） ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const SYNC={id:qs.get('s')||lsGet('redBeeSync')||'',dirty:false,busy:false,status:'未設定'};
const syncURL=()=>'https://script.google.com/macros/s/'+SYNC.id+'/exec';
const hm=()=>new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
function packState(){const o=JSON.parse(JSON.stringify(S));delete o.offset;return o}
function adopt(st,rev){const off=S.offset||0;S=Object.assign(blank(),st);S.offset=off;S.rev=rev;if(!PAN.drag&&S.panX!=null)PAN.x=S.panX;migrate();syncActors();queue.length=0;LAY.sel=null;tick();simulate();render();save()}
let pushT=0;
function markDirty(){if(PARAM_WALL||!SYNC.id)return;SYNC.dirty=true;clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){
 if(!SYNC.id||PARAM_WALL)return;if(SYNC.busy){clearTimeout(pushT);pushT=setTimeout(push,1500);return}
 SYNC.busy=true;SYNC.dirty=false;
 try{
  const r=await fetch(syncURL(),{method:'POST',body:JSON.stringify({base:S.rev||0,state:packState()})}),j=await r.json();
  if(j.ok){S.rev=j.rev;save();SYNC.status='共有OK（'+hm()+' 保存）'}
  else if(j.state){adopt(j.state,j.rev);toast('別の端末の変更を読み込みました。直前の操作はもう一度お願いします')}
 }catch(e){SYNC.dirty=true;SYNC.status='共有できません（通信を確認中…あとで送り直します）'}
 SYNC.busy=false;showSync();
}
async function pull(){
 if(!SYNC.id||SYNC.busy)return;
 if(SYNC.dirty&&!PARAM_WALL)return push();
 SYNC.busy=true;
 try{
  const r=await fetch(syncURL()+'?t='+Date.now()),j=await r.json();
  if(!j.state){if(!PARAM_WALL){SYNC.busy=false;return push()}}
  else if((j.rev||0)!==(S.rev||0))adopt(j.state,j.rev);
  SYNC.status='共有OK（'+hm()+' 確認）';
 }catch(e){SYNC.status='共有できません（オフライン？）'}
 SYNC.busy=false;showSync();
}
function showSync(){const e=$('syncStat');if(e)e.textContent=SYNC.id?SYNC.status:'未設定（この端末だけに保存しています）';const i=$('syncIn');if(i&&!i.value&&SYNC.id)i.value=syncURL()}
$('syncSave').onclick=()=>{const v=$('syncIn').value.trim(),m=v.match(/\/macros\/s\/([^/?#]+)/);
 if(!m){toast('URLの形が違うようです。…/macros/s/○○○/exec の形のURLを貼ってください');return}
 SYNC.id=m[1];lsSet('redBeeSync',SYNC.id);SYNC.status='接続中…';showSync();pull().then(()=>toast('共有を設定しました'))};
$('syncCopy').onclick=()=>{if(!SYNC.id){toast('先に共有のURLを保存してください');return}
 const u=location.origin+location.pathname+'?wallpaper&s='+encodeURIComponent(SYNC.id)+($('hudChk').checked?'':'&nohud');
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('壁紙用アドレスをコピーしました'),()=>prompt('このアドレスをコピーしてください',u))};
$('bLog').addEventListener('click',showSync);

/* ---------- 起動 ---------- */
function maybeLottery(){
 if(PARAM_WALL||document.body.classList.contains('wall')||S.rates[dkey(now())]||$('mLot').classList.contains('open')||$('mNote').classList.contains('open'))return;
 $('lotTitle').textContent='今日の単価を決めよう';$('lotBig').textContent='？';$('lotMsg').textContent='くじを引くと、今日1日（0時から）の1分あたりのGが決まります。';$('bDraw').textContent='くじを引く';$('bDraw').onclick=drawLot;$('mLot').classList.add('open');
}
tick();simulate();maybeLottery();
checkEvents();save();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();checkEvents();render();maybeLottery();pull()}});
if(SYNC.id)pull();
})();
</script>
