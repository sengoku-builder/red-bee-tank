const smooth=(x,y,k,dt)=>x+(y-x)*Math.min(1,dt*k);
function animate(t,dt){
 const arr=new Float32Array(N*4);
 st.forEach((s,i)=>{
  s.next-=dt;
  if(s.next<=0){
   const r=Math.random();
   if(r<.40){s.tiltT=(Math.random()<.5?-1:1)*rnd(.07,.13);s.next=rnd(3,6)}        // ゆっくり首をかしげる（4〜7度）
   else if(r<.60){s.tiltT=0;s.next=rnd(2.5,5)}                                    // 正面に戻る
   else if(r<.80){s.puffT=rnd(.03,.045);s.puffHold=rnd(1.2,2.2);s.next=rnd(3,6)}  // ふわっとふくらむ
   else{s.leanT=(Math.random()<.5?-1:1)*rnd(.18,.3);s.leanHold=rnd(2,4);s.next=rnd(4,7)} // 隣に寄りかかる
  }
  if(s.puffT>0&&s.puff>s.puffT*.95){s.puffHold-=dt;if(s.puffHold<=0)s.puffT=0}
  if(s.leanT!==0&&Math.abs(s.lean-s.leanT)<.02){s.leanHold-=dt;if(s.leanHold<=0)s.leanT=0}
  s.tilt=smooth(s.tilt,s.tiltT,1.1,dt);
  s.puff=smooth(s.puff,s.puffT,s.puffT?1.3:.7,dt);
  s.lean=smooth(s.lean,s.leanT,.8,dt);
  arr[i*4]=.012*Math.sin(t*s.sp+s.ph)+s.puff;arr[i*4+1]=s.tilt;arr[i*4+2]=s.lean;arr[i*4+3]=0;
 });
 gl.uniform4fv(U('anim'),arr);
}
function view(){const s=W/H,a=IW/IH;if(s<a){const vw=s/a;return[(1-vw)/2,0,vw,1]}const vh=a/s;return[0,(1-vh)/2,1,vh]}
// 雪
const flakes=[];for(let i=0;i<170;i++)flakes.push({x:Math.random(),y:Math.random(),z:Math.random(),ph:Math.random()*9});
function snow(dt){ctx.clearRect(0,0,W,H);for(const f of flakes){f.y+=dt*(.015+.045*f.z);f.ph+=dt*(.5+f.z);if(f.y>1.05){f.y=-.05;f.x=Math.random()}
 const x=(f.x+Math.sin(f.ph)*.012)*W,y=f.y*H,r=(.8+f.z*f.z*4.5)*DPR;ctx.globalAlpha=.25+.6*f.z;
 if(f.z>.85){ctx.filter='blur('+(1.5*DPR)+'px)'}else ctx.filter='none';
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.filter='none'}
let last=0;
function frame(ts){const dt=Math.min(.1,(ts-last)/1000||0),t=ts/1000;last=ts;
 gl.viewport(0,0,W,H);const v=view();gl.uniform4f(U('vw'),v[0],v[1],v[2],v[3]);gl.uniform1f(U('t'),t);animate(t,dt);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 snow(dt);requestAnimationFrame(frame)}
})();
