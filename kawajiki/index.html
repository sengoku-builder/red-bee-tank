<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>河川敷の少年野球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: full-bleed canvas scene; small scoreboard + settings float top-right */
:root{
  --ink:#2a3142; --paper:#fffcf3; --line:#ddd4bd; --chip:#f1ead7; --navy:#24418a; --muted:#6b7286;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
body{height:100%;margin:0;background:#9cc7e6;color:var(--ink);font-family:var(--font);overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.board{background:rgba(32,58,44,.82);color:#f4f1e4;border-radius:10px;padding:6px 10px 7px;font-size:13px;line-height:1.35;min-width:132px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.board .row{display:flex;justify-content:space-between;gap:14px}
.ls{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px;color:#f4f1e4}
.ls td,.ls th{color:inherit;font-family:var(--font)}
.ls th{font-weight:500;font-size:10.5px;opacity:.7;padding:0 0 2px;text-align:center;min-width:15px}
.ls td{text-align:center;padding:1px 0;min-width:15px}
.ls td.tn{text-align:left;padding-right:8px;max-width:5.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls .tot{font-weight:700;padding-left:6px;min-width:20px}
.ls td.now{color:#f6d23a}
.board .sc{font-variant-numeric:tabular-nums;font-weight:700}
.board .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px;padding-top:3px;border-top:1px solid rgba(244,241,228,.25);font-size:12px}
.bso{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.lr{display:flex;align-items:center;gap:4px}
.lr b{width:12px;font-size:11px;font-weight:700;opacity:.85}
.lp{width:10px;height:10px;border-radius:50%;background:rgba(244,241,228,.16);display:inline-block}
.lp.g.on{background:#3fd172}.lp.y.on{background:#f6d23a}.lp.r.on{background:#f04b3e}
.appbtn{font-family:var(--font);font-size:14px;font-weight:700;border:0;border-radius:10px;padding:10px;background:var(--navy);color:#fff;cursor:pointer}
.phase{background:rgba(32,58,44,.78);color:#f4f1e4;border-radius:10px;padding:5px 10px;font-size:13px}
#gear{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,252,243,.78);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#gear:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#panel{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 20px));background:var(--paper);border-radius:14px;padding:14px 14px 12px;box-shadow:0 6px 24px rgba(20,30,40,.25);display:flex;flex-direction:column;gap:12px;font-size:14px}
#panel h2{font-size:15px;margin:0;font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.05em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button,.chips button{font-family:var(--font);font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 0;cursor:pointer}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.trow{display:flex;align-items:center;gap:8px}
.trow input{flex:1;min-width:0}
.tval{font-variant-numeric:tabular-nums;width:44px;text-align:right}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.wp #gear{display:none}
[hidden]{display:none!important}
#sheet{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto;background:var(--paper);border-radius:16px;box-shadow:0 8px 30px rgba(20,30,40,.3);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh-head .seg{flex:1;grid-template-columns:repeat(2,1fr);max-width:260px}
.xbtn{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.sh-body{flex:1;overflow:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:14px}
.sh-body h3{font-size:14px;margin:0 0 6px;font-weight:700}
.tpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tpick button{font-family:var(--font);font-size:14px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.tpick button[aria-pressed="true"]{border-color:var(--navy)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.field{display:flex;flex-direction:column;gap:5px}
.field input[type=text]{font-family:var(--font);font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{display:flex;align-items:center;gap:5px;font-family:var(--font);font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px 4px 5px;cursor:pointer;color:var(--ink)}
.sw button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.sw .dot{width:16px;height:16px}
.roster{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:34px 1fr 92px;gap:6px;align-items:center}
.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:center;background:var(--chip);border-radius:6px;padding:6px 0;font-size:13px}
.prow input{font-family:var(--font);font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.gseg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.gseg button{font-family:var(--font);font-size:12px;border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:6px 0;cursor:pointer;color:var(--ink)}
.gseg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;width:100%}
.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th{font-weight:700;color:var(--muted);font-size:11.5px}
.tbl td:first-child,.tbl th:first-child,.tbl .l{text-align:left}
.log li{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line);list-style:none;font-variant-numeric:tabular-nums}
.log{margin:0;padding:0}
.danger{font-family:var(--font);font-size:13px;border:1px solid #d9a4a0;background:#fff;color:#a5372f;border-radius:8px;padding:7px 10px;cursor:pointer;align-self:flex-start}
</style>

<div id="stage">
  <canvas id="cv" aria-label="堤防の上から河川敷の少年野球を眺める動く壁紙"></canvas>
  <div id="hud">
    <div class="board" id="board" hidden>
      <table class="ls" id="ls"><thead><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th class="tot">計</th></tr></thead>
        <tbody><tr id="lsA"><td class="tn"></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="tot"></td></tr>
        <tr id="lsH"><td class="tn"></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="tot"></td></tr></tbody></table>
      <div class="meta"><span id="inn">1回オモテ</span></div>
      <div class="bso" id="bso">
        <div class="lr"><b>B</b><i class="lp g"></i><i class="lp g"></i><i class="lp g"></i></div>
        <div class="lr"><b>S</b><i class="lp y"></i><i class="lp y"></i></div>
        <div class="lr"><b>O</b><i class="lp r"></i><i class="lp r"></i></div>
      </div>
    </div>
    <div class="phase" id="phase" hidden></div>
    <button id="gear" aria-label="設定" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#fffcf3"/><circle cx="15" cy="12" r="2" fill="#fffcf3"/><circle cx="8" cy="18" r="2" fill="#fffcf3"/></svg>
    </button>
  </div>
  <div id="panel" hidden>
    <h2>設定</h2>
    <div>
      <div class="lbl">吹き出しの量</div>
      <div class="seg" id="talkSeg">
        <button data-v="3">にぎやか</button><button data-v="2">ふつう</button><button data-v="1">ポツポツ</button><button data-v="0">なし</button>
      </div>
    </div>
    <div>
      <div class="lbl">選手の名前</div>
      <div class="seg" id="nameSeg" style="grid-template-columns:repeat(3,1fr)">
        <button data-v="2">全員</button><button data-v="1">打者・走者・投手</button><button data-v="0">なし</button>
      </div>
    </div>
    <div>
      <div class="lbl">時間帯</div>
      <div class="chips" id="timeChips">
        <button data-h="now">いまの時刻</button><button data-h="6.3">夜明け</button><button data-h="7.6">朝練</button>
        <button data-h="11">試合</button><button data-h="15.8">グラウンド整備</button><button data-h="20">夜</button>
      </div>
      <div class="trow" style="margin-top:8px">
        <input type="range" id="hourR" min="0" max="23.75" step="0.25" aria-label="時刻を指定">
        <span class="tval" id="hourV">--:--</span>
      </div>
    </div>
    <button class="appbtn" id="bTeams" style="background:#2f6b4a">チーム・成績</button>
    <div id="appBox" hidden><button class="appbtn" id="bWp">この野球場を壁紙にする</button></div>
    <p class="note">朝練7:00〜、試合8:30〜15:30、整備〜16:30、夕方以降は誰もいないグラウンドになります。スマホでは指で左右に見回せます。</p>
  </div>
</div>

<div id="sheet" hidden role="dialog" aria-label="チームと成績">
  <div class="sh-head">
    <div class="seg" id="shTabs"><button data-t="team" aria-pressed="true">チーム登録</button><button data-t="stats">成績</button></div>
    <button class="xbtn" id="shClose" aria-label="閉じる">×</button>
  </div>
  <div class="sh-body" id="shBody"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), cx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0], chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- settings ---------- */
const S={talk:2, hour:null, names:2};
try{const v=JSON.parse(localStorage.getItem('kawajiki.v1')||'{}'); if(v.talk!=null)S.talk=v.talk;if(v.names!=null)S.names=v.names;}catch(e){}
function saveS(){try{localStorage.setItem('kawajiki.v1',JSON.stringify({talk:S.talk,names:S.names}))}catch(e){}}
const BUILD='20261104104207';
const SPEED=clamp(+(new URLSearchParams(location.search).get('speed')||1),1,30);
const WALL=new URLSearchParams(location.search).has('wallpaper')||location.hash==='#wallpaper';
if(WALL)document.body.classList.add('wp');
function loadS(){try{const v=JSON.parse(localStorage.getItem('kawajiki.v1')||'{}');if(v.talk!=null)S.talk=v.talk;if(v.names!=null)S.names=v.names}catch(e){}}

/* ---------- world projection ---------- */
const CX=600, HZ=210, F=1075, D=35, CH=14;
function P(x,z,y=0){const k=F/(z+D);return{x:CX+x*k,y:HZ+(CH-y)*k,k}}
const BASES=[[0,0],[16.3,16.3],[0,32.6],[-16.3,16.3]];
const POSN=['P','C','1B','2B','3B','SS','LF','CF','RF'];
const POS={P:[0,15.6],C:[0,-1.25],'1B':[14.6,19.5],'2B':[6.8,28.5],'3B':[-14.6,19.5],SS:[-6.8,28.5],LF:[-23,45],CF:[0,52],RF:[23,45]};

/* ---------- teams ---------- */
const HOME={name:'かもめ',cap:'#25408a',capD:'#182c63',body:'#f7f6ef',trim:'#25408a',pants:'#f4f3ec',sock:'#25408a',
  names:['はると','そうた','ゆうま','りく','こうた','ひなた','いつき','みなと','あさひ']};
const AWAYS=[
 {name:'ドジャース',cap:'#1e4fa1',capD:'#143a7a',body:'#f7f6ef',trim:'#1e4fa1',pants:'#f4f3ec',sock:'#1e4fa1'},
 {name:'ヤンキース',cap:'#1c2841',capD:'#10182a',body:'#f4f4f0',trim:'#1c2841',pants:'#f4f4f0',sock:'#1c2841'},
 {name:'カブス',cap:'#1d4aa0',capD:'#123274',body:'#f7f6ef',trim:'#c8323a',pants:'#f4f3ec',sock:'#1d4aa0'},
 {name:'パドレス',cap:'#4b3a2a',capD:'#33271b',body:'#f1ece0',trim:'#d9a42b',pants:'#f1ece0',sock:'#4b3a2a'},
 {name:'マリナーズ',cap:'#173a63',capD:'#0e2645',body:'#bfc6cf',trim:'#0f7b72',pants:'#e9ebee',sock:'#173a63'},
 {name:'エンゼルス',cap:'#b4232e',capD:'#82171f',body:'#f7f6ef',trim:'#b4232e',pants:'#f4f3ec',sock:'#b4232e'},
 {name:'レッドソックス',cap:'#1b2a46',capD:'#101a2e',body:'#f7f6ef',trim:'#c3303c',pants:'#f4f3ec',sock:'#c3303c'},
 {name:'ジャイアンツ',cap:'#26262b',capD:'#141417',body:'#f1ece0',trim:'#ec6a2c',pants:'#f1ece0',sock:'#26262b'},
];
const GIRL_NAMES=['あおい','さくら','ゆい','みお','ほのか','りお','ひまり','こはる','めい','ゆずき','つむぎ','あかり'];
const SKINS=['#ffd8bb','#f9cfae','#f3c6a2','#ffe0c8','#eebd98'];
const HAIRS=['#3a2a20','#2d241f','#4a3426','#33281f'];

/* ---------- sim time & coroutines ---------- */
let simT=0, waiters=[], epoch=0;
function sleep(s){return new Promise(res=>waiters.push({t:simT+s,res}))}

/* ---------- entities ---------- */
let ents=[];
class Ent{
  constructor(o){Object.assign(this,{kind:'kid',x:0,z:0,tx:null,tz:null,speed:3,size:1,phase:Math.random()*6,seed:Math.random()*10,
    idlePose:'stand',idleFace:'f',poseO:null,poseUntil:0,faceO:null,stunUntil:0,fallDir:1,dizzy:false,res:null,moving:false,mface:'f',
    skin:pick(SKINS),hair:pick(HAIRS),talkUntil:0,blinkAt:rnd(1,4)},o);
    if(this.tx==null){this.tx=this.x;this.tz=this.z}
  }
  goto(x,z,sp){this.tx=x;this.tz=z;if(sp)this.speed=sp;if(this.res){this.res();}return new Promise(r=>{this.res=r})}
  walkTo(x,z,sp){this.tx=x;this.tz=z;if(sp)this.speed=sp}
  place(x,z){this.x=this.tx=x;this.z=this.tz=z}
  setPose(p,dur,face){this.poseO=p;this.poseUntil=simT+dur;this.faceO=face||null}
  fall(dur,dir,dizzy=true){this.stunUntil=simT+dur;this.fallDir=dir;this.dizzy=dizzy;this.poseO=null}
  get pose(){
    if(this.stunUntil>simT)return'fall';
    if(this.poseO)return this.poseO;
    if(this.moving)return this.speed>2.4?'run':'walk';
    return this.idlePose;
  }
  get facing(){
    if(this.poseO&&this.faceO)return this.faceO;
    if(this.moving)return this.mface;
    return this.idleFace;
  }
  update(dt){
    if(this.poseO&&simT>this.poseUntil){this.poseO=null;this.faceO=null}
    if(this.stunUntil>simT)return;
    const dx=this.tx-this.x,dz=this.tz-this.z,d=Math.hypot(dx,dz);
    if(d>0.04){
      const st=Math.min(d,this.speed*dt);this.x+=dx/d*st;this.z+=dz/d*st;this.moving=true;
      this.phase+=dt*(this.speed*2.6+2);
      this.mface=Math.abs(dx)>Math.abs(dz)*0.7?(dx>0?'r':'l'):(dz>0?'b':'f');
    }else{
      this.x=this.tx;this.z=this.tz;this.moving=false;
      if(this.res){const r=this.res;this.res=null;r()}
      if(this.despawn)this.dead=true;
    }
    if(this.dog){const dg=this.dog;dg.x=this.x-this.mdir*1.3;dg.z=this.z+0.4;dg.moving=this.moving;dg.phase=this.phase;dg.mdir=this.mdir;dg.dead=this.dead}
  }
}
class Ball{
  constructor(){this.kind='ball';this.x=0;this.z=15;this.h=1;this.vis=true;this.holder=null;this.path=null}
  flyTo(x,z,dur,arc,h0,h1,ground=false){
    this.holder=null;if(this.path&&this.path.res)this.path.res();
    const p={x0:this.x,z0:this.z,h0:h0??this.h,x1:x,z1:z,h1:h1??0.12,dur:Math.max(.05,dur),arc,ground,t0:simT};
    this.path=p;return new Promise(r=>{p.res=r});
  }
  update(){
    if(this.holder){const k=this.holder;this.path=null;this.x=k.x+0.18;this.z=k.z-0.08;this.h=(k.kind==='adult'?1.15:0.8)*k.size;return}
    const p=this.path;if(!p)return;
    let u=Math.min(1,(simT-p.t0)/p.dur);
    this.x=p.x0+(p.x1-p.x0)*u;this.z=p.z0+(p.z1-p.z0)*u;
    let h=p.h0+(p.h1-p.h0)*u;
    h+=p.ground?Math.abs(Math.sin(u*Math.PI*3))*p.arc*(1-u):p.arc*4*u*(1-u);
    this.h=Math.max(0,h);
    if(u>=1){this.path=null;if(p.res){const r=p.res;p.res=null;r()}}
  }
}
class Fly{constructor(x,z){this.kind='fly';this.x=x;this.z=z;this.h=1.2;this.leave=false;this.t=Math.random()*9}
  update(dt){this.t+=dt;if(this.leave){this.h+=dt*1.2;this.x+=dt*1.5;if(this.h>9)this.dead=true}else{this.x+=Math.sin(this.t*1.3)*dt*1.2;this.z+=Math.cos(this.t*.9)*dt*0.9;this.h=1.1+Math.sin(this.t*2.1)*.35}}}
const NET={kind:'net',z:-6,update(){}};

/* ---------- speech bubbles ---------- */
let bubbles=[];
const TALK_P=[[0,0,0],[.12,.4,1],[.45,.85,1],[1,1,1]];
const TALK_MAX=[0,2,3,4];
function say(e,text,pri=0){
  if(!e||e.dead)return;
  if(Math.random()>=TALK_P[S.talk][pri])return;
  bubbles=bubbles.filter(b=>b.e!==e);
  if(bubbles.length>=TALK_MAX[S.talk]){
    const low=bubbles.slice().sort((a,b)=>a.pri-b.pri||a.born-b.born)[0];
    if(low.pri>pri)return;
    bubbles=bubbles.filter(b=>b!==low);
  }
  const ttl=1.8+text.length*.09;
  bubbles.push({e,text,pri,born:simT,ttl});e.talkUntil=simT+Math.min(ttl,1.6);
}

/* ---------- game state ---------- */
const G={ball:null,inPlay:false,home:null,away:null,score:[0,0],inning:1,top:true,outs:0,bases:[null,null,null],bat:null,field:null,ump:null,over:false,runsThis:0,flyOK:0};
const LAST=6;
const COLD={4:10,5:7};

function call(u,type,pri=2){if(!u)return;u.setPose(type==='out'?'outCall':'safe',1.4);say(u,type==='out'?'アウト!':'セーフ!',pri)}
function nearestUmp(x,z){let b=G.umps[1],bd=1e9;for(const u of G.umps.slice(1)){const d=dist(u,x,z);if(d<bd){bd=d;b=u}}return z<6?G.ump:b}
function umpsToPosts(){G.umps.forEach((u,i)=>{u.idleFace=i===0?'b':'f';u.walkTo(UMP_POS[i][0],UMP_POS[i][1],2.2)})}

/* ---------- teams in a game ---------- */
function finishTeam(def,side,kids,subs,mine,tid){
  return{def,side,kids,subs:subs.slice(),all:kids.concat(subs),order:shuffle(kids),bi:0,coach:new Ent({kind:'adult',role:'coach',team:def,size:1}),parents:[],mine,tid,pitchers:[kids[0]]};
}
function buildMine(ti,side){
  const t=DB.teams[ti],def=teamDef(t);
  const ranked=t.players.map(p=>({p,g:((DB.st.p[p.id]||{}).g||0)+Math.random()*1.2})).sort((a,b)=>a.g-b.g);
  const ks=ranked.map(({p})=>new Ent({name:p.name||`${p.num}ばん`,girl:!!p.girl,num:p.num,pid:p.id,lefty:p.bats?p.bats==='L':hashL(p.id),team:def,size:rnd(.88,1.08),spd:rnd(4.0,4.9)}));
  return finishTeam(def,side,shuffle(ks.slice(0,9)),ks.slice(9),true,t.id);
}
function hashL(id){let h=7;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)%5===0}
function buildCpu(def,side){
  const gn=shuffle(GIRL_NAMES),bn=shuffle(BOY_NAMES);
  const ks=Array.from({length:12},(_,i)=>{const girl=chance(.1);return new Ent({name:girl?gn.pop():bn.pop(),team:def,num:i+1,size:rnd(.88,1.08),girl,lefty:chance(.2),spd:rnd(4.0,4.9)})});
  return finishTeam(def,side,ks.slice(0,9),ks.slice(9),false,null);
}
function benchPos(t,k){const i=Math.max(0,t.all.indexOf(k));
  if(i<5)return[t.side*(10.9+i*1.45),-3.5];if(i<9)return[t.side*(11.4+(i-5)*1.5),-1.6];return[t.side*(12+(i-9)*1.5),.4]}
function benchIdle(t,k){const i=t.all.indexOf(k);k.role=null;k.helmet=false;k.carry=null;k.distracted=false;k.idlePose=i<5?'sit':'stand';k.idleFace=t.side<0?'r':'l'}
function sendToBench(t,k){const [x,z]=benchPos(t,k);benchIdle(t,k);k.walkTo(x,z,k.speed>2.4?3.2:2.2)}
function benchKids(t){return t.all.filter(k=>!k.role)}
function dist(a,x,z){return Math.hypot(a.x-x,a.z-z)}
function faceTo(a,b){const dx=b.x-a.x,dz=b.z-a.z;return Math.abs(dx)>Math.abs(dz)*.7?(dx>0?'r':'l'):(dz>0?'b':'f')}

/* ---------- box score ---------- */
function bx(k){if(!k||!k.pid)return null;return G.box[k.pid]||(G.box[k.pid]={g:0,pa:0,ab:0,h:0,hr:0,rbi:0,bb:0,so:0,sh:0,pg:0,po:0,pk:0,pr:0,w:0,l:0})}
function st(k,key,n=1){const b=bx(k);if(b)b[key]+=n}
function appear(k,pitch=false){const b=bx(k);if(!b)return;b.g=1;if(pitch)b.pg=1}
function bv(k,key){const b=bx(k);return b?b[key]:0}
function addOut(){G.outs++;st(fielder('P'),'po');updateHUD()}
function commitGame(){
  if(!REC)return;
  const sh=G.score[0],sa=G.score[1];
  if(sh!==sa){const win=sh>sa?G.home:G.away,lose=sh>sa?G.away:G.home;
    st(win.pitchers.slice().sort((a,b)=>bv(b,'po')-bv(a,'po'))[0],'w');
    st(lose.pitchers.slice().sort((a,b)=>bv(b,'pr')-bv(a,'pr'))[0],'l')}
  editD(d=>{
    for(const [pid,b] of Object.entries(G.box)){const s=d.st.p[pid]||(d.st.p[pid]={});for(const k in b)s[k]=(s[k]||0)+b[k]}
    [[G.home,G.away,sh,sa],[G.away,G.home,sa,sh]].forEach(([t,o,rf,ra])=>{if(!t.mine)return;
      const s=d.st.t[t.tid]||(d.st.t[t.tid]={g:0,w:0,l:0,d:0,rf:0,ra:0,vs:{}});const r=rf>ra?'w':rf<ra?'l':'d';
      s.g++;s.rf+=rf;s.ra+=ra;s[r]++;const v=s.vs[o.def.name]||(s.vs[o.def.name]={w:0,l:0,d:0});v[r]++});
    d.log.unshift({t:Date.now(),a:G.away.def.name,h:G.home.def.name,sa,sh,c:G.cold?1:0});d.log=d.log.slice(0,30);
  });
}

function updateHUD(){
  const board=$('#board'),ph=$('#phase');
  if(phaseName==='game'&&G.home){
    board.hidden=false;ph.hidden=true;
    [['#lsA',1,G.away],['#lsH',0,G.home]].forEach(([id,ti,t])=>{const tds=document.querySelectorAll(id+' td');tds[0].textContent=t.def.name;
      for(let i=0;i<6;i++){const v=(G.line&&G.line[ti][i]);tds[i+1].textContent=v==null?'':v;tds[i+1].classList.toggle('now',!G.pre&&!G.over&&G.inning===i+1&&(ti===1)===G.top)}
      tds[7].textContent=G.score[ti]});
    $('#inn').textContent=G.pre?'まもなく試合':G.over?(G.cold?'コールドゲーム':'試合終了'):`${G.inning}回${G.top?'オモテ':'ウラ'}`;
    $('#bso').hidden=!!(G.pre||G.over);
    const rows=document.querySelectorAll('#bso .lr');[G.balls||0,G.strikes||0,Math.min(2,G.outs||0)].forEach((n,r)=>rows[r].querySelectorAll('.lp').forEach((l,i)=>l.classList.toggle('on',i<n)));
  }else{
    board.hidden=true;
    const t={warmup:'朝練中',maint:'グラウンド整備',dawn:'',dusk:'',night:''}[phaseName]||'';
    ph.hidden=!t;ph.textContent=t;
  }
}

/* ---------- throwing helper ---------- */
async function throwTo(from,to,spd=15,ball=G.ball,wild=null){
  from.setPose('throw',.5,faceTo(from,to));await sleep(.28);
  const tx=wild?wild[0]:to.x,tz=wild?wild[1]:to.z;
  const d=Math.hypot(tx-from.x,tz-from.z);
  await ball.flyTo(tx,tz,Math.max(.3,d/spd),.15+d*.03,1.45*from.size,1.0);
  if(!wild){ball.holder=to;to.setPose('catchUp',.35,faceTo(to,from))}
}

/* ---------- running ---------- */
async function runBases(k,from,to,how){
  if(from===0&&how==='through'){
    await k.goto(16.6,16.3,k.spd);k.spd0=k.spd;await k.goto(21.5,21.2,k.spd);
    if(to===1){await sleep(.3);await k.goto(16.7,16.1,2.2)}
    k.idlePose='stand';k.idleFace='f';return;
  }
  for(let b=from+1;b<=to;b++){
    const [x,z]=BASES[b%4];
    await k.goto(x+(b===1?.3:0),z,k.spd);
    if(b===4){scoreRun(k);return}
  }
  if(from===0&&to===1&&how==='over'){await k.goto(13.4,19.4,k.spd*.85);await sleep(.4);await k.goto(16.6,16.3,2.4)}
  k.idlePose='stand';k.idleFace='f';
}
function advanceAll(adv,batter,batterTo,how){
  const ps=[],nb=[null,null,null];
  for(let i=2;i>=0;i--){const k=G.bases[i];if(!k)continue;const to=Math.min(i+1+adv,4);if(to<4)nb[to-1]=k;ps.push(maybeForget(k,()=>runBases(k,i+1,to)))}
  if(batter&&batterTo>0){if(batterTo<4)nb[batterTo-1]=batter;ps.push(runBases(batter,0,batterTo,how))}
  G.bases=nb;return Promise.all(ps);
}
function walkBatter(batter){
  const ps=[];const [a,b,c]=G.bases;const nb=[batter,b,c];
  if(a){nb[1]=a;ps.push(runBases(a,1,2));if(b){nb[2]=b;ps.push(runBases(b,2,3));if(c)ps.push(runBases(c,3,4))}}
  ps.push(runBases(batter,0,1));G.bases=nb;return Promise.all(ps);
}
function scoreRun(k){
  const ti=G.bat===G.home?0:1;G.score[ti]++;if(G.line)G.line[ti][G.inning-1]=(G.line[ti][G.inning-1]||0)+1;G.runsThis++;G.playRuns++;st(fielder('P'),'pr');updateHUD();
  k.role=null;k.helmet=false;
  const t=G.bat;sendToBench(t,k);
  if(chance(.4))call(G.ump,'safe',0);
  const bk=benchKids(t);bk.forEach(b=>b.setPose('cheer',2.2));
  say(pick(bk)||k,pick(['ナイスラン!','ホームイン!','やったー!']),1);
  t.parents.forEach(p=>p.setPose('cheer',2));
  if(!G.top){const lead=G.score[0]-G.score[1];if(G.inning>=LAST&&lead>0)G.walkoff='sayonara';else if(COLD[G.inning]&&lead>=COLD[G.inning])G.walkoff='cold'}
}

/* ---------- plays ---------- */
function fielder(role){return G.field.kids[POSN.indexOf(role)]}
function nearest(x,z,exclude=[]){let best=null,bd=1e9;for(const k of G.field.kids){if(exclude.includes(k.role))continue;const d=dist(k,x,z);if(d<bd){bd=d;best=k}}return best}
function resetFielders(){for(const k of G.field.kids){if(k.distracted||k.stunUntil>simT)continue;const [x,z]=POS[k.role];k.idlePose=k.role==='C'?'squat':'ready';k.idleFace=k.role==='C'?'b':'f';k.walkTo(x,z,3);k.res=null}}
async function fieldersReady(){
  for(let i=0;i<50;i++){
    if(G.field.kids.every(k=>{const p=POS[k.role];return !p||(k.stunUntil<=simT&&dist(k,p[0],p[1])<.35)}))return;
    await sleep(.2);
  }
}
function coverBases(tx){
  const left=tx<0;
  fielder('3B').walkTo(-15.8,16.7,4);fielder('1B').walkTo(16.0,16.8,4.4);
  (left?fielder('2B'):fielder('SS')).walkTo(left?.8:-.8,31.9,4.4);
  if(tx>6)fielder('P').walkTo(13.5,14.5,3.6);
}
function prepRelay(tx,tz){
  if(G.relay)return;
  const b0=G.b0||[];let tgt=2,word='バックセカン!';
  if(b0[1]||b0[2]){tgt=0;word='バックホーム!'}else if(b0[0]){tgt=3;word='バックサード!'}
  const c=fielder('C');c.idlePose='stand';c.idleFace='b';c.walkTo(0,1.2,3);say(c,word,1);
  const cut=tx<0?fielder('SS'):fielder('2B');
  const [bx,bz]=tgt===0?[0,.8]:BASES[tgt];
  cut.walkTo(bx+(tx-bx)*.55,bz+(tz-bz)*.55,4.5);
  G.relay={tgt,cut};
}
async function relayOrThrow(of){
  const r=G.relay;
  if(!r||of.z<33||of===r.cut){await throwTo(of,cutoffFor(of.x),14);return}
  await throwTo(of,r.cut,13);await sleep(.25);
  const recv=r.tgt===0?fielder('C'):r.tgt===3?fielder('3B'):(r.cut===fielder('SS')?fielder('2B'):fielder('SS'));
  if(recv&&recv!==r.cut){if(r.tgt===2)recv.walkTo(.5,32.2,4.5);await sleep(.2);await throwTo(r.cut,recv,15)}
}
function maybeForget(k,fn){
  if(G.forgot||!chance(.12))return fn();
  G.forgot=true;
  return(async()=>{await sleep(.9);say(pick(benchKids(G.bat))||G.bat.coach,`${k.name}ー!走れー!`,2);await sleep(.5);say(k,'わっ!',1);return fn()})();
}
function fakeRun(k,from){const [x,z]=BASES[(from+1)%4];return k.goto(x,z,k.spd)}
function runnersOnOut(){
  // ゴロでアウトになるとき：ツーアウトなら全員走る（得点にはならない）、そうでなければ詰まっているランナーだけ進む
  const [a,b,c]=G.bases,ps=[];
  if(G.outs>=2){[a,b,c].forEach((k,i)=>{if(k)ps.push(fakeRun(k,i+1))});return Promise.all(ps)}
  const nb=[...G.bases];
  if(a){const forced=[[a,1]];if(b){forced.push([b,2]);if(c)forced.push([c,3])}
    for(const [k,i] of forced.reverse()){nb[i-1]=null;if(i+1<4)nb[i]=k;ps.push(maybeForget(k,()=>runBases(k,i,i+1)))}}
  G.bases=nb;return Promise.all(ps);
}
function cutoffFor(x){return fielder(x<0?'SS':'2B')}
function setRole(t,k,i){k.role=POSN[i];k.helmet=k.role==='C';k.carry=null;k.idlePose=k.role==='C'?'squat':'ready';k.idleFace=k.role==='C'?'b':'f'}

async function relayToPitcher(){
  const b=G.ball,h=b.holder,p=fielder('P');
  if(!h||h===p)return;
  const cut=cutoffFor(h.x);
  if(h.z>34&&h!==cut){await throwTo(h,cut,14);await sleep(.4)}
  if(b.holder&&b.holder!==p){await sleep(.3);await throwTo(b.holder,p,11)}
}

async function playGrounder(tx,tz,d,batter){
  const b=G.ball,fb=fielder('1B');
  const f=nearest(tx,tz,['C']);f.distracted=false;
  const r=Math.random();
  let ev=r<.1?'trip':r<.22?'tunnel':r<.31?'through':r<.39?'wild':'out';
  if(f===fb&&ev==='wild')ev='out';
  const lat=dist(f,tx,tz);if(lat>3.5&&lat<9&&f!==fb&&f.role!=='P'&&chance(.4))ev='dive';
  const ftime=dist(f,tx,tz)/5;
  const bdur=ev==='dive'?Math.max(.9,d/17):Math.max(d/15,ftime+.25);
  if(f!==fb)fb.walkTo(16.0,16.8,5);
  const ext=[tx*1.65,tz*1.65];
  let runs;
  if(ev==='out'||ev==='dive'){runs=runnersOnOut()}
  else if(ev==='wild')runs=advanceAll(2,batter,2);
  else runs=advanceAll(1,batter,1,ev==='through'?'over':'through');
  const batterRun=(ev==='out'||ev==='dive')?runBases(batter,0,1,'through'):null;
  f.walkTo(tx,tz,5);
  const bp=b.flyTo(tx,tz,bdur,.35,.9,.1,true);
  if(ev==='dive'){
    const dir=tx>f.x?1:-1;
    await sleep(Math.max(.1,bdur-.45));f.x+=(tx-dir*.7-f.x)*.75;f.z+=(tz-f.z)*.75;f.tx=f.x;f.tz=f.z;f.fall(1.0,dir,false);say(f,'えいっ!',1);
    await bp;b.holder=f;await sleep(1.0);f.walkTo(f.x,f.z);
    await throwTo(f,fb,17);call(G.umps[1],'out');addOut();
    say(pick(G.field.parents),'ナイスプレー!',1);await sleep(.4);say(pick(G.field.kids),'ナイスー!',0);
    await batterRun;sendToBench(G.bat,batter);await runs;
    return'O';
  }
  if(ev==='trip'){
    await sleep(Math.min(.5,ftime*.6));f.fall(1.5,f.x<tx?1:-1);say(f,'うわっ!',2);
    await bp;
  }else if(ev==='through'){
    await sleep(bdur*.8);f.setPose('ready',.6);say(f,'うっ!',1);await bp;
  }else{
    await bp;
  }
  if(ev==='trip'||ev==='tunnel'||ev==='through'){
    if(ev==='tunnel'){f.setPose('squat',.8);say(f,'あっ…!',2)}
    const of=nearest(ext[0],ext[1],['C','P','1B','2B','3B','SS']);of.distracted=false;
    of.walkTo(ext[0],ext[1],4.6);prepRelay(ext[0],ext[1]);
    await b.flyTo(ext[0],ext[1],1.8,.2,.15,.05,true);
    await of.goto(ext[0],ext[1],4.6);b.holder=of;
    say(pick(benchKids(G.bat)),'まわれまわれー!',1);
    await sleep(.2);await relayOrThrow(of);
    await runs;if(chance(.5))call(G.umps[1],'safe',0);
    if(ev!=='through')say(pick(G.field.kids),pick(['ドンマイドンマイ!','ドンマイ!','切りかえていこー!']),1);
    if(ev==='tunnel'){await sleep(1.2);say(G.field.coach,'腰を落とせー!',1)}
    return ev==='through'?'1B':'E';
  }
  b.holder=f;f.setPose('ready',.3);await sleep(.25);
  if(ev==='wild'){
    await throwTo(f,fb,16,b,[fb.x+3.5,fb.z-4]);
    say(fb,'あ〜っ!',2);fb.walkTo(fb.x+3.5,fb.z-4,4.5);
    await sleep(1.2);b.holder=fb;
    await runs;call(G.umps[2],'safe',1);await sleep(.8);say(G.field.coach,'落ちついていけー!',1);
    return'E';
  }
  if(f===fb){await fb.goto(16.3,16.3,5)}else{await throwTo(f,fb,16)}
  call(G.umps[1],'out');addOut();
  await batterRun;sendToBench(G.bat,batter);
  await runs;
  return'O';
}

async function playFly(tx,tz,d,batter){
  const b=G.ball;
  const hang=2.1+d/28,arc=7+d*.28;
  const c=G.field.kids.filter(k=>k.role!=='C').sort((a,z)=>dist(a,tx,tz)-dist(z,tx,tz));
  const f1=c[0],f2=c[1];f1.distracted=f2.distracted=false;
  const t1=dist(f1,tx,tz)/4.6,t2=dist(f2,tx,tz)/4.6;
  let ev;
  if(t1<hang-.2&&t2<hang&&chance(.33))ev='collide';
  else if(t1>hang-.1)ev='drop';
  else ev=chance(.76)?'catch':'muff';
  const bp=b.flyTo(tx,tz,hang,arc,.9,.15);
  if(ev!=='catch'&&tz>32)prepRelay(tx,tz);
  let runs,adv=1;
  if(ev==='catch'){const two=G.outs>=2;runs=(async()=>{const ps=[batter.goto(7,7.5,batter.spd)];if(two)G.bases.forEach((k,i)=>{if(k)ps.push(fakeRun(k,i+1))});await Promise.all(ps);batter.idlePose='stand'})()}
  else{adv=ev==='collide'?2:(ev==='drop'&&d>44)?2:1;runs=advanceAll(adv,batter,adv,'over')}
  if(ev==='collide'){

async function contact(batter){

  const kind=r<.42?'grd':r<.71?'fly':r<.9?'line':'big';
  const ang=rnd(-42,42)*Math.PI/180;

  G.b0=[...G.bases];G.relay=null;G.forgot=false;coverBases(tx);

}

async function lineUp(words){
  const all=[...G.home.all,...G.away.all];
  all.forEach(k=>{k.role=null;k.helmet=false;k.distracted=false});
  const ps=[];
  [[G.home,-2.7,'r'],[G.away,2.7,'l']].forEach(([t,x,f])=>{const n=t.all.length,sp=Math.min(1.8,15.5/Math.max(1,n-1));
    t.all.forEach((k,i)=>{k.idlePose='stand';k.idleFace=f;ps.push(k.goto(x,1.0+i*sp,3.6))})});
  G.umps.forEach((u,i)=>{u.idleFace='b';ps.push(u.goto(-1.65+i*1.1,-.95,1.8))});
  await Promise.race([Promise.all(ps),sleep(22)]);
  await sleep(1.2);
  say(G.ump,'気をつけ!礼!',2);await sleep(.9);
  all.forEach(k=>k.setPose('bow',1.7));G.umps.forEach(u=>u.setPose('bow',1.7));
  say(G.away.all[4],words,2);await sleep(.3);say(G.home.all[2],words,1);
  await sleep(2.6);
}

async function playGame(){
  setupGame();
  G.pre=true;updateHUD();
  await sleep(6);
  await lineUp('おねがいしまーす!');
  G.pre=false;
  G.home.kids.forEach((k,i)=>{setRole(G.home,k,i);const[x,z]=POS[k.role];k.walkTo(x,z,4.8)});
  G.home.subs.forEach(k=>{const[x,z]=benchPos(G.home,k);benchIdle(G.home,k);k.walkTo(x,z,3.4)});
  G.away.all.forEach(k=>{const[x,z]=benchPos(G.away,k);benchIdle(G.away,k);k.walkTo(x,z,3.4)});
  G.umps.forEach((u,i)=>{u.idleFace=i===0?'b':'f';u.walkTo(UMP_POS[i][0],UMP_POS[i][1],i===0?1.8:3.6)});
  say(pick(G.home.kids),'いくぞー!',1);await sleep(.5);say(pick(G.home.kids),'おー!',0);
  say(G.ump,'プレイボール!',2);
  for(G.inning=1;;G.inning++){
    const m=COLD[G.inning];
    G.top=true;await halfInning(G.away,G.home);
    if(G.inning>=LAST&&G.score[0]>G.score[1]){G.line[0][G.inning-1]='x';updateHUD();break}
    if(m&&G.score[0]-G.score[1]>=m){G.cold=true;G.line[0][G.inning-1]='x';updateHUD();break}
    G.top=false;await halfInning(G.home,G.away);
    if(G.walkoff==='sayonara'){say(pick(benchKids(G.home)),'サヨナラだー!',2);await sleep(3);break}
    if(G.walkoff==='cold'){G.cold=true;break}
    if(m&&Math.abs(G.score[0]-G.score[1])>=m){G.cold=true;break}
    if(G.inning>=LAST)break;
    if(phaseAt(hourNow())!=='game'&&G.inning>=2)break;
  }
  if(G.cold){const w=G.score[0]>G.score[1]?G.home:G.away;say(pick(benchKids(w).length?benchKids(w):w.all),'コールドだー!',2);await sleep(1.5)}
  G.over=true;updateHUD();
  commitGame();
  say(G.ump,'ゲーム!',2);await sleep(1.5);
  await lineUp('ありがとうございましたー!');
  [G.home,G.away].forEach(t=>t.all.forEach(k=>sendToBench(t,k)));
  G.umps.forEach((u,i)=>{u.idleFace='f';u.walkTo(-4.5-i*1.2,-4.6,1.4)});
  const win=G.score[0]>G.score[1]?G.home:G.score[1]>G.score[0]?G.away:null;
  await sleep(4);
  if(win){benchKids(win).forEach(k=>k.setPose('cheer',2.5));say(pick(win.all),'かったー!',1);say(win.coach,'よくがんばった!',1)}
  else say(G.home.coach,'引き分けか〜',1);
  await sleep(26);
}

function pickMatch(){
  DB=loadD();
  const r=DB.rr||0;editD(d=>{d.rr=r+1});
  const opp=['t2','cpu','t3','cpu'][r%4];
  const homeFirst=((r%2)^(Math.floor(r/4)%2))===0;
  const me=buildMine(0,homeFirst?-1:1);
  const other=opp==='cpu'?buildCpu(pick(AWAYS),homeFirst?1:-1):buildMine(opp==='t2'?1:2,homeFirst?1:-1);
  return homeFirst?{home:me,away:other}:{home:other,away:me};
}

function setupGame(){
  ents=ents.filter(e=>!e.gameEnt);
  const {home,away:aw}=pickMatch();
  Object.assign(G,{home,away:aw,score:[0,0],inning:1,top:true,outs:0,balls:0,strikes:0,bases:[null,null,null],over:false,walkoff:false,cold:false,inPlay:false,pre:true,box:{},pchg:null,playRuns:0,line:[[],[]]});
  [home,aw].forEach(t=>{
    t.all.forEach(k=>{const[x,z]=benchPos(t,k);k.place(x,z);benchIdle(t,k);k.gameEnt=true;ents.push(k)});
    t.kids.forEach(k=>appear(k));appear(t.kids[0],true);
    t.coach.place(t.side*9.4,-2.4);t.coach.idleFace=t.side<0?'r':'l';t.coach.gameEnt=true;ents.push(t.coach);
    for(let i=0;i<4;i++){const pa=new Ent({kind:'adult',role:'parent',size:rnd(.92,1.04),idlePose:'sit',idleFace:t.side<0?'r':'l',shirt:pick(['#e7a24a','#7aa7d6','#e88b8b','#9c8bd1','#6fbf9b','#f2f2ee']),hat:chance(.5)});
      pa.place(t.side*(18.5+(i%2)*1.6),4.6+(i>>1)*1.8);pa.gameEnt=true;t.parents.push(pa);ents.push(pa)}
  });
  G.umps=[0,1,2,3].map(i=>{const u=new Ent({kind:'adult',role:'ump',size:rnd(.96,1.04),idleFace:'f'});u.place(-5-i*1.2,-4.6);u.gameEnt=true;ents.push(u);return u});G.ump=G.umps[0];
  G.ball=new Ball();G.ball.gameEnt=true;G.ball.x=0;G.ball.z=-2;G.ball.holder=G.ump;ents.push(G.ball);
  G.field=home;G.bat=aw;
  updateHUD();
}

async function ambientGame(ep){
  while(ep===epoch){
    await sleep(rnd(2.5,5.5));
    if(ep!==epoch||!G.field||G.pre||G.over)continue;
    const r=Math.random();
    if(r<.22){if(!G.inPlay)say(pick(G.field.kids.filter(k=>k.role!=='P')),pick(['バッチこーい!','打たせていこー!','しまっていこー!','声出していこー!',['ノーアウトー!','ワンアウトー!','ツーアウトー!'][G.outs]||'']),0)}
    else if(r<.42){const k=pick(benchKids(G.bat));if(k){k.setPose('cheer',1.5);say(k,pick(['いけいけー!','打てるぞー!','ファイトー!','チャンスだよー!','せーの、がんばれー!']),0)}}
    else if(r<.54){const t=chance(.5)?G.bat:G.field;say(pick(t.parents),pick([`${pick(t.kids).name}ー!がんばれー!`,'いいぞー!','がんばれー!','落ちついてー!']),0)}
    else if(r<.62){say(G.field.coach,pick(['前に出ろー!','腰落とせー!','声出していけー!',`${pick(G.field.kids).name}、集中!`,'一歩目だぞー!']),0)}
    else if(r<.70){if(!G.inPlay&&simT>G.flyOK){G.flyOK=simT+70;butterfly()}}
    else if(r<.78){if(!G.inPlay)idleBit()}
    else if(r<.83){const k=pick(benchKids(G.bat));if(k){say(k,pick(['おなかすいた〜','おにぎりまだ?','つぎ、ぼくだっけ?','あっ、電車!']),0)}}
  }
}
async function butterfly(){
  const kid=fielder(pick(['LF','CF','RF']));if(!kid)return;
  const fl=new Fly(kid.x+rnd(-4,4),kid.z+rnd(3,6));fl.gameEnt=true;ents.push(fl);
  kid.distracted=true;await sleep(1.4);
  if(!kid.distracted){fl.leave=true;return}
  say(kid,'ちょうちょだ!',1);
  for(let i=0;i<7&&kid.distracted;i++){if(!G.inPlay)kid.walkTo(fl.x,fl.z-.6,1.3);await sleep(1.1)}
  if(kid.distracted&&POS[kid.role]){say(G.field.coach,`${kid.name}ー!前見ろー!`,1);await sleep(1.1);say(kid,'はっ!',1);kid.distracted=false;const[x,z]=POS[kid.role];kid.walkTo(x,z,4.2)}
  fl.leave=true;
}

async function warmup(ep){
  DB=loadD();const t=buildMine(0,-1);const kids=t.kids;kids.forEach(k=>k.glove=true);
  const spots=[[-16,-6,22],[6,16,22],[-17,-7,35],[7,17,35]];
  const pairs=[];
  for(let i=0;i<4;i++){const a=kids[i*2],b=kids[i*2+1],[x0,x1,z]=spots[i];a.place(x0,z);b.place(x1,z+rnd(-.5,.5));a.idleFace='r';b.idleFace='l';a.idlePose=b.idlePose='ready';a.home=[x0,z];b.home=[x1,b.z];const ball=new Ball();ball.holder=a;pairs.push([a,b,ball]);ents.push(a,b,ball)}
  const runner=kids[8];runner.place(-30,20);ents.push(runner);
  t.coach.place(-8,-2);t.coach.idleFace='b';ents.push(t.coach);
  pairs.forEach(p=>catchLoop(p,ep));
  (async()=>{const path=[[-30,20],[-20,58],[20,58],[30,20],[0,-6]];let i=0;while(ep===epoch){await runner.goto(...path[i%path.length],3.2);i++;if(i%5===0){say(runner,'あと1周〜',0)}}})();
  while(ep===epoch){
    await sleep(rnd(5,9));
    if(chance(.5)){say(t.coach,pick(['声出せー!','いい球なげろー!','肩あっためとけよー!','あと10球!']),0);await sleep(.8);say(pick(kids),'はいっ!',0)}
    else say(pick(kids),pick(['いくよー!','ナイスボール!','おはよー!']),0);
  }
}
async function catchLoop([a,b,ball],ep){
  let from=a,to=b;
  while(ep===epoch){
    await sleep(rnd(.9,1.8));
    if(ep!==epoch)return;
    if(chance(.07)){
      const wx=to.x+(to===b?rnd(3,6):-rnd(3,6)),wz=to.z+rnd(-3,3);
      await throwTo(from,to,12,ball,[wx,wz]);say(to,'あっ!',1);say(from,'ごめーん!',1);
      await to.goto(wx,wz,4);ball.holder=to;await to.goto(to.home[0],to.home[1],3);to.idleFace=to===a?'r':'l';
    }else await throwTo(from,to,12,ball);
    [from,to]=[to,from];
  }
}

  const helpers=t.kids.slice(7);helpers.forEach((k,i)=>{k.place(5+i*3,-3);k.carry='rake';k.idlePose='rake';ents.push(k)});
  let dir=1,lap=0;
  while(ep===epoch){
    say(pick(crew),pick(['整備〜!','せーの!','でこぼこなくすよー!']),0);

function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,u){return a.map((v,i)=>v+(b[i]-v)*u)}
function rgb(a){return`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`}
function skyAt(h){
  let i=0;while(i<KEY.length-2&&KEY[i+1][0]<=h)i++;
  const A=KEY[i],B=KEY[i+1],u=clamp((h-A[0])/(B[0]-A[0]),0,1);
  return{top:mix(hx(A[1]),hx(B[1]),u),bot:mix(hx(A[2]),hx(B[2]),u),tint:mix(A[3],B[3],u),star:A[4]+(B[4]-A[4])*u};
}
function hourNow(){if(S.hour!=null)return S.hour;const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}
function phaseAt(h){if(h<5.5||h>=17.6)return'night';if(h<7)return'dawn';if(h<8.5)return'warmup';if(h<15.5)return'game';if(h<16.5)return'maint';return'dusk'}

  if(b.h>.05&&!b.holder){c.fillStyle='rgba(30,40,20,.22)';c.beginPath();c.ellipse(g.x,g.y,r*1.1,r*.4,0,0,7);c.fill()}
  c.fillStyle='#fffdf7';c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill();c.strokeStyle='rgba(180,60,50,.6)';c.lineWidth=r*.25;c.beginPath();c.arc(p.x,p.y,r*.6,-.8,.8);c.stroke();
}
function drawFly(c,f){const p=P(f.x,f.z,f.h);const s=Math.max(2,p.k*.12);const w=Math.abs(Math.sin(f.t*22));c.fillStyle='#fff3a3';c.strokeStyle='#d9c24a';c.lineWidth=.6;
  [-1,1].forEach(d=>{c.beginPath();c.ellipse(p.x+d*s*.55*w,p.y,s*.55*w+.3,s*.5,0,0,7);c.fill();c.stroke()})}
function drawNet(c){
  const segs=[[[-9.5,-4.4],[-7,-6]],[[-7,-6],[7,-6]],[[7,-6],[9.5,-4.4]]];const hgt=3.3;
  c.lineWidth=.6;c.strokeStyle='rgba(70,80,90,.33)';
  segs.forEach(([[x0,z0],[x1,z1]])=>{
    const n=Math.round(Math.hypot(x1-x0,z1-z0)/.5);
    for(let i=0;i<=n;i++){const u=i/n,x=x0+(x1-x0)*u,z=z0+(z1-z0)*u;const a=P(x,z,0),b=P(x,z,hgt);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
    for(let j=0;j<=8;j++){const y=j/8*hgt;const a=P(x0,z0,y),b=P(x1,z1,y);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
  });
  c.strokeStyle='#5b6470';c.lineWidth=2.4;[[-9.5,-4.4],[-7,-6],[0,-6],[7,-6],[9.5,-4.4]].forEach(([x,z])=>{const a=P(x,z,0),b=P(x,z,hgt+.1);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()});
  c.lineWidth=1.6;segs.forEach(([[x0,z0],[x1,z1]])=>{const a=P(x0,z0,hgt),b=P(x1,z1,hgt);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()});
}

/* ---------- sky dynamics ---------- */
const clouds=Array.from({length:10},(_,i)=>({x:Math.random()*1300-50,y:-340+i*52+Math.random()*30,s:.5+Math.random()*.8,v:rnd(2,5)}));
const stars=Array.from({length:110},()=>({x:Math.random()*1200,y:-450+Math.random()*700,p:Math.random()*6,s:Math.random()*1.2+.4}));
const sparkles=Array.from({length:40},()=>({x:Math.random()*1200,y:303+Math.random()*32,p:Math.random()*6,w:6+Math.random()*16}));
function drawCloud(c,cl){c.fillStyle='rgba(255,255,255,.9)';const s=cl.s;[[0,0,26],[24,-8,22],[48,0,24],[22,6,26],[-20,6,18],[66,6,16]].forEach(([dx,dy,r])=>{c.beginPath();c.arc(cl.x+dx*s,cl.y+dy*s,r*s,0,7);c.fill()})}
function drawBridge(c){
  c.fillStyle='#55707a';c.fillRect(-10,276,1220,5);
  c.strokeStyle='#5f7f86';c.lineWidth=1.6;c.beginPath();
  for(let x=-10;x<1210;x+=40){c.moveTo(x,276);c.lineTo(x+20,262);c.lineTo(x+40,276)}c.moveTo(-10,262);c.lineTo(1210,262);c.stroke();
}
function drawTrain(c,tr,lights){
  for(let i=0;i<6;i++){const x=tr.x+i*62*(tr.d>0?-1:1);if(x<-70||x>1270)continue;
    if(lights){c.fillStyle='rgba(255,225,150,.9)';for(let w=0;w<6;w++)c.fillRect(x+5+w*9,268,5,3);continue}
    c.fillStyle='#eef0ec';rr(c,x,265,58,10,2.5);c.fillStyle='#3c9a6a';c.fillRect(x,271,58,2);c.fillStyle='#6f8796';for(let w=0;w<6;w++)c.fillRect(x+5+w*9,267,5,3)}

/* ---------- camera ---------- */
let W=0,Hh=0,dpr=1,scale=1,base=1,Z=1,vw=1200,vh=800,portrait=false,stL=0,stT=0;
const cam={x:600,y:430};let manual=null,manualY=null,manualUntil=0,drag=null,pinch=null;
function zMin(){return Math.max(W/(1200*base),Hh/(1800*base),portrait?0:1)}
function applyScale(){Z=clamp(Z,zMin(),3);scale=base*Z;vw=W/scale;vh=Hh/scale}
function layout(){
  const r=$('#stage').getBoundingClientRect();W=r.width;Hh=r.height;stL=r.left;stT=r.top;dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);
  portrait=Hh>W*1.05;
  base=portrait?W/500:Math.max(W/1200,Hh/800);
  applyScale();
  renderBG(hourNow());
}
let bgTimer=0;function bgSoon(){clearTimeout(bgTimer);bgTimer=setTimeout(()=>renderBG(hourNow()),250)}
let baseX=600,panStart=null;
window.wallpaperPan=(t,v)=>{const lo=vw/2,hi=Math.max(lo,1200-vw/2);
  if(t==='offset'){baseX=lo+(hi-lo)*clamp(+v,0,1)}
  else if(t==='down'){panStart=cam.x}
  else if(t==='move'&&panStart!=null){manual=clamp(panStart-(+v)/scale,lo,hi);manualUntil=simT+10;cam.x=manual}
  else if(t==='up'){panStart=null}};
function defY(){return portrait?440:430}
function camTarget(){
  let fx=baseX,fy=defY();
  if(G.inPlay&&G.ball&&phaseName==='game'){const p=P(G.ball.x,G.ball.z);fx=p.x;if(Z>1.15)fy=p.y}
  if(manual!=null&&simT<manualUntil){fx=manual;if(manualY!=null)fy=manualY}else{manual=null;manualY=null}
  return[fx,fy];
}
function clampCam(){cam.x=clamp(cam.x,vw/2,Math.max(vw/2,1200-vw/2));cam.y=clamp(cam.y,-450+vh/2,Math.max(-450+vh/2,1350-vh/2))}
function zoomAt(nz,sx,sy){const wx=cam.x+(sx-W/2)/scale,wy=cam.y+(sy-Hh/2)/scale;Z=nz;applyScale();cam.x=wx-(sx-W/2)/scale;cam.y=wy-(sy-Hh/2)/scale;clampCam();manual=cam.x;manualY=cam.y;manualUntil=simT+15}
const ptrs=new Map();let lastTap=0;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const x=e.clientX-stL,y=e.clientY-stT;ptrs.set(e.pointerId,{x,y});
  if(ptrs.size===1){drag={x,y,cx:cam.x,cy:cam.y};const now=performance.now();if(now-lastTap<300){Z=1;applyScale();manual=manualY=null;bgSoon()}lastTap=now}
  else if(ptrs.size===2){drag=null;const [a,b]=[...ptrs.values()];pinch={d:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),z:Z}}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const x=e.clientX-stL,y=e.clientY-stT;ptrs.set(e.pointerId,{x,y});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(clamp(pinch.z*d/pinch.d,zMin(),3),(a.x+b.x)/2,(a.y+b.y)/2)}
  else if(drag){cam.x=drag.cx-(x-drag.x)/scale;cam.y=drag.cy-(y-drag.y)/scale;clampCam();manual=cam.x;manualY=cam.y;manualUntil=simT+10}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2&&pinch){pinch=null;bgSoon();const r=[...ptrs.values()][0];drag=r?{x:r.x,y:r.y,cx:cam.x,cy:cam.y}:null}if(!ptrs.size)drag=null};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(clamp(Z*Math.exp(-e.deltaY*.0015),zMin(),3),e.clientX-stL,e.clientY-stT);bgSoon()},{passive:false});

/* ---------- main draw ---------- */
let snap=null,snapT=0;
function draw(){
  const s=scale*dpr;const L=cam.x-vw/2,T=cam.y-vh/2;
  cx.setTransform(1,0,0,1,0,0);
  cx.setTransform(s,0,0,s,-L*s,-T*s);
  cx.drawImage(bg,0,-450,1200,1800);
  clouds.forEach(cl=>drawCloud(cx,cl));
  planes.forEach(p=>{cx.fillStyle='#f4f6f8';cx.beginPath();cx.ellipse(p.x,p.y,9,2.2,0,0,7);cx.fill();cx.fillRect(p.x-2,p.y-6,3,12);cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(p.x-p.d*10,p.y);cx.lineTo(p.x-p.d*120,p.y);cx.stroke()});
  trains.forEach(tr=>drawTrain(cx,tr,false));
  drawBridge(cx);
  sparkles.forEach(sp=>{const a=(Math.sin(simT*1.3+sp.p)+1)/2;cx.strokeStyle=`rgba(235,248,255,${a*.55})`;cx.lineWidth=1.2;const x=(sp.x+simT*4)%1200;cx.beginPath();cx.moveTo(x,sp.y);cx.lineTo(x+sp.w,sp.y);cx.stroke()});
  const list=ents.filter(e=>!e.dead).concat([NET]).sort((a,b)=>b.z-a.z);
  for(const e of list){
    if(e.kind==='kid')drawKid(cx,e);else if(e.kind==='adult')drawAdult(cx,e);else if(e.kind==='ball')drawBall(cx,e);
    else if(e.kind==='net')drawNet(cx);else if(e.kind==='dog')drawDog(cx,e);else if(e.kind==='fly')drawFly(cx,e);
  }
  const sk=skyAt(hourNow());
  if(sk.tint[3]>0){cx.fillStyle=`rgba(${sk.tint[0]|0},${sk.tint[1]|0},${sk.tint[2]|0},${sk.tint[3]})`;cx.fillRect(L-2,T-2,vw+4,vh+4)}
  if(sk.star>.05){
    stars.forEach(st=>{const a=sk.star*(.5+.5*Math.sin(simT*1.7+st.p));cx.fillStyle=`rgba(255,255,240,${a})`;cx.fillRect(st.x,st.y,st.s,st.s)});
    cx.fillStyle=`rgba(255,250,225,${sk.star})`;cx.beginPath();cx.arc(930,150,15,0,7);cx.fill();
    cx.fillStyle=`rgba(${sk.top.map(v=>v|0).join(',')},${sk.star})`;cx.beginPath();cx.arc(937,145,13,0,7);cx.fill();
    trains.forEach(tr=>{cx.globalAlpha=sk.star;drawTrain(cx,tr,true);cx.globalAlpha=1});
  }
  cx.setTransform(1,0,0,1,0,0);
  drawNameTags(L,T);
  if(snap){const a=1-(simT-snapT)/1.4;if(a<=0)snap=null;else{cx.globalAlpha=a;cx.drawImage(snap,0,0);cx.globalAlpha=1}}
  drawBubbles(L,T);
}
function drawNameTags(L,T){
  if(!S.names||phaseName!=='game'||!G.home||G.pre)return;
  const fs=clamp(Math.min(W,Hh)/40,10,13)*dpr;
  cx.font=`700 ${fs}px 'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif`;cx.textBaseline='middle';cx.textAlign='center';
  const tags=[];
  for(const e of ents){
    if(e.kind!=='kid'||e.dead||!e.role)continue;
    if(S.names===1&&!['P','B','R'].includes(e.role))continue;
    const p=P(e.x,e.z);const sx=(p.x-L)*scale*dpr,sy=(p.y-T)*scale*dpr+3*dpr;
    if(sx<-40||sx>W*dpr+40||sy<-20||sy>Hh*dpr+20)continue;
    tags.push({e,sx,sy,z:e.z});
  }
  tags.sort((a,b)=>b.z-a.z);
  for(const t of tags){
    const w=cx.measureText(t.e.name).width+fs*.9,h=fs*1.45;
    cx.globalAlpha=.88;cx.fillStyle=t.e.team.capD||'#2a3142';
    cx.beginPath();cx.roundRect(t.sx-w/2,t.sy,w,h,h/2);cx.fill();
    cx.globalAlpha=1;cx.fillStyle='#fff';cx.fillText(t.e.name,t.sx,t.sy+h/2+.5);
  }
}
function speaker(e){
  if(e.kind==='kid')return{n:e.name,c:(e.team&&e.team.capD)||'#2a3142'};
  if(e.role==='coach')return{n:`${e.team.name} 監督`,c:e.team.capD};
  if(e.role==='ump')return null;
  if(e.role==='parent')return{n:'おうちの人',c:'#8a6a40'};
  return null;
}
function drawBubbles(L,T){
  const fs=clamp(Math.min(W,Hh)/27,13,18)*dpr;
  cx.font=`700 ${fs}px 'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif`;cx.textBaseline='middle';cx.textAlign='center';
  const placed=[];
  bubbles=bubbles.filter(b=>simT-b.born<b.ttl&&!b.e.dead&&b.text);
  for(const b of bubbles){
    const e=b.e;const top=e.kind==='adult'?2.2*e.size:1.95*e.size;
    const p=P(e.x,e.z,e.stunUntil>simT?.5:top);
    let sx=(p.x-L)*scale*dpr,sy=(p.y-T)*scale*dpr-6*dpr;
    const sp=phaseName==='game'?speaker(e):null,nfs=fs*.62;
    const tw=cx.measureText(b.text).width;cx.font=`700 ${nfs}px 'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif`;const nw=sp?cx.measureText(sp.n).width:0;cx.font=`700 ${fs}px 'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif`;
    const w=Math.max(tw,nw)+fs*1.1,h=fs*1.7+(sp?nfs*1.15:0);
    let bx=clamp(sx-w/2,6*dpr,W*dpr-w-6*dpr),by=sy-h-fs*.55;
    for(let k=0;k<4;k++){const hit=placed.find(r=>bx<r.x+r.w&&bx+w>r.x&&by<r.y+r.h&&by+h>r.y);if(!hit)break;by=hit.y-h-4*dpr}
    placed.push({x:bx,y:by,w,h});
    const age=simT-b.born,a=Math.min(1,age/.15,(b.ttl-age)/.3);
    cx.globalAlpha=Math.max(0,a);
    cx.fillStyle='rgba(255,255,255,.96)';cx.strokeStyle='rgba(50,60,80,.55)';cx.lineWidth=1.4*dpr;
    cx.beginPath();cx.roundRect(bx,by,w,h,Math.min(h/2,fs*.85));cx.fill();cx.stroke();
    const tx=clamp(sx,bx+h*.5,bx+w-h*.5);
    cx.beginPath();cx.moveTo(tx-fs*.3,by+h-1);cx.lineTo(sx,sy);cx.lineTo(tx+fs*.3,by+h-1);cx.closePath();cx.fill();
    cx.beginPath();cx.moveTo(tx-fs*.3,by+h);cx.lineTo(sx,sy);cx.lineTo(tx+fs*.3,by+h);cx.stroke();
    cx.fillStyle='rgba(255,255,255,.96)';cx.fillRect(tx-fs*.3+1,by+h-2*dpr,fs*.6-2,3*dpr);
    if(sp){cx.font=`700 ${nfs}px 'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif`;cx.fillStyle=sp.c;cx.fillText(sp.n,bx+w/2,by+fs*.42+nfs*.5);cx.font=`700 ${fs}px 'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif`}
    cx.fillStyle='#2a3142';cx.fillText(b.text,bx+w/2,by+h-fs*.85+1);
    cx.globalAlpha=1;
  }
}

/* ---------- phase control ---------- */
function startPhase(ph){
  if(W){snap=document.createElement('canvas');snap.width=cv.width;snap.height=cv.height;snap.getContext('2d').drawImage(cv,0,0);snapT=simT}
  epoch++;waiters=[];bubbles=[];ents=[];G.home=null;G.field=null;G.inPlay=false;trains=[];
  phaseName=ph;const ep=epoch;updateHUD();
  commonAmbient(ep);
  if(ph==='game'){ambientGame(ep);(async()=>{while(ep===epoch&&phaseAt(hourNow())==='game')await playGame();if(ep===epoch)startPhase(phaseAt(hourNow()))})()}
  else if(ph==='warmup')warmup(ep);
  else if(ph==='maint')maintenance(ep);
  else quiet(ep);
  if(ph!=='game'){(async()=>{while(ep===epoch){await sleep(5);if(ep===epoch&&phaseAt(hourNow())!==ph){startPhase(phaseAt(hourNow()));return}}})()}
  if(ph!=='night'){(async()=>{await sleep(rnd(3,10));if(ep===epoch)spawnWalker()})()}
}

let last=performance.now();
function frame(ts){
  if(WALL&&ts-last<30){requestAnimationFrame(frame);return}
  const dt=Math.min(.1,(ts-last)/1000)*SPEED*.85;last=ts;simT+=dt;
  if(waiters.length){const due=[],rest=[];for(const w of waiters)(w.t<=simT?due:rest).push(w);waiters=rest;due.forEach(w=>w.res())}
  for(const e of ents)e.update(dt);
  ents=ents.filter(e=>!e.dead);
  clouds.forEach(cl=>{cl.x+=cl.v*dt;if(cl.x>1300)cl.x=-140});
  trains.forEach(tr=>tr.x+=tr.d*tr.sp*dt);trains=trains.filter(tr=>tr.x>-900&&tr.x<2100);
  planes.forEach(p=>p.x+=p.d*14*dt);planes=planes.filter(p=>p.x>-200&&p.x<1400);
  const [tx,ty]=camTarget();if(!drag&&!pinch){const k=Math.min(1,dt*1.4);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k}
  clampCam();
  const h=hourNow();if(Math.abs(h-bgHour)>.05&&Math.abs(h-bgHour)<23.9||bgHour<0)renderBG(h);
  draw();
  requestAnimationFrame(frame);
}

    const ts=DB.teams.map(x=>({x,s:DB.st.t[x.id]||{g:0,w:0,l:0,d:0,rf:0,ra:0,vs:{}}}));
    const s=(DB.st.t[t.id]||{vs:{}});
    const rows=t.players.map(p=>({p,s:DB.st.p[p.id]||{}}));
    const pit=rows.filter(r=>r.s.pg);
    shBody.innerHTML=`<div><h3>チーム成績</h3><div class="tbl"><table><tr><th>チーム</th><th>試合</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th><th>得点</th><th>失点</th></tr>
      ${ts.map(({x,s})=>`<tr><td class="l"><span class="dot" style="display:inline-block;vertical-align:-1px;margin-right:5px;background:${capOf(x)}"></span>${esc(x.name)}</td><td>${s.g}</td><td>${s.w}</td><td>${s.l}</td><td>${s.d}</td><td>${s.w+s.l?avg(s.w,s.w+s.l):'-'}</td><td>${s.rf}</td><td>${s.ra}</td></tr>`).join('')}</table></div></div>
    ${teamPick()}
    <div><h3>対戦相手別</h3><div class="tbl"><table><tr><th>相手</th><th>勝</th><th>敗</th><th>分</th></tr>${Object.entries(s.vs||{}).map(([n,v])=>`<tr><td class="l">${esc(n)}</td><td>${v.w}</td><td>${v.l}</td><td>${v.d}</td></tr>`).join('')||'<tr><td class="l" colspan="4">まだ試合がありません</td></tr>'}</table></div></div>
    <div><h3>打撃成績</h3><div class="tbl"><table><tr><th>選手</th><th>試合</th><th>打席</th><th>打数</th><th>安打</th><th>本塁打</th><th>打点</th><th>四球</th><th>三振</th><th>犠打</th><th>打率</th></tr>
      ${rows.map(({p,s})=>`<tr><td class="l">${p.num} ${esc(p.name)}</td><td>${s.g||0}</td><td>${s.pa||0}</td><td>${s.ab||0}</td><td>${s.h||0}</td><td>${s.hr||0}</td><td>${s.rbi||0}</td><td>${s.bb||0}</td><td>${s.so||0}</td><td>${s.sh||0}</td><td>${avg(s.h||0,s.ab||0)}</td></tr>`).join('')}</table></div></div>
    <div><h3>投手成績</h3><div class="tbl"><table><tr><th>選手</th><th>登板</th><th>投球回</th><th>奪三振</th><th>失点</th><th>勝</th><th>敗</th></tr>
      ${pit.map(({p,s})=>`<tr><td class="l">${p.num} ${esc(p.name)}</td><td>${s.pg||0}</td><td>${ip(s.po)}</td><td>${s.pk||0}</td><td>${s.pr||0}</td><td>${s.w||0}</td><td>${s.l||0}</td></tr>`).join('')||'<tr><td class="l" colspan="7">まだ登板がありません</td></tr>'}</table></div></div>
    <div><h3>最近の試合</h3><ul class="log">${DB.log.slice(0,12).map(g=>{const d=new Date(g.t);return`<li>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}　${esc(g.a)} ${g.sa} - ${g.sh} ${esc(g.h)}${g.c?'（コールド）':''}</li>`}).join('')||'<li>まだ試合がありません</li>'}</ul></div>
    ${window.KawaApp?'<p class="note">成績は壁紙で行われた試合で記録されます。</p>':''}
    <button class="danger" id="resetSt">${shConfirm?'本当に消す（もう一度押す）':'成績をすべてリセット'}</button>`;
  }
}
$('#bTeams').addEventListener('click',()=>{panel.hidden=true;gear.setAttribute('aria-expanded','false');sheet.hidden=false;shConfirm=false;renderSheet()});
$('#shClose').addEventListener('click',()=>{sheet.hidden=true});
$('#shTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;shTab=b.dataset.t;shConfirm=false;renderSheet()});
shBody.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.team!=null){shTeam=+b.dataset.team;renderSheet();return}
  if(b.dataset.cap){editD(d=>{d.teams[shTeam].cap=b.dataset.cap});renderSheet();return}
  if(b.dataset.body){editD(d=>{d.teams[shTeam].body=b.dataset.body});renderSheet();return}
  const g=b.closest('.gseg');if(g){editD(d=>{d.teams[shTeam].players[+g.dataset.g].girl=b.dataset.v==='1'});g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
  if(b.id==='resetSt'){if(!shConfirm){shConfirm=true;renderSheet();return}editD(d=>{d.st={p:{},t:{}};d.log=[]});shConfirm=false;renderSheet()}
});
shBody.addEventListener('input',e=>{const el=e.target;
  if(el.id==='tName')editD(d=>{d.teams[shTeam].name=el.value.trim()});
  else if(el.dataset.p!=null)editD(d=>{d.teams[shTeam].players[+el.dataset.p].name=el.value.trim()});
});
shBody.addEventListener('change',e=>{if(e.target.id==='tName')renderSheet()});

window.addEventListener('resize',layout);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadS();syncUI();checkUpdate()}});
addEventListener('storage',e=>{if(e.key==='kawajiki.v1'){loadS();syncUI()}if(e.key===DKEY){DB=loadD();if(!sheet.hidden&&shTab==='stats')renderSheet()}});
if(window.KawaApp){$('#appBox').hidden=false;$('#bWp').onclick=()=>{try{KawaApp.setWallpaper()}catch(e){}}}
let updBusy=false;
function checkUpdate(){if(updBusy||!/^https?:/.test(location.protocol)||BUILD.startsWith('__'))return;updBusy=true;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{updBusy=false;
    if(!v||!v.build||v.build===BUILD)return;
    let tried=null;try{tried=JSON.parse(localStorage.getItem('kawajikiUpd')||'null')}catch(e){}
    if(tried&&tried.b===v.build&&Date.now()-tried.t<600000)return;
    if(!WALL&&(!panel.hidden||!sheet.hidden))return;
    try{localStorage.setItem('kawajikiUpd',JSON.stringify({b:v.build,t:Date.now()}))}catch(e){}
    const q=new URLSearchParams(location.search);q.set('v',v.build);location.replace(location.pathname+'?'+q.toString());
  }).catch(()=>{updBusy=false})}
setTimeout(checkUpdate,4000);setInterval(()=>{if(!document.hidden)checkUpdate()},30*60*1000);
layout();syncUI();
if(document.fonts)document.fonts.load("700 16px 'Zen Maru Gothic'").catch(()=>{});
startPhase(phaseAt(hourNow()));
requestAnimationFrame(frame);
</script>

</html>
