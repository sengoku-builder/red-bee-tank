plugins { id 'com.android.application' }
android {
    namespace 'io.github.sengokubuilder.kawajiki'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.sengokubuilder.kawajiki'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        // 毎回同じ鍵で署名して、上書きインストールできるようにする
        fixed {
            storeFile file('kawajiki.keystore')
            storePassword 'redbeetank'
            keyAlias 'redbee'
            keyPassword 'redbeetank'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
