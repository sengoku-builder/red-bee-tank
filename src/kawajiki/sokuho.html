<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a3142;--paper:#fffcf3;--line:#ddd4bd;--chip:#f1ead7;--navy:#24418a;--muted:#6b7286;--board:#203a2c;--gold:#f6d23a;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#efe8d6;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:var(--font);color:inherit;cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:16px;color:var(--ink)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 10px 90px}
header.top{position:sticky;top:0;z-index:5;background:#efe8d6;padding:8px 10px 6px;display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto}
header.top h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 11px;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin:0 auto;padding:0 10px 8px;position:sticky;top:46px;z-index:5;background:#efe8d6}
.tabs button{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:8px 0;font-size:14px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--paper);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.card h2{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted);font-size:12.5px}
/* scoreboard */
.sb{background:var(--board);color:#f4f1e4;border-radius:14px;padding:10px 10px 8px;margin-bottom:10px}
.ls{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.ls th{font-weight:500;font-size:11px;opacity:.7;padding:0 0 3px;text-align:center}
.ls td{text-align:center;padding:2px 0}
.ls td.tn{text-align:left;max-width:6.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.ls .tot{font-weight:700;color:var(--gold)}
.ls td.now{color:var(--gold);font-weight:700}
.sit{display:flex;align-items:center;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(244,241,228,.2)}
.inn{font-size:17px;font-weight:700;min-width:5.2em}
.bso{display:flex;flex-direction:column;gap:3px;font-size:11px}
.lr{display:flex;align-items:center;gap:4px}.lr b{width:11px}
.lp{width:11px;height:11px;border-radius:50%;background:rgba(244,241,228,.16);display:inline-block}
.lp.g.on{background:#3fd172}.lp.y.on{background:#f6d23a}.lp.r.on{background:#f04b3e}
.dia{margin-left:auto}
.dia rect{fill:rgba(244,241,228,.16);stroke:rgba(244,241,228,.4)}

.dia text{fill:#f4f1e4;font-size:7px;font-family:var(--font)}
/* matchup */
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.mu .who{font-size:12px;color:var(--muted)}
.mu .nm{font-size:17px;font-weight:700;line-height:1.25;word-break:break-all}

.pl .no{color:var(--muted)}
.pl .ct{color:var(--muted);font-size:12px}
.k-B{color:#1f8a4c}.k-S,.k-W{color:#b88a00}.k-F{color:#7a6a4a}.k-X{color:#c0392b;font-weight:700}.k-H{color:#c0392b}
/* input buttons */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.pad button{border:0;border-radius:12px;padding:16px 0;font-size:16px;font-weight:700;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bB{background:#2f9a5a}.bS{background:#d6a514}.bW{background:#e0821f}.bF{background:#8a7a5a}
.bigx{width:100%;border:0;border-radius:12px;padding:15px 0;font-size:17px;font-weight:700;color:#fff;background:#c0392b;box-shadow:0 2px 0 rgba(0,0,0,.15);margin-bottom:6px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row4 button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 0;font-size:13px}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:6px 2px;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.45}
.feed li.hd{border:0;padding-top:12px;font-weight:700;color:var(--navy)}
.feed .pt{font-size:12px;color:var(--muted)}
.feed .rs{color:#c0392b;font-weight:700}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,25,35,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:16px}
.lbl{font-size:12px;color:var(--muted);margin:12px 0 5px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:8px 11px;font-size:14px}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chips button:disabled{opacity:.35}
.grp{font-size:11px;color:var(--muted);width:100%;margin-top:4px}
.fld{width:100%;display:block;background:#dfe9d3;border-radius:12px;touch-action:manipulation}
.rrow{display:grid;grid-template-columns:5.5em 1fr;gap:6px;align-items:center;margin-bottom:6px}
.rrow .rn{font-size:13px;line-height:1.25;word-break:break-all}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.seg5 button{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:8px 0;font-size:13px}

.tagrow{margin:0 0 8px}.tagrow .lbl{margin:4px 0}
.tagrow .chips button{font-size:12.5px;padding:6px 8px}
.btog{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.btog button{white-space:nowrap;flex-shrink:0;border:2px solid #8a5a34;background:#fff;color:#8a5a34;border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px}
.btog button[aria-pressed=true]{background:#8a5a34;color:#fff}
.cold{background:#fff3d6;border:1px solid #e6c46a;border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px;display:flex;align-items:center;gap:8px}
.cold button{margin-left:auto;border:0;border-radius:9px;background:#c0392b;color:#fff;padding:8px 10px;font-weight:700}
.feed li.ed{cursor:pointer}.feed .edt{float:right;font-size:11px;color:var(--navy);border:1px solid var(--line);border-radius:7px;padding:1px 6px;background:#fff}
.feed .bad{color:#c0392b;font-size:12px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;border-radius:12px;padding:13px 0;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--chip)}
.acts .ok{background:var(--navy);color:#fff;border-color:var(--navy)}
.acts .ok:disabled{opacity:.4}
.warn{color:#c0392b;font-size:13px;margin-top:8px}
.sum{font-size:13px;margin-top:8px;color:var(--muted)}
/* forms */
.frm{display:grid;gap:8px}
.frm label{font-size:12px;color:var(--muted)}
.frm input[type=text],.frm input[type=date],.frm select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.lu{display:grid;grid-template-columns:2em 1fr 4.4em 2.4em 3.2em;gap:5px;align-items:center;margin-bottom:5px}
.lu .n{font-weight:700;text-align:center;background:var(--chip);border-radius:6px;padding:7px 0;font-size:13px}
.lu input,.lu select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.lu button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 0;font-size:12px}
.lu button[aria-pressed=true]{background:#e0679a;border-color:#e0679a;color:#fff}
.caps{display:flex;flex-wrap:wrap;gap:6px}
.caps button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.caps button[aria-pressed=true]{box-shadow:0 0 0 3px var(--navy)}
.gl{display:flex;flex-direction:column;gap:8px}
.gi{background:var(--paper);border-radius:14px;padding:12px}
.gi .t{font-weight:700;font-size:15px}
.gi .sc{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;margin:2px 0}
.gi .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gi .bt button{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:8px 12px;font-size:13px}
.gi .bt .pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.gi .bt .rp{background:#2f6b4a;color:#fff;border-color:#2f6b4a}
.danger{color:#a5372f!important;border-color:#d9a4a0!important;background:#fff!important}
.newb{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:var(--navy);color:#fff;margin-bottom:10px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;width:100%}
.tbl th,.tbl td{padding:5px 5px;border-bottom:1px solid var(--line);text-align:right}
.tbl th{color:var(--muted);font-size:11.5px}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.over{background:#2f6b4a;color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a3142;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
a.back{color:var(--navy)}
</style></head>
<body>
<header class="top"><button class="ib" id="hBack" aria-label="戻る">←</button><h1 id="hTitle">一球速報</h1><a class="ib" id="hField" href="./" style="text-decoration:none;color:inherit">野球場</a></header>
<nav class="tabs" id="tabs" hidden>
  <button data-a="tab" data-v="live">速報</button><button data-a="tab" data-v="feed">打席</button><button data-a="tab" data-v="stats">成績</button><button data-a="tab" data-v="setup">試合設定</button>
</nav>
<main class="wrap" id="main"></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
const RKEY='kawajiki.records.v1',QKEY='kawajiki.replayReq',RSKEY='kawajiki.restartAt';
const POSJ=['投','捕','一','二','三','遊','左','中','右'];
const POSF=['ピッチャー','キャッチャー','ファースト','セカンド','サード','ショート','レフト','センター','ライト'];
const POSOPT=['投','捕','一','二','三','遊','左','中','右','DH',''];
const CAPS=[{k:'navy',c:'#25408a'},{k:'red',c:'#c9443b'},{k:'green',c:'#2f8a58'},{k:'orange',c:'#d9822b'},{k:'sky',c:'#3b93d4'},{k:'purple',c:'#7a4fb3'},{k:'black',c:'#2b2f3a'},{k:'yellow',c:'#e0b021'},{k:'pink',c:'#e0679a'},{k:'brown',c:'#8a5a34'}];
// 壁紙と同じ座標（ホーム(0,0)、二塁(0,32.6)、外野フェンス約63）
const BASES=[[0,0],[16.3,16.3],[0,32.6],[-16.3,16.3]];
const FPOS=[[0,15.6],[0,-1.25],[14.6,19.5],[6.8,28.5],[-14.6,19.5],[-6.8,28.5],[-23,45],[0,52],[23,45]];
const RES={
 '1B':{l:'ヒット',g:'安打',ab:1,h:1,ty:'L'},'2B':{l:'2ベース',g:'安打',ab:1,h:1,ty:'L'},'3B':{l:'3ベース',g:'安打',ab:1,h:1,ty:'L'},'HR':{l:'ホームラン',g:'安打',ab:1,h:1,ty:'F'},
 'GO':{l:'ゴロ',g:'アウト',ab:1,ty:'G'},'FO':{l:'フライ',g:'アウト',ab:1,ty:'F'},'LO':{l:'ライナー',g:'アウト',ab:1,ty:'L'},'DP':{l:'併殺',g:'アウト',ab:1,ty:'G',norbi:1},
 'SH':{l:'送りバント',g:'アウト',ab:0,ty:'B'},'SF':{l:'犠牲フライ',g:'アウト',ab:0,ty:'F'},
 'E':{l:'エラー',g:'出塁',ab:1,ty:'G',norbi:1},'FC':{l:'野選',g:'出塁',ab:1,ty:'G'},
 'HBP':{l:'死球',g:'その他',ab:0,bb:1},'IBB':{l:'申告敬遠',g:'その他',ab:0,bb:1},'KWP':{l:'振り逃げ',g:'その他',ab:1,k:1,norbi:1},
 'BB':{l:'四球',ab:0,bb:1},'K':{l:'空振り三振',ab:1,k:1},'KL':{l:'見逃し三振',ab:1,k:1},'KB':{l:'スリーバント失敗',ab:1,k:1},'CONT':{l:'（攻撃終了）'}
};
const INPLAY=['1B','2B','3B','HR','GO','FO','LO','DP','SH','SF','E','FC'];
const PITCH={B:'ボール',S:'見逃しストライク',W:'空振りストライク',F:'ファウル',X:'打った',H:'死球'};
const TY={G:'ゴロ',F:'フライ',L:'ライナー',B:'バント'};
const FT={L3:'三塁線を鋭く',L1:'一塁線を鋭く',PL:'ポール際（レフト）',PR:'ポール際（ライト）',OF3:'外野フライ（三塁側）',OF1:'外野フライ（一塁側）',OG3:'外野ゴロ（三塁側）',OG1:'外野ゴロ（一塁側）',IF3:'内野フライ（三塁側）',IF1:'内野フライ（一塁側）',IG3:'内野ゴロ（三塁側）',IG1:'内野ゴロ（一塁側）',BK:'真後ろ（バックネット）',SELF:'自打球'};
const ENDW={normal:'試合終了',cold:'コールドゲーム',time:'時間切れ',other:'その他（雨など）'};
const DEFCOLD=[{inn:4,d:10},{inn:5,d:7}];
const WHY=['盗塁','盗塁死','暴投','捕逸','ボーク','牽制死','走塁死','エラー','その他'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2=n=>String(n).padStart(2,'0');

/* ---------- 保存 ---------- */
let recs=[];
function load(){try{recs=JSON.parse(localStorage.getItem(RKEY)||'[]')}catch(e){recs=[]}if(!Array.isArray(recs))recs=[]}
function save(){try{localStorage.setItem(RKEY,JSON.stringify(recs))}catch(e){toast('保存できませんでした')}}
function mkTeam(n,c){return{name:n,cap:c,lineup:['中','二','遊','一','三','左','右','捕','投'].map(p=>({name:'',pos:p,girl:false}))}}
function newRec(){const d=new Date();return{id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),v:1,date:`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`,place:'',innings:6,teams:[mkTeam('先攻チーム','red'),mkTeam('後攻チーム','navy')],events:[],created:Date.now(),updated:Date.now()}}
const R=()=>recs.find(r=>r.id===ui.id);
function touch(){const r=R();if(r)r.updated=Date.now();save()}

/* ---------- 試合の進行（記録から毎回組み立てる） ---------- */
function pname(lu,slot){const p=lu[slot];return(p&&p.name)||`${slot+1}番打者`}
function hasDH(t){return t.lineup.some(x=>x.pos==='DH')}
function pitcherOf(t){if(hasDH(t))return(t.dhp&&t.dhp.name)||'ピッチャー';const p=t.lineup.find(x=>x.pos==='投');return p&&p.name?p.name:'ピッチャー'}
function defMoves(res,bases){
  const o=bases.map(Boolean),r=[null,null,null];
  const stay=()=>{for(let i=0;i<3;i++)if(o[i])r[i]=i+1};
  const adv=n=>{for(let i=0;i<3;i++)if(o[i])r[i]=Math.min(4,i+1+n)};
  const forced=()=>{stay();if(o[0]){r[0]=2;if(o[1]){r[1]=3;if(o[2])r[2]=4}}};
  let b=0;
  switch(res){
    case'1B':adv(1);b=1;break;case'2B':adv(2);b=2;break;case'3B':adv(3);b=3;break;case'HR':adv(4);b=4;break;
    case'GO':case'FO':case'LO':case'K':case'KL':stay();break;
    case'DP':stay();if(o[0])r[0]=0;break;
    case'SH':adv(1);break;
    case'SF':stay();if(o[2])r[2]=4;break;
    default:forced();b=1;
  }
  return{b,r};
}
function sim(rec,upto,annotate){
  const s={inn:1,half:0,outs:0,b:0,s:0,bases:[null,null,null],next:[0,0],runs:[[],[]],pas:[],cur:null,feed:[],over:false,endWhy:null,bad:new Set(),
    lu:rec.teams.map(t=>t.lineup.map(p=>({...p}))),pit:rec.teams.map(t=>[{name:pitcherOf(t),n:0}]),wb:[{},{}]};
  const n=upto==null?rec.events.length:upto;
  for(let i=0;i<n;i++){const ev=rec.events[i];
    if(annotate){ev.i=s.inn;ev.h=s.half;ev.s=s.cur?s.cur.slot:s.next[s.half];ev.o=s.outs;ev.bs=s.bases.map(x=>x?1:0).join('')}
    if((ev.t==='pa'||ev.t==='run')&&ev.m&&ev.m.r){for(let j=0;j<3;j++){const has=!!s.bases[j],rec_=ev.m.r[j]!=null;if(has!==rec_&&!(ev.t==='pa'&&!has))s.bad.add(i)}
      if(ev.t==='pa'&&ev.m.r.some((d,j)=>d!=null&&!s.bases[j]))s.bad.add(i)}
    apply(s,ev,i)}
  return s;
}
function reannotate(rec){sim(rec,null,true)}
function coldRules(r){return(r.cold&&r.cold.length?r.cold:DEFCOLD).filter(c=>c&&c.inn>0&&c.d>0)}
function coldDiff(r,inn){let d=null;for(const c of coldRules(r))if(inn>=c.inn&&(d==null||c.d<d))d=c.d;return d}
function coldNow(s,r){
  if(s.over)return false;const [a,h]=scoreOf(s);
  if(s.half===1){const d=coldDiff(r,s.inn);return d!=null&&h-a>=d}
  if(s.half===0&&s.outs===0&&!s.cur&&s.inn>1){const d=coldDiff(r,s.inn-1);return d!=null&&Math.abs(a-h)>=d}
  return false;
}
function curPA(s){
  if(!s.cur){const t=s.half,slot=s.next[t];s.cur={t,slot,name:pname(s.lu[t],slot),inn:s.inn,p:[],res:null,f:[],bb:null,reach:0,scored:false,out:false,rbi:0,runs:0,pit:s.pit[1-t].length-1,pitName:s.pit[1-t].at(-1).name,done:false};s.pas.push(s.cur)}
  return s.cur;
}
function pitchCount(s){s.pit[1-s.half].at(-1).n++}
function apply(s,ev,idx){
  if(s.over)return;
  switch(ev.t){
    case'p':{const pa=curPA(s);pitchCount(s);const q={k:ev.k,bunt:ev.bunt,wb:ev.wb,ft:ev.ft};pa.p.push(q);
      if(ev.k==='B')s.b++;else if(ev.k==='S'||ev.k==='W')s.s++;else if(ev.k==='F'){if(ev.bunt===1&&s.s>=2)s.s=3;else if(s.s<2)s.s++}
      q.b=s.b;q.s=s.s;
      if(ev.wb){const f=1-s.half,c=s.lu[f].find(x=>x.pos==='捕'),cn=(c&&c.name)||'キャッチャー';s.wb[f][cn]=(s.wb[f][cn]||0)+1}
      if(s.b>=4)finish(s,'BB',defMoves('BB',s.bases),[],null,idx,true);
      else if(s.s>=3)finish(s,ev.k==='W'?'K':ev.k==='F'?'KB':'KL',defMoves('K',s.bases),[],null,idx,true);
      break}
    case'pa':{const pa=curPA(s);const pk=ev.res==='HBP'?'H':ev.res==='KWP'?'W':ev.res==='IBB'?null:'X';
      if(pk){pitchCount(s);pa.p.push({k:pk,b:s.b,s:pk==='W'?3:s.s})}
      finish(s,ev.res,ev.m,ev.f||[],ev.bb||null,idx,false);break}
    case'run':{const runs=move(s,ev.m,null,ev.why);
      s.feed.push({k:'note',inn:s.inn,half:s.half,text:runText(ev,runs),ei:idx,run:true});three(s);break}
    case'sub':{const old=pname(s.lu[ev.team],ev.slot);s.lu[ev.team][ev.slot]={name:ev.name,pos:ev.pos,girl:!!ev.girl,left:!!ev.left};
      if(s.cur&&s.cur.t===ev.team&&s.cur.slot===ev.slot)s.cur.name=ev.name;
      s.feed.push({k:'note',inn:s.inn,half:s.half,text:`選手交代：${ev.slot+1}番 ${old} → ${ev.name}（${ev.pos||'-'}）`});break}
    case'pc':{const lu=s.lu[ev.team],j=lu.findIndex(p=>p.name&&p.name===ev.name),pi=lu.findIndex(p=>p.pos==='投');
      if(j>=0&&pi>=0&&j!==pi){const op=lu[j].pos;lu[j].pos='投';lu[pi].pos=op}
      s.pit[ev.team].push({name:ev.name,n:0});s.feed.push({k:'note',inn:s.inn,half:s.half,text:`ピッチャー交代：${ev.name}`});break}
    case'end':s.over=true;s.endWhy=ev.why||'normal';s.feed.push({k:'note',inn:s.inn,half:s.half,text:ev.why&&ev.why!=='normal'?`試合終了（${ENDW[ev.why]||ev.why}）`:'試合終了'});break;
  }
}
function move(s,m,batter,why){
  const nb=[null,null,null];let runs=0;const scorers=[];
  const place=(pa,d)=>{if(d===0){s.outs++;pa.out=true;pa.outNo=s.outs}else if(d>=4){pa.reach=4;pa.scored=true;runs++;scorers.push(pa)}else{nb[d-1]=pa;if(d>pa.reach)pa.reach=d}};
  for(let i=2;i>=0;i--){const tok=s.bases[i];if(!tok)continue;let d=m&&m.r?m.r[i]:null;if(d==null)d=i+1;place(tok,d)}
  if(batter)place(batter,m.b==null?1:m.b);
  s.bases=nb;
  if(runs){const r=s.runs[s.half];r[s.inn-1]=(r[s.inn-1]||0)+runs}
  return runs;
}
function finish(s,res,m,f,bb,ei,auto){
  const pa=curPA(s),t=s.half;
  pa.ei=ei;pa.auto=!!auto;pa.res=res;pa.f=f||[];pa.bb=bb;pa.done=true;pa.outsBefore=s.outs;pa.bases0=s.bases.map(x=>x?x.name:null);
  const runs=move(s,m||defMoves(res,s.bases),pa);
  pa.runs=runs;pa.rbi=RES[res].norbi?0:runs;
  s.feed.push({k:'pa',inn:s.inn,half:t,pa});
  s.next[t]=(pa.slot+1)%9;s.cur=null;s.b=0;s.s=0;
  three(s);
}
function three(s){
  if(s.outs<3)return;
  const r=s.runs[s.half];if(r[s.inn-1]==null)r[s.inn-1]=0;
  if(s.cur){if(!s.cur.p.length)s.pas.splice(s.pas.indexOf(s.cur),1);else{s.cur.res='CONT';s.cur.done=true;s.feed.push({k:'pa',inn:s.inn,half:s.half,pa:s.cur})}s.cur=null}
  s.bases=[null,null,null];s.outs=0;s.b=0;s.s=0;
  if(s.half===0)s.half=1;else{s.half=0;s.inn++}
}
function runText(ev,runs){
  const n=(ev.m.r||[]).map((d,i)=>d==null||d===i+1?null:`${i+1}塁走者${d===0?'アウト':d===4?'ホームイン':'→'+d+'塁'}`).filter(Boolean);
  return`${ev.why}：${n.join('、')||'動きなし'}${runs?`（${runs}点）`:''}`;
}

/* ---------- 打席の言い方 ---------- */
function dirOf(bb){if(!bb||bb.x==null)return null;const a=Math.atan2(bb.x,bb.z)*180/Math.PI,d=Math.hypot(bb.x,bb.z);return{a,d}}
function hitWhere(pa){
  const d=dirOf(pa.bb),f=pa.f[0];
  if(d&&d.d<30){const n=f||nearestPos(pa.bb.x,pa.bb.z);return POSF[n-1]}
  if(d){if(pa.res!=='1B'&&d.a>-26&&d.a<-9)return'左中間';if(pa.res!=='1B'&&d.a>9&&d.a<26)return'右中間';return d.a<-15?'レフト':d.a>15?'ライト':'センター'}
  return f?POSF[f-1]:'';
}
function isFoulPt(bb){if(!bb||bb.x==null)return false;return bb.z<0||Math.abs(Math.atan2(bb.x,bb.z))>Math.PI/4+.01}
function paText(pa){
  const f=pa.f&&pa.f[0],fn=f?POSF[f-1]:'',w=hitWhere(pa);
  if(pa.res==='FO'&&isFoulPt(pa.bb))return`${fn}ファウルフライ`;
  if(pa.res==='LO'&&isFoulPt(pa.bb))return`${fn}ファウルライナー`;
  switch(pa.res){
    case'1B':return w?(['レフト','センター','ライト'].includes(w)?`${w}前ヒット`:`${w}への内野安打`):'ヒット';
    case'2B':return w?`${w}への2ベース`:'2ベース';case'3B':return w?`${w}への3ベース`:'3ベース';case'HR':return w?`${w}へのホームラン`:'ホームラン';
    case'GO':return`${fn}ゴロ`;case'DP':return`${fn}ゴロ併殺打`;case'FO':return`${fn}フライ`;case'LO':return`${fn}ライナー`;
    case'SH':return`${fn?fn+'への':''}送りバント`;case'SF':return`${fn?fn+'への':''}犠牲フライ`;
    case'E':return`${fn?fn+'の':''}エラー`;case'FC':return`${fn?fn+'の':''}フィルダースチョイス`;
    default:return RES[pa.res]?RES[pa.res].l:pa.res;
  }
}
function paShort(pa){
  const f=pa.f&&pa.f[0];let p=f?POSJ[f-1]:'';
  if(!p&&pa.bb&&pa.bb.x!=null){const n=nearestPos(pa.bb.x,pa.bb.z);if(n)p=POSJ[n-1]}
  if(pa.res==='FO'&&isFoulPt(pa.bb))return p+'邪飛';
  return{'1B':p+'安','2B':p+'2','3B':p+'3','HR':p+'本','GO':p+'ゴ','FO':p+'飛','LO':p+'直','DP':p+'併','SH':p+'犠','SF':p+'犠飛','E':p+'失','FC':p+'野選','BB':'四球','IBB':'敬遠','HBP':'死球','K':'三振','KL':'見三振','KWP':'振逃','KB':'3バ失','CONT':'-'}[pa.res]||'';
}
function nearestPos(x,z){let b=0,bd=1e9;FPOS.forEach(([px,pz],i)=>{if(i===1&&z>3)return;const d=Math.hypot(px-x,pz-z);if(d<bd){bd=d;b=i+1}});return b}
function pitchLabel(p){
  let t=p.bunt===1?(p.k==='F'?'バントファウル':p.k==='W'?'バント空振り':PITCH[p.k]):PITCH[p.k];
  const x=[];if(p.bunt==='show')x.push('バントの構え');if(p.wb)x.push('ワンバウンド・捕手が止めた');if(p.ft&&FT[p.ft])x.push(FT[p.ft]);
  return t+(x.length?`（${x.join('・')}）`:'');
}

function lineScore(s,r){

  const hits=t=>s.pas.filter(p=>p.t===t&&RES[p.res]&&RES[p.res].h).length,errs=t=>s.pas.filter(p=>p.t!==t&&p.res==='E').length;
  [0,1].forEach(t=>{h+=`<tr><td class="tn">${esc(r.teams[t].name)}</td>`;
    for(let i=1;i<=N;i++){const v=s.runs[t][i-1],now=!s.over&&s.inn===i&&s.half===t;const x=s.over&&t===1&&v==null&&s.runs[0][i-1]!=null&&tb>ta;h+=`<td class="${now?'now':''}">${v!=null?v:now?0:x?'x':''}</td>`}
    h+=`<td class="tot">${t?tb:ta}</td><td>${hits(t)}</td><td>${errs(t)}</td></tr>`});

}

function checkMoves(m,withBatter){

    case'edit':{const ei=+d.ei,ev=r.events[ei];if(!ev)return;const S0=sim(r,ei);
      if(ev.t==='pa'){const m={b:ev.m?ev.m.b:1,r:[0,1,2].map(i=>ev.m&&ev.m.r?ev.m.r[i]:null)};
        ui.m=INPLAY.includes(ev.res)?{type:'res',S:S0,ei,res:ev.res,bb:ev.bb?{...ev.bb}:null,f:(ev.f||[]).slice(),fAuto:false,tyManual:true,m}:{type:'other',S:S0,ei,res:ev.res,m}}
      else if(ev.t==='run')ui.m={type:'run',S:S0,ei,why:ev.why,m:{r:[0,1,2].map(i=>ev.m&&ev.m.r?ev.m.r[i]:null)}};
      else return;break}
    case'endCold':ui.m={type:'end',why:'cold'};break;
    case'ewhy':ui.m.why=d.v;break;
    case'openRes':ui.m={type:'res',res:null,bb:null,f:[],fAuto:true,m:{b:1,r:[null,null,null]}};break;
    case'openOther':ui.m={type:'other',res:null,m:{b:1,r:[null,null,null]}};break;
    case'openRun':ui.m={type:'run',why:null,m:{r:[null,null,null]}};break;
    case'openChg':ui.m={type:'chg',kind:null,team:S.half,slot:S.cur?S.cur.slot:S.next[S.half],name:'',pos:''};break;
    case'close':ui.m=null;break;
    case'ovclose':if(ev0&&el===ev0.target&&!['res','other','run','chg'].includes(ui.m&&ui.m.type))ui.m=null;else return;break;
    case'ty':ui.m.bb={...(ui.m.bb||{x:null,z:null}),ty:d.v};ui.m.tyManual=true;break;
    case'res':setRes(ui.m,d.v);break;
    case'fp':if(ui.m.fAuto){ui.m.f=[];ui.m.fAuto=false}ui.m.f.push(+d.v);break;
    case'fclr':ui.m.f=[];ui.m.fAuto=false;break;
    case'mv':{const st=ui.m,dd=+d.d;if(d.w==='b')st.m.b=dd;else st.m.r[+d.w]=dd;break}
    case'resOk':{const st=ui.m;if(!st.res||checkMoves(st.m,true).err)return;
      const bb=st.bb&&st.bb.x!=null?{ty:st.bb.ty||RES[st.res].ty,x:st.bb.x,z:st.bb.z}:(st.bb&&st.bb.ty?{ty:st.bb.ty}:null);
      commitEv({t:'pa',res:st.res,f:st.f.slice(),bb,m:norm(st.m)});ui.m=null;break}
    case'ores':{ui.m.res=d.v;ui.m.m=defMoves(d.v,SS().bases);break}
    case'otherOk':{const st=ui.m;if(!st.res||checkMoves(st.m,true).err)return;commitEv({t:'pa',res:st.res,f:[],bb:null,m:norm(st.m)});ui.m=null;break}
    case'why':{const st=ui.m;st.why=d.v;const s=SS(),r0=[null,null,null];
      if(['盗塁','暴投','捕逸','ボーク'].includes(d.v)){for(let i=0;i<3;i++)if(s.bases[i])r0[i]=i+2}
      else if(['盗塁死','牽制死'].includes(d.v)){const i=s.bases[0]?0:s.bases[1]?1:2;r0[i]=0}
      st.m={r:r0};break}
    case'runOk':{const st=ui.m;commitEv({t:'run',why:st.why,m:norm(st.m)});ui.m=null;break}
    case'ckind':ui.m.kind=d.v;ui.m.name='';break;
    case'cteam':ui.m.team=+d.v;break;
    case'cslot':{ui.m.slot=+d.v;const p=S.lu[ui.m.team][ui.m.slot];ui.m.pos=p?p.pos:'';ui.m.left=!!(p&&p.left);break}
    case'cpick':ui.m.name=d.v;break;
    case'chgOk':{const st=ui.m,nm=($('#cName')||{}).value||st.name;if(!nm.trim()){toast('名前を入れてください');return}
      if(st.kind==='sub')push({t:'sub',team:st.team,slot:st.slot,name:nm.trim(),pos:($('#cPos')||{}).value||'',left:!!st.left});
      else push({t:'pc',team:1-S.half,name:nm.trim()});ui.m=null;break}
    case'undo':{if(!r||!r.events.length)return;ui.bunt=false;r.events.pop();touch();recalc();toast('1つ戻しました');break}
    case'endAsk':ui.m={type:'end',why:coldNow(S,r)?'cold':'normal'};break;
    case'endYes':push({t:'end',why:ui.m&&ui.m.why||'normal'});ui.m=null;break;
    case'cap':r.teams[+d.t].cap=d.v;touch();recalc();break;
    case'girl':{const p=r.teams[+d.t].lineup[+d.i];p.girl=!p.girl;touch();recalc();break}
    case'dhgirl':{const t=r.teams[+d.t];t.dhp=t.dhp||{name:''};t.dhp.girl=!t.dhp.girl;touch();recalc();break}
    default:return;
  }
  render();
}
function norm(m){const s=SS();return{b:m.b,r:[0,1,2].map(i=>s.bases[i]?(m.r[i]==null?i+1:m.r[i]):null)}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;act(el.dataset.a,el.dataset,el,e)});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.k,r=R();if(!k||!r)return;
  if(k==='date')r.date=el.value;else if(k==='place')r.place=el.value;else if(k==='innings')r.innings=+el.value;
  else if(k==='tname')r.teams[+el.dataset.t].name=el.value||'チーム';
  else if(k==='pn')r.teams[+el.dataset.t].lineup[+el.dataset.i].name=el.value.trim();
  else if(k==='pp')r.teams[+el.dataset.t].lineup[+el.dataset.i].pos=el.value;
  else if(k==='dhp'){const t=r.teams[+el.dataset.t];t.dhp=t.dhp||{};t.dhp.name=el.value.trim()}
  else if(k==='cinn'||k==='cd'){r.cold=(r.cold||DEFCOLD).map(c=>({...c}));const c=r.cold[+el.dataset.j],v=parseInt(el.value,10);c[k==='cinn'?'inn':'d']=v>0?v:0}
  touch();recalc();$('#hTitle').textContent=`${r.teams[0].name} vs ${r.teams[1].name}`;
  if(k==='pp')render();
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='cName'&&ui.m)ui.m.name=el.value;if(el.id==='cPos'&&ui.m)ui.m.pos=el.value});
$('#hBack').addEventListener('click',()=>{if(ui.m){ui.m=null}else{ui.view='list';ui.id=null}render()});
window.addEventListener('storage',e=>{if(e.key===RKEY){load();recalc();render()}});
load();render();
</script>
</body></html>
