  --ok:#2f7d3a;--ng:#c0392b;--warn:#b7791f;--field:#7aa86b;--fielder:#1f4e9c;--runner:#d0392b;
  --head:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;--body:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--panel:#1c241d;--fg:#e4eadf;--mute:#9aa898;--line:#2f3a30;--grass:#3f6b37;--grass2:#365e2f;--dirt:#8a6a44;--chalk:#e9eee6;--ok:#6cc27a;--ng:#ff7a6b;--warn:#e8b45a;--field:#4c7643;--fielder:#7fb0ff;--runner:#ff8a7a;color-scheme:dark}}

body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6}

<div class="wrap">
  <header>
    <h1>河川敷の少年野球　新しい試合エンジン　第1段「土台」</h1>
    <p class="lead">ボールの飛び方・選手の動き・審判の判定を、台本なしの計算で動かす土台です。今の壁紙とは別に動いています。下の結果は、このページを開いたときにその場で計算しています。</p>
  </header>
  <div class="sum" id="sum"><span class="pill">計算中…</span></div>

    <div class="btns"><button id="runStress">1000球流す</button></div>

<script>
/* 河川敷の少年野球 新しい試合エンジン ── 第1段「土台」
   共通の状況（World）・ボール・選手の移動・審判役（Umpire）・できごと・自動チェック（Checker）
   座標：ホーム(0,0)、x＝一塁側が＋、z＝センター方向、h＝高さ。単位は m・秒。
   絵は描かない。表示する側は world の位置を読むだけ（台本は持たない）。 */
(function(root){
'use strict';
const KE={version:'1.0.0'};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, hyp=Math.hypot;

/* ---------- 乱数（種を決めれば同じ試合をくり返せる） ---------- */
function makeRng(seed){
  let s=(seed>>>0)||1;
  const r=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  r.range=(a,b)=>a+r()*(b-a);r.chance=p=>r()<p;r.pick=a=>a[(r()*a.length)|0];
  r.gauss=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())};
  return r;
}
KE.makeRng=makeRng;

/* ---------- 球場 ---------- */
const FIELD={
  bd:23.05,                                  // 塁間
  bases:[[0,0],[16.3,16.3],[0,32.6],[-16.3,16.3]],
  mound:[0,16],
  fence:60,fenceH:1.2,                       // 簡易フェンス（ホームから60m）
  backstopZ:-7,backstopH:3.5,
  infieldR:29,                               // 内野の土
  pos:{P:[0,15.6],C:[0,-1.25],'1B':[14.6,19.5],'2B':[6.8,28.5],'3B':[-14.6,19.5],SS:[-6.8,28.5],LF:[-23,45],CF:[0,52],RF:[23,45]}
};
const basePos=b=>FIELD.bases[((b%4)+4)%4];
const isFair=(x,z)=>z>=Math.abs(x)-0.05;     // ラインの上はフェア
KE.FIELD=FIELD;KE.basePos=basePos;KE.isFair=isFair;

/* ---------- 能力 → 動きの大きさ（調整はここに集める） ----------
   Y(s)：少年野球らしさ。能力が低いと1に近く、S級（90台）でほぼ0＝甲子園常連校の動き */
const Y=s=>Math.pow(1-clamp(s,0,100)/100,1.4);
const sk=(k,key)=>k&&k.sk&&k.sk[key]!=null?k.sk[key]:60;
const PROF={
  runV:s=>4.6+2.7*s/100,          // 全力で走る速さ m/s（4.6〜7.3）
  runA:s=>3.4+2.2*s/100,          // 加速 m/s²
  react:s=>0.16+0.5*Y(s),         // 反応の遅れ 秒（野球の頭）
  armV:s=>14+24*s/100,            // 送球の初速 m/s（50〜137km/h）
  armErr:s=>0.010+0.075*Y(s),     // 送球の向きのずれ（ラジアン、1σ）
};
KE.Y=Y;KE.sk=sk;KE.PROF=PROF;

/* ---------- ボール ----------
   状態：held（誰かが持つ）・air（飛んでいる／はねている）・ground（転がる）・rest（止まった）・out（場外） */
const GR=9.8,KD=0.0072,KM=0.00042,BR=0.035,SPIN_TAU=4,SUB=4;
class Ball{
  constructor(){this.x=0;this.z=0;this.h=1;this.vx=0;this.vz=0;this.vh=0;this.wx=0;this.wz=0;this.wh=0;
    this.state='rest';this.holder=null;this.bounces=0;this.wall=false;this.over=null;this.src=null}
  clone(){const b=new Ball();Object.assign(b,this);b.holder=null;return b}
  get speed(){return hyp(this.vx,this.vz,this.vh)}
  get r(){return hyp(this.x,this.z)}
  // 飛ばす：位置・速度・回転（回転はベクトル rad/s、順番は x,z,h）
  launch(p,v,w,src){Object.assign(this,{x:p[0],z:p[1],h:p[2],vx:v[0],vz:v[1],vh:v[2],wx:w?w[0]:0,wz:w?w[1]:0,wh:w?w[2]:0,
    state:'air',holder:null,bounces:0,wall:false,over:null,src:src||null})}
  step(dt,emit){
    if(this.state==='held'){const k=this.holder;if(k){this.x=k.x;this.z=k.z;this.h=1.1}return}
    if(this.state==='rest'||this.state==='out')return;
    const d=dt/SUB;for(let i=0;i<SUB&&this.state!=='rest'&&this.state!=='out';i++)this.sub(d,emit);
  }
  sub(d,emit){
    if(this.state==='air'){
      const v=hyp(this.vx,this.vz,this.vh);
      // 空気の抵抗＋回転で曲がる力（マグヌス）
      const ax=-KD*v*this.vx+KM*(this.wz*this.vh-this.wh*this.vz);
      const az=-KD*v*this.vz+KM*(this.wh*this.vx-this.wx*this.vh);
      const ah=-GR-KD*v*this.vh+KM*(this.wx*this.vz-this.wz*this.vx);
      this.vx+=ax*d;this.vz+=az*d;this.vh+=ah*d;
      this.x+=this.vx*d;this.z+=this.vz*d;this.h+=this.vh*d;
      const sd=Math.exp(-d/SPIN_TAU);this.wx*=sd;this.wz*=sd;this.wh*=sd;
      if(this.h<=BR&&this.vh<0)this.bounce(emit);
    }else if(this.state==='ground'){
      const v=hyp(this.vx,this.vz),dirt=this.r<FIELD.infieldR,dec=(dirt?2.6:3.4)+0.03*v;
      if(v<=dec*d||v<0.12){this.vx=this.vz=0;this.state='rest';emit&&emit('ballStop',{x:this.x,z:this.z});return}
      const f=(v-dec*d)/v;this.vx*=f;this.vz*=f;this.x+=this.vx*d;this.z+=this.vz*d;this.h=BR;
    }
    this.walls(emit);
  }
  bounce(emit){
    const dirt=this.r<FIELD.infieldR,iv=-this.vh;
    const e=clamp((dirt?0.56:0.48)-0.007*iv,0.22,0.6);       // 軟式球はよくはねる
    // 回転の向き：バックスピンは止まり気味、トップスピンは伸びる
    const hv=hyp(this.vx,this.vz)||1,bs=(this.wx*this.vz-this.wz*this.vx)/hv;  // ＋ならバックスピン
    const fr=clamp((dirt?0.80:0.72)-0.0006*bs,0.4,0.95);
    this.h=BR;this.vh=iv*e;this.vx*=fr;this.vz*=fr;this.wx*=0.5;this.wz*=0.5;this.wh*=0.5;this.bounces++;
    emit&&emit('bounce',{x:this.x,z:this.z,n:this.bounces});
    if(this.vh<0.6){this.vh=0;this.state='ground'}
  }
  walls(emit){
    const r=this.r;
    if(r>=FIELD.fence&&this.z>-2){
      if(this.h>FIELD.fenceH+BR){this.over={fair:isFair(this.x,this.z),bounced:this.bounces>0};this.state='out';emit&&emit('overFence',{...this.over,x:this.x,z:this.z});return}
      const nx=this.x/r,nz=this.z/r,vr=this.vx*nx+this.vz*nz;
      if(vr>0){const tx=this.vx-vr*nx,tz=this.vz-vr*nz;this.vx=tx*0.7-vr*0.3*nx;this.vz=tz*0.7-vr*0.3*nz;
        this.x=nx*(FIELD.fence-0.05);this.z=nz*(FIELD.fence-0.05);this.wall=true;emit&&emit('wall',{x:this.x,z:this.z})}
    }
    if(this.z<=FIELD.backstopZ&&this.vz<0){
      if(this.h>FIELD.backstopH){this.state='out';this.over={fair:false,bounced:this.bounces>0};emit&&emit('overFence',{fair:false});return}
      this.vz=-this.vz*0.35;this.vx*=0.7;this.z=FIELD.backstopZ+0.01;emit&&emit('wall',{x:this.x,z:this.z,backstop:true});
    }
  }
}
KE.Ball=Ball;
// この先のボールの通り道（野手が追いつく場所を考えるのに使う）
KE.predict=function(ball,T=8,step=0.05){
  const b=ball.clone(),out=[[0,b.x,b.z,b.h,b.state,b.bounces]],dt=1/60;let t=0,next=step;
  while(t<T&&b.state!=='rest'&&b.state!=='out'){b.step(dt);t+=dt;if(t>=next-1e-9){out.push([t,b.x,b.z,b.h,b.state,b.bounces]);next+=step}}
  if(out[out.length-1][0]<t)out.push([t,b.x,b.z,b.h,b.state,b.bounces]);
  return out;
};

/* ---------- 送球：届く角度を計算し、能力に応じてずらす ---------- */
const THROW_SPIN=120;
function simThrow(from,dx,dz,v0,el,dist){
  const b=new Ball(),c=Math.cos(el),ux=dx/dist,uz=dz/dist;
  b.launch([from[0],from[1],from[2]],[ux*v0*c,uz*v0*c,v0*Math.sin(el)],[uz*THROW_SPIN,-ux*THROW_SPIN,0]);
  let t=0;const dt=1/120;
  while(t<6){b.step(dt);t+=dt;const s=(b.x-from[0])*ux+(b.z-from[1])*uz;
    if(s>=dist)return{h:b.h,t,reached:true,bounced:b.bounces>0};
    if(b.state==='rest'||b.state==='out')break}
  return{h:-9,t,reached:false};
}
// from=[x,z,h], to=[x,z,h]。戻り値：初速ベクトル・回転・届くまでの時間
KE.aimThrow=function(from,to,v0){
  const dx=to[0]-from[0],dz=to[1]-from[1],dist=Math.max(0.3,hyp(dx,dz));
  let lo=-0.35,hi=0.62,best=null;
  const top=simThrow(from,dx,dz,v0,hi,dist);
  if(!top.reached||top.h<to[2]){best={el:0.62,t:top.t,short:true}}   // 肩が足りない→ワンバウンド
  else{for(let i=0;i<22;i++){const m=(lo+hi)/2,r=simThrow(from,dx,dz,v0,m,dist);if(r.reached&&r.h>=to[2])hi=m;else lo=m}
    best={el:hi,t:simThrow(from,dx,dz,v0,hi,dist).t,short:false}}
  return{el:best.el,yaw:Math.atan2(dx,dz),v0,t:best.t,short:best.short,dist};
};
// 実際に投げる：k=投げる子、rng=乱数。ずれは能力で決まる
KE.throwVec=function(aim,k,rng,quality=1){
  const er=PROF.armErr(sk(k,'thr'))*quality;
  const el=aim.el+rng.gauss()*er*0.8,yaw=aim.yaw+rng.gauss()*er,v=aim.v0*(1+rng.gauss()*0.03),c=Math.cos(el);
  const ux=Math.sin(yaw),uz=Math.cos(yaw);
  return{v:[ux*v*c,uz*v*c,v*Math.sin(el)],w:[uz*THROW_SPIN,-ux*THROW_SPIN,0]};
};

/* ---------- 選手（野手も走者も同じ動き方） ---------- */
class Player{
  constructor(o){Object.assign(this,{id:'',name:'',sk:{},role:'',team:0,x:0,z:0,vx:0,vz:0,tx:null,tz:null,frac:1,wait:0,face:0,active:true},o)}
  get vmax(){return PROF.runV(sk(this,'run'))*(this.frac||1)}
  get acc(){return PROF.runA(sk(this,'run'))}
  get dec(){return this.acc*2.5}
  get react(){return PROF.react(sk(this,'iq'))}
  get speed(){return hyp(this.vx,this.vz)}
  dist(x,z){return hyp(x-this.x,z-this.z)}
  // 目的地へ。react=true なら反応の遅れのあと動き出す
  goTo(x,z,o={}){const was=this.tx!=null||this.speed>0.3;this.tx=x;this.tz=z;this.frac=o.frac||1;if(o.react&&!was)this.wait=Math.max(this.wait,this.react)}
  stop(){this.tx=this.tz=null}
  step(dt){
    if(this.wait>0){this.wait-=dt;return}
    let dvx=0,dvz=0;
    if(this.tx!=null){const dx=this.tx-this.x,dz=this.tz-this.z,d=hyp(dx,dz);
      if(d<0.03&&this.speed<0.5){this.x=this.tx;this.z=this.tz;this.vx=this.vz=0;this.tx=this.tz=null;return}
      const want=Math.min(this.vmax,Math.sqrt(2*this.dec*d));dvx=dx/d*want;dvz=dz/d*want}
    let ax=dvx-this.vx,az=dvz-this.vz;const a=hyp(ax,az),lim=(hyp(dvx,dvz)<this.speed-0.05?this.dec:this.acc)*dt;
    if(a>lim){ax*=lim/a;az*=lim/a}
    this.vx+=ax;this.vz+=az;this.x+=this.vx*dt;this.z+=this.vz*dt;
    if(this.speed>0.2)this.face=Math.atan2(this.vx,this.vz);
  }
  // そこに着くまでの見込み時間（止まった状態からなら反応も足す）
  eta(x,z,frac=1){const d=this.dist(x,z),V=PROF.runV(sk(this,'run'))*frac;if(d<0.05)return 0;
    const u=d>0?Math.max(0,(this.vx*(x-this.x)+(this.vz*(z-this.z)))/d):0,re=this.speed<0.3?Math.max(this.wait,this.react):Math.max(0,this.wait);
    return re+d/V+Math.max(0,V-u)*Math.max(0,V-u)/(2*this.acc*V)+V/(2*this.dec)}
}
KE.Player=Player;

/* ---------- 共通の状況 ---------- */
class World{
  constructor(o={}){
    this.rng=makeRng(o.seed||1);this.t=0;this.dt=o.dt||1/60;this.ball=new Ball();
    this.fielders=[];this.runners=[];this.listeners={};this.log=[];
    this.outs=0;this.score=[0,0];this.half=0;this.record=!!o.record;this.frames=[];this.fc=0;
    this.umpire=new Umpire(this);this.checkers=[];
  }
  on(type,fn){(this.listeners[type]=this.listeners[type]||[]).push(fn);return this}
  emit(type,data={}){const ev={type,t:+this.t.toFixed(3),...data};this.log.push(ev);
    for(const fn of(this.listeners[type]||[]))fn(ev,this);for(const fn of(this.listeners['*']||[]))fn(ev,this);return ev}
  addFielder(p){p.side='F';this.fielders.push(p);return p}
  addRunner(p,base,isBatter=false){p.side='R';p.rb={base,start:base,isBatter,out:false,scored:false,forceBase:null,forcer:null,mustRetouch:false,arr:{},judged:{}};
    const[bx,bz]=basePos(base);if(!isBatter||p.x===0&&p.z===0){p.x=bx;p.z=bz}this.runners.push(p);return p}
  get liveRunners(){return this.runners.filter(r=>!r.rb.out&&!r.rb.scored&&r.active)}
  give(k,how='catch'){
    const b=this.ball,inAir=b.state==='air'&&b.bounces===0&&!b.wall;
    b.state='held';b.holder=k;b.vx=b.vz=b.vh=0;b.x=k.x;b.z=k.z;b.h=1.1;
    this.emit(how,{who:k.id,role:k.role,fly:inAir,x:k.x,z:k.z});
    this.umpire.onTouch(k,inAir);
  }
  // ボールを手放す（送球・はじく）。src：'throw'|'bat'|'deflect'

  { const S=scene(KE,13,S=>{const w=S.w;w.outs=2;S.r3=w.addRunner(mk(KE,'三塁走者','',90),3);S.r1=w.addRunner(mk(KE,'一塁走者','',20),1);

  // ホームラン・エンタイトル

/* ================= 自動チェックそのものの確認 ================= */
function checker(KE,T){
  const add=(name,ok,detail)=>T.push({group:'自動チェックが見つけられるか',name,ok,detail});
  const W=()=>{const w=new KE.World({seed:5}),ck=new KE.Checker(w);return{w,ck}};

/* ================= たくさんの打球を流す（かんたんな守備で） ================= */
function stress(KE,N,seed0=1000,trace){
  const st={plays:0,viol:[],codes:{},outs:{},ends:{},fair:0,foul:0,hr:0,gr:0,runs:0,crash:0,time:0};
  const roles=['P','C','1B','2B','3B','SS','LF','CF','RF'];
  for(let n=0;n<N;n++){
    const seed=seed0+n,rng=KE.makeRng(seed*7+3),w=new KE.World({seed}),ck=new KE.Checker(w),lv=rng.range(20,95);
    try{
      const F={};roles.forEach(r=>F[r]=w.addFielder(mk(KE,r,r,Math.round(lv+rng.range(-10,10)))));
      w.outs=(rng()*3)|0;
      for(const b of[3,2,1])if(rng.chance(0.4))w.addRunner(mk(KE,`走${b}`,'',Math.round(rng.range(20,95))),b);
      const B=w.addRunner(mk(KE,'打者','',Math.round(rng.range(20,95)),{at:[0.6,0]}),0,true);
      w.umpire.startPlay({batted:true});
      const va=rng.range(-15,50),h=hitVec(rng.range(8,38),va,rng.range(-52,52),rng.range(va<5?-1500:0,2500),rng.range(-900,900));bat(w,h);
      const fly=va>12;let chaser=null,plan=0.001,holdAt=null;
      // 走者：打者は一塁へ。押し出しはゴロなら次の塁へ、フライなら半分まで
      route(B,[1]);
      for(const r of w.liveRunners)if(!r.rb.isBatter&&r.rb.forceBase){if(!fly)route(r,[r.rb.forceBase]);else{const[a,c]=[KE.basePos(r.rb.start),KE.basePos(r.rb.start+1)];r.goTo((a[0]+c[0])/2,(a[1]+c[1])/2,{react:true})}}
      w.on('bounce',e=>{if(e.n===1&&w.umpire.play&&w.umpire.play.firstTouchT==null&&w.ball.src==='bat')for(const r of w.liveRunners)if(!r.rb.isBatter&&(r.rb.forceBase||hyp(e.x,e.z)>34)&&!r.route?.length){r.stop();route(r,[Math.min(4,r.rb.start+1)])}});
      w.on('flyCatch',()=>{for(const r of w.liveRunners)if(r.rb.mustRetouch){r.route=[];r.stop();route(r,[r.rb.start])}else if(!r.rb.isBatter){r.route=[];const[bx,bz]=KE.basePos(r.rb.base);r.goTo(bx,bz)}});
      w.on('hr',()=>w.liveRunners.forEach(r=>{r.stop();route(r,[1,2,3,4].filter(b=>b>r.rb.base))}));
      w.on('groundRule',()=>w.liveRunners.forEach(r=>{r.stop();route(r,[1,2,3,4].filter(b=>b>r.rb.base&&b<=r.rb.awardTo))}));
      const cover={1:F['1B'],2:F['SS'],3:F['3B'],4:F['C']};
      const plan2=()=>{const pr=KE.predict(w.ball,10,0.05);let best=null;
        for(const f of w.fielders){for(const q of pr){if(q[3]>2.2)continue;const e=f.eta(q[1],q[2]);if(e<=q[0]){if(!best||q[0]<best.t)best={f,t:q[0],x:q[1],z:q[2]};break}}
          const L=pr[pr.length-1],e=f.eta(L[1],L[2]),tt=Math.max(L[0],e);if(!best||tt<best.t-1e-6&&!pr.some(q=>q[3]<=2.2&&f.eta(q[1],q[2])<=q[0]))if(!best||tt<best.t)best={f,t:tt,x:L[1],z:L[2]}}
        if(chaser&&chaser!==best.f)chaser.stop();chaser=best.f;chaser.goTo(best.x,best.z,{react:true});
        for(const b of[1,2,3,4]){const c=cover[b];if(c===chaser){if(b===2&&F['2B']!==chaser){cover[2]=F['2B']}else continue}const[bx,bz]=KE.basePos(b);if(cover[b]!==chaser)cover[b].goTo(bx,bz,{react:true})}};
      w.on('loose',()=>{plan=w.t+0.01});w.on('wall',()=>{plan=w.t+0.01});
      w.run(45,()=>{routeTick(w);if(trace&&Math.round(w.t*60)%30===0)trace(w,chaser);
        const b=w.ball;if(b.state==='out')return;
        if(b.state!=='held'){if(plan&&w.t>=plan){plan=w.t+0.5;plan2()}
          for(const f of w.fielders)if(catchNear(w,f,f===chaser?1.0:0.9)){holdAt=w.t;break}return}
        const k=b.holder;if(!k||holdAt==null||w.t-holdAt<0.3+k.react*0.5)return;
        // ボールを持った子：まだ着いていない押し出しの塁→走っている走者の先の塁→外野なら内野へ
        const live=w.liveRunners;let tgt=null;
        const f2=live.filter(r=>w.umpire.forced(r)).sort((a,c)=>c.rb.forceBase-a.rb.forceBase);
        for(const r of f2){const c=cover[r.rb.forceBase];if(c&&c!==k&&hyp(c.x-KE.basePos(r.rb.forceBase)[0],c.z-KE.basePos(r.rb.forceBase)[1])<1.5){tgt=c;break}
          if(c===k||hyp(k.x-KE.basePos(r.rb.forceBase)[0],k.z-KE.basePos(r.rb.forceBase)[1])<5){const[bx,bz]=KE.basePos(r.rb.forceBase);k.goTo(bx,bz);holdAt=null;return}}
        if(!tgt)for(const r of live){if(r.rb.mustRetouch){const c=cover[r.rb.start]||F['1B'];if(c!==k){tgt=c;break}const[bx,bz]=KE.basePos(r.rb.start);k.goTo(bx,bz);holdAt=null;return}}
        if(!tgt){const mv=live.find(r=>r.speed>0.5&&r.tx!=null);if(mv){const nb=Math.min(4,mv.rb.base+1),c=cover[nb];if(c&&c!==k)tgt=c}}
        if(!tgt&&hyp(k.x,k.z)>KE.FIELD.infieldR+6)tgt=F['SS']===k?F['2B']:F['SS'];
        if(tgt){w.throwTo(k,[tgt.x,tgt.z,1.2]);holdAt=null}else{holdAt=w.t}
      });
      if(!w.umpire.ended)ck.bad('stall45','45秒たってもプレーが終わらない');
      st.plays++;const L=w.log;st.fair+=L.some(e=>e.type==='fair');st.foul+=L.some(e=>e.type==='foul');st.hr+=L.some(e=>e.type==='hr');st.gr+=L.some(e=>e.type==='groundRule');
      for(const e of L)if(e.type==='out'){const k=({force:'フォース',tag:'タッチ',fly:'フライ',appeal:'リタッチ'})[e.outType]||e.outType;st.outs[k]=(st.outs[k]||0)+1}
      const end=L.find(e=>e.type==='playEnd');const ek=end?({time:'ふつうに終わる',foul:'ファウル',threeOuts:'3アウト',hr:'ホームラン',groundRule:'エンタイトル'})[end.why]||end.why:'終わらない';st.ends[ek]=(st.ends[ek]||0)+1;
      st.runs+=w.score[0];st.time+=w.t;
      for(const v of ck.v){st.codes[v.code]=(st.codes[v.code]||0)+1;if(st.viol.length<20)st.viol.push({seed,...v})}
    }catch(err){st.crash++;if(st.viol.length<20)st.viol.push({seed,code:'crash',msg:String(err&&err.stack||err).slice(0,300)})}
  }
st.avgT=st.time/Math.max(1,st.plays);
  return st;
}

KT.AI_CODES=['farPick','hold','still','stall45','stall'];
KT.runAll=function(KE,o={}){KE_=KE;const T=[];physics(KE,T);movement(KE,T);umpire(KE,T);checker(KE,T);
  const s=o.stress?stress(KE,o.stress):null;return{tests:T,stress:s}};
KT.stress=(KE,N,s0,tr)=>{KE_=KE;return stress(KE,N,s0,tr)};KT.hitVec=hitVec;KT.mk=mk;
if(typeof module!=='undefined'&&module.exports)module.exports=KT;else root.KT=KT;
})(typeof window!=='undefined'?window:globalThis);

<script>
(function(){

function evText(e){switch(e.type){case'out':return`<b>アウト</b>（${OUTJ[e.outType]||e.outType}）${e.name||''}`;
  case'safe':return`セーフ${e.close?'（きわどい）':''}`;case'home':return`ホームイン ${e.name||''}`;case'fair':return'フェア';case'foul':return'ファウル';
  case'hr':return'<b>ホームラン</b>';case'groundRule':return'エンタイトル二塁打';case'runVoid':return'得点取り消し';case'flyCatch':return'フライ捕球';
  case'retouch':return'元の塁に戻った';case'playEnd':return`プレー終わり（${({time:'ボールが戻った',foul:'ファウル',threeOuts:'3アウト',hr:'ホームラン',groundRule:'エンタイトル'})[e.why]||e.why}）`;default:return e.type}}

  ctx.fillStyle=css('--field');ctx.fillRect(0,0,W,H);
  ctx.fillStyle=css('--grass');ctx.beginPath();ctx.moveTo(X(0),Z(0));ctx.arc(X(0),Z(0),60*S,-Math.PI/4-Math.PI/2,-Math.PI/4);ctx.closePath();ctx.fill();
  ctx.fillStyle=css('--dirt');ctx.beginPath();ctx.moveTo(X(0),Z(0));ctx.arc(X(0),Z(0),29*S,-Math.PI/4-Math.PI/2,-Math.PI/4);ctx.closePath();ctx.fill();
  ctx.fillStyle=css('--grass2');ctx.beginPath();[[0,4],[12.3,16.3],[0,28.6],[-12.3,16.3]].forEach(([x,z],i)=>i?ctx.lineTo(X(x),Z(z)):ctx.moveTo(X(x),Z(z)));ctx.fill();
  ctx.strokeStyle=css('--chalk');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(-44),Z(44));ctx.lineTo(X(0),Z(0));ctx.lineTo(X(44),Z(44));ctx.stroke();
  ctx.lineWidth=3;ctx.strokeStyle=css('--fg');ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(X(0),Z(0),60*S,-Math.PI/4-Math.PI/2,-Math.PI/4);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=css('--chalk');KE.FIELD.bases.forEach(([x,z])=>{ctx.save();ctx.translate(X(x),Z(z));ctx.rotate(Math.PI/4);ctx.fillRect(-4,-4,8,8);ctx.restore()});
  ctx.fillStyle=css('--chalk');ctx.globalAlpha=.8;ctx.font=`${11}px ${css('--body')}`;ctx.fillText('60m',X(0)-10,Z(60)+14);ctx.globalAlpha=1;
}
function dot(x,z,r,c,label){ctx.fillStyle=c;ctx.beginPath();ctx.arc(X(x),Z(z),r,0,7);ctx.fill();if(label){ctx.fillStyle=css('--chalk');ctx.font=`bold 10px ${css('--body')}`;ctx.fillText(label,X(x)+r+2,Z(z)+3)}}
function ball(x,z,h){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X(x),Z(z),4,2.5,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.arc(X(x),Z(z)-h*S*0.55,4,0,7);ctx.fill();ctx.stroke()}
let anim=null;
function play(frames,trail,done){cancelAnimationFrame(anim);let i=0,t0=performance.now();const T=frames[frames.length-1].t;
  const tick=now=>{const t=(now-t0)/1000;while(i<frames.length-1&&frames[i+1].t<=t)i++;field();
    if(trail){ctx.strokeStyle=css('--chalk');ctx.globalAlpha=.55;ctx.setLineDash([3,4]);ctx.beginPath();trail.forEach((q,j)=>{if(q[0]>t)return;j?ctx.lineTo(X(q[1]),Z(q[2])-q[3]*S*.55):ctx.moveTo(X(q[1]),Z(q[2])-q[3]*S*.55)});ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
    const f=frames[i];(f.f||[]).forEach(p=>dot(p[0],p[1],6,css('--fielder'),p[2]));(f.r||[]).forEach(p=>dot(p[0],p[1],6,p[2]?css('--mute'):css('--runner'),p[3]));
    if(f.b)ball(...f.b);if(done)done(t);if(t<T+0.6)anim=requestAnimationFrame(tick)};anim=requestAnimationFrame(tick)}
const KIND={goro:()=>[r(20,32),r(-14,-4),r(-40,40),r(-1500,-300),r(-500,500)],liner:()=>[r(28,36),r(5,12),r(-35,35),r(500,1500),r(-500,500)],
  fly:()=>[r(22,28),r(26,36),r(-38,38),r(1500,2400),r(-600,600)],pop:()=>[r(18,26),r(65,80),r(-30,30),r(1500,2500),r(-400,400)],
  hr:()=>[r(39,43),r(26,32),r(-35,35),r(1800,2500),r(-300,300)],foul:()=>[r(20,30),r(10,35),(Math.random()<.5?-1:1)*r(47,60),r(800,2000),r(-500,500)],
  rand:()=>[r(8,40),r(-15,60),r(-55,55),r(-1000,2500),r(-900,900)]};
function r(a,b){return a+Math.random()*(b-a)}
function hit(k){const[v,va,ang,back,side]=KIND[k]();const h=KT.hitVec(v,va,ang,back,side);const b=new KE.Ball();b.launch(h.p,h.v,h.w);
  const pr=KE.predict(b,10,1/30);const frames=pr.map(q=>({t:q[0],b:[q[1],q[2],q[3]]}));
  let landT=null,landD=0,peak=0;for(const q of pr){peak=Math.max(peak,q[3]);if(landT==null&&q[5]>0){landT=q[0];landD=Math.hypot(q[1],q[2])}}
  const last=pr[pr.length-1],over=last[4]==='out';
  const fair=KE.isFair(last[1],last[2]);
  $('#info').textContent=`打球 ${Math.round(v*3.6)}km/h・上下${Math.round(va)}度・${ang>0?'一塁側':'三塁側'}${Math.abs(Math.round(ang))}度　→　${over?(fair?'フェンス越え（ホームラン）':'場外ファウル'):landT!=null?`${landD.toFixed(0)}m先に落下（滞空${landT.toFixed(1)}秒・最高${peak.toFixed(1)}m）、${Math.hypot(last[1],last[2]).toFixed(0)}mで止まる`:'転がって止まる'}`;
  $('#log').innerHTML='';play(frames,pr)}
$('#hits').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)hit(k)});
field();
function renderTests(res){
  const T=res.tests,ok=T.filter(t=>t.ok).length,ng=T.length-ok;
  $('#sum').innerHTML=`<span class="pill ${ng?'ng':'ok'}">テスト ${ok}／${T.length} 合格</span>`+(ng?`<span class="pill ng">不合格 ${ng}</span>`:'');
  const groups=[...new Set(T.map(t=>t.group))];
  $('#tests').innerHTML=groups.map(g=>`<div class="grp"><h3>${g}</h3>${T.map((t,i)=>t.group!==g?'':`<div class="row"><span class="m ${t.ok?'ok':'ng'}">${t.ok?'○':'×'}</span><span class="n">${t.name}${t.detail?`<span class="d">${t.detail}</span>`:''}</span>${t.frames&&t.frames.length?`<button data-i="${i}">再生</button>`:'<span></span>'}</div>`).join('')}</div>`).join('');
  $('#tests').onclick=e=>{const i=e.target.dataset&&e.target.dataset.i;if(i==null)return;const t=T[+i];
    $('#info').textContent='再生中：'+t.name;window.scrollTo({top:cv.getBoundingClientRect().top+scrollY-20,behavior:'smooth'});
    const shown=new Set();$('#log').innerHTML='';
    play(t.frames,null,tt=>{(t.log||[]).forEach((e,j)=>{if(e.t<=tt&&!shown.has(j)){shown.add(j);$('#log').insertAdjacentHTML('beforeend',`<span>${e.t.toFixed(1)}秒 ${evText(e)}</span>`)}})})};
  return{ok,ng};
}
let base=null;
setTimeout(()=>{const res=KT.runAll(KE,{});base=renderTests(res)},30);
$('#runStress').onclick=()=>{const btn=$('#runStress');btn.disabled=true;const N=1000,step=50;let acc=null,done=0;
  const merge=(a,b)=>{if(!a)return b;for(const k of['plays','fair','foul','hr','gr','runs','crash','time'])a[k]+=b[k];for(const m of['codes','outs','ends'])for(const k in b[m])a[m][k]=(a[m][k]||0)+b[m][k];a.viol=a.viol.concat(b.viol).slice(0,20);return a};
  const go=()=>{acc=merge(acc,KT.stress(KE,step,5000+done));done+=step;show(acc,done<N);if(done<N)setTimeout(go,0);else btn.disabled=false};go()};
function show(s,running){
  const rule=Object.entries(s.codes).filter(([k])=>!KT.AI_CODES.includes(k)).reduce((a,[,v])=>a+v,0)+s.crash;
  const ai=Object.entries(s.codes).filter(([k])=>KT.AI_CODES.includes(k)).reduce((a,[,v])=>a+v,0);
  const kv=(k,v)=>`<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  $('#stress').innerHTML=kv('流した打球',`${s.plays}${running?'…':''}`)+kv('審判の決まりの違反',`<span style="color:var(${rule?'--ng':'--ok'})">${rule}件</span>`)+kv('仮の守備の気になる点',`${ai}件`)+
    kv('アウトの内訳',Object.entries(s.outs).map(([k,v])=>`${k}${v}`).join('・')||'—')+kv('フェア／ファウル',`${s.fair}／${s.foul}`)+kv('ホームラン・エンタイトル',`${s.hr}・${s.gr}`)+kv('1プレーの平均',`${(s.time/s.plays).toFixed(1)}秒`);
}
})();
</script>
