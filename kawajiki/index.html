<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>河川敷の少年野球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: full-bleed canvas scene; small scoreboard + settings float top-right */
:root{
  --ink:#2a3142; --paper:#fffcf3; --line:#ddd4bd; --chip:#f1ead7; --navy:#24418a; --muted:#6b7286;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
body{height:100%;margin:0;background:#9cc7e6;color:var(--ink);font-family:var(--font);overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.board{background:rgba(32,58,44,.82);color:#f4f1e4;border-radius:10px;padding:6px 10px 7px;font-size:13px;line-height:1.35;min-width:132px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.board .row{display:flex;justify-content:space-between;gap:14px}
.ls{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px;color:#f4f1e4}
.ls td,.ls th{color:inherit;font-family:var(--font)}
.ls th{font-weight:500;font-size:10.5px;opacity:.7;padding:0 0 2px;text-align:center;min-width:15px}
.ls td{text-align:center;padding:1px 0;min-width:15px}
.ls td.tn{text-align:left;padding-right:8px;max-width:5.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls .tot{font-weight:700;padding-left:6px;min-width:20px}
.ls td.now{color:#f6d23a}
.board .sc{font-variant-numeric:tabular-nums;font-weight:700}
.board .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px;padding-top:3px;border-top:1px solid rgba(244,241,228,.25);font-size:12px}
.bsoWrap{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.bso{display:flex;flex-direction:column;gap:3px}
.dia rect{fill:rgba(244,241,228,.16);stroke:rgba(244,241,228,.35);stroke-width:1}
.dia rect.on{fill:#f6d23a;stroke:#f6d23a}
.lr{display:flex;align-items:center;gap:4px}
.lr b{width:12px;font-size:11px;font-weight:700;opacity:.85}
.lp{width:10px;height:10px;border-radius:50%;background:rgba(244,241,228,.16);display:inline-block}
.lp.g.on{background:#3fd172}.lp.y.on{background:#f6d23a}.lp.r.on{background:#f04b3e}
.appbtn{font-family:var(--font);font-size:14px;font-weight:700;border:0;border-radius:10px;padding:10px;background:var(--navy);color:#fff;cursor:pointer}
.phase{background:rgba(32,58,44,.78);color:#f4f1e4;border-radius:10px;padding:5px 10px;font-size:13px}
#gear{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,252,243,.78);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#gear:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#panel{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 20px));background:var(--paper);border-radius:14px;padding:14px 14px 12px;box-shadow:0 6px 24px rgba(20,30,40,.25);display:flex;flex-direction:column;gap:12px;font-size:14px}
#panel h2{font-size:15px;margin:0;font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.05em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button,.chips button{font-family:var(--font);font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 0;cursor:pointer}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.trow{display:flex;align-items:center;gap:8px}
.trow input{flex:1;min-width:0}
.tval{font-variant-numeric:tabular-nums;width:44px;text-align:right}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.wp #gear{display:none}
[hidden]{display:none!important}
#vbar{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:30;width:max-content;max-width:calc(100% - 20px)}
#vbar button{font:700 13px 'Zen Maru Gothic',sans-serif;color:#fff;background:rgba(30,40,60,.72);border:0;border-radius:999px;padding:8px 12px;min-height:36px}
#vbar button[aria-pressed=true]{background:rgba(196,88,44,.9)}
#rpTag{position:absolute;left:12px;top:12px;z-index:30;font:700 14px 'Zen Maru Gothic',sans-serif;color:#fff;background:#c4582c;border-radius:6px;padding:4px 10px}
#sheet{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto;background:var(--paper);border-radius:16px;box-shadow:0 8px 30px rgba(20,30,40,.3);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh-head .seg{flex:1;grid-template-columns:repeat(2,1fr);max-width:260px}
.xbtn{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.sh-body{flex:1;overflow:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:14px}
.sh-body h3{font-size:14px;margin:0 0 6px;font-weight:700}
.tpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tpick button{font-family:var(--font);font-size:14px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.tpick button[aria-pressed="true"]{border-color:var(--navy)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.field{display:flex;flex-direction:column;gap:5px}
.field select,.field input[type=text]{font-family:var(--font);font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{display:flex;align-items:center;gap:5px;font-family:var(--font);font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px 4px 5px;cursor:pointer;color:var(--ink)}
.sw button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.sw .dot{width:16px;height:16px}
.roster{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:34px 1fr 92px;gap:6px;align-items:center}
.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:center;background:var(--chip);border-radius:6px;padding:6px 0;font-size:13px}
.prow input{font-family:var(--font);font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.gseg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.gseg button{font-family:var(--font);font-size:12px;border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:6px 0;cursor:pointer;color:var(--ink)}
.gseg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;width:100%}
.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th{font-weight:700;color:var(--muted);font-size:11.5px}
.tbl td:first-child,.tbl th:first-child,.tbl .l{text-align:left}
.log li{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line);list-style:none;font-variant-numeric:tabular-nums}
.log{margin:0;padding:0}
.pname{font-family:var(--font);font-size:12.5px;border:0;background:none;padding:0;color:var(--navy);text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
.danger{font-family:var(--font);font-size:13px;border:1px solid #d9a4a0;background:#fff;color:#a5372f;border-radius:8px;padding:7px 10px;cursor:pointer;align-self:flex-start}
</style>

<div id="stage">
  <canvas id="cv" aria-label="堤防の上から河川敷の少年野球を眺める動く壁紙"></canvas>
  <div id="vbar" hidden><button data-r="60">◀◀60秒前</button><button data-r="30">◀◀30秒前</button><button data-r="10">◀◀10秒前</button><button id="bFF">▶▶ 1倍</button><button id="bSlow" hidden>スロー</button><button id="bLive" hidden>ライブに戻る</button></div>
  <div id="rpTag" hidden>リプレイ</div>
  <div id="hud">
    <div class="board" id="board" hidden>
      <table class="ls" id="ls"><thead><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th class="tot">計</th></tr></thead>
        <tbody><tr id="lsA"><td class="tn"></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="tot"></td></tr>
        <tr id="lsH"><td class="tn"></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="tot"></td></tr></tbody></table>
      <div class="meta"><span id="inn">1回オモテ</span></div>
      <div class="bsoWrap" id="bso">
        <div class="bso">
          <div class="lr"><b>B</b><i class="lp g"></i><i class="lp g"></i><i class="lp g"></i></div>
          <div class="lr"><b>S</b><i class="lp y"></i><i class="lp y"></i></div>
          <div class="lr"><b>O</b><i class="lp r"></i><i class="lp r"></i></div>
        </div>
        <svg class="dia" viewBox="0 0 48 40" width="54" height="45" aria-label="ランナー">
          <rect id="db2" x="18" y="2" width="12" height="12" transform="rotate(45 24 8)"/>
          <rect id="db1" x="31" y="15" width="12" height="12" transform="rotate(45 37 21)"/>
          <rect id="db3" x="5" y="15" width="12" height="12" transform="rotate(45 11 21)"/>
        </svg>
      </div>
    </div>
    <div class="phase" id="phase" hidden></div>
    <button id="gear" aria-label="設定" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#fffcf3"/><circle cx="15" cy="12" r="2" fill="#fffcf3"/><circle cx="8" cy="18" r="2" fill="#fffcf3"/></svg>
    </button>
  </div>
  <div id="panel" hidden>
    <div style="display:flex;align-items:center;justify-content:space-between"><h2>設定</h2><button class="xbtn" id="panelClose" aria-label="設定を閉じる" style="margin:0">×</button></div>
    <div>
      <div class="lbl">吹き出しの量</div>
      <div class="seg" id="talkSeg">
        <button data-v="3">にぎやか</button><button data-v="2">ふつう</button><button data-v="1">ポツポツ</button><button data-v="0">なし</button>
      </div>
    </div>
    <div>
      <div class="lbl">選手の名前</div>
      <div class="seg" id="nameSeg" style="grid-template-columns:repeat(3,1fr)">
        <button data-v="2">全員</button><button data-v="1">打者・走者・投手</button><button data-v="0">なし</button>
      </div>
    </div>
    <div>
      <div class="lbl">時間帯</div>
      <div class="chips" id="timeChips">
        <button data-h="now">いまの時刻</button><button data-h="6.3">夜明け</button><button data-h="7.6">朝練</button>
        <button data-h="11">試合</button><button data-h="17.2">グラウンド整備</button><button data-h="20">夜</button>
      </div>
      <div class="seg" id="optSeg" style="grid-template-columns:1fr 1fr;margin-top:8px">
        <button id="tNight">ナイター：オフ</button><button id="tZoom">見せ場のアップ：オン</button><button id="tEco">省電力：オフ</button><button id="tEcoA">電池が少ないとき自動で省電力：オン</button>
      </div>
      <div class="trow" style="margin-top:8px">
        <input type="range" id="hourR" min="0" max="23.75" step="0.25" aria-label="時刻を指定">
        <span class="tval" id="hourV">--:--</span>
      </div>
    </div>
    <button class="appbtn" id="bTeams" style="background:#2f6b4a">チーム・成績</button>
    <a class="appbtn" href="sokuho.html" style="background:#c0392b;text-align:center;text-decoration:none">一球速報（記録・野球場で再生）</a>
    <button class="appbtn" id="bRpStop" style="background:#5a6b8a" hidden>再生をやめて元の試合に戻る</button>
    <button class="appbtn" id="bRestart" style="background:#8a5a34">試合を最初からやり直す</button>
    <div id="appBox" hidden><button class="appbtn" id="bWp">この野球場を壁紙にする</button></div>
    <p class="note">朝練7:00〜、試合8:30〜17:00、整備〜17:40、夕方以降は誰もいないグラウンドになります。スマホでは指で左右に見回せます。</p>
  </div>
</div>

<div id="sheet" hidden role="dialog" aria-label="チームと成績">
  <div class="sh-head">
    <div class="seg" id="shTabs"><button data-t="team" aria-pressed="true">チーム登録</button><button data-t="stats">成績</button></div>
    <button class="xbtn" id="shClose" aria-label="閉じる">×</button>
  </div>
  <div class="sh-body" id="shBody"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), cx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0], chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- settings ---------- */
const S={talk:2, hour:null, names:2, night:false, zoom:true};
try{const v=JSON.parse(localStorage.getItem('kawajiki.v1')||'{}'); if(v.talk!=null)S.talk=v.talk;if(v.names!=null)S.names=v.names;if(v.night!=null)S.night=v.night;if(v.zoom!=null)S.zoom=v.zoom;if(v.eco!=null)S.eco=v.eco;if(v.ecoA!=null)S.ecoA=v.ecoA;}catch(e){}
function saveS(){try{localStorage.setItem('kawajiki.v1',JSON.stringify({talk:S.talk,names:S.names,night:S.night,zoom:S.zoom,eco:S.eco,ecoA:S.ecoA}))}catch(e){}}
const BUILD='20261108100524';
const SPEED=clamp(+(new URLSearchParams(location.search).get('speed')||1),1,30);
const WALL=new URLSearchParams(location.search).has('wallpaper')||location.hash==='#wallpaper';
// スマホの壁紙（?wallpaper）は歯車を隠す。PCの壁紙（?wallpaper=1 など）は歯車を出して設定できるようにする
if(WALL&&!(new URLSearchParams(location.search).get('wallpaper')))document.body.classList.add('wp');
function loadS(){try{const v=JSON.parse(localStorage.getItem('kawajiki.v1')||'{}');if(v.talk!=null)S.talk=v.talk;if(v.names!=null)S.names=v.names;if(v.night!=null)S.night=v.night;if(v.zoom!=null)S.zoom=v.zoom;if(v.eco!=null)S.eco=v.eco;if(v.ecoA!=null)S.ecoA=v.ecoA}catch(e){}}

/* ---------- world projection ---------- */
const CX=600, HZ=210, F=1075, D=35, CH=14;
function P(x,z,y=0){const k=F/(z+D);return{x:CX+x*k,y:HZ+(CH-y)*k,k}}
const BASES=[[0,0],[16.3,16.3],[0,32.6],[-16.3,16.3]];
const POSN=['P','C','1B','2B','3B','SS','LF','CF','RF'];
const POS={P:[0,15.6],C:[0,-1.25],'1B':[14.6,19.5],'2B':[6.8,28.5],'3B':[-14.6,19.5],SS:[-6.8,28.5],LF:[-23,45],CF:[0,52],RF:[23,45]};

/* ---------- teams ---------- */
const HOME={name:'かもめ',cap:'#25408a',capD:'#182c63',body:'#f7f6ef',trim:'#25408a',pants:'#f4f3ec',sock:'#25408a',
  names:['はると','そうた','ゆうま','りく','こうた','ひなた','いつき','みなと','あさひ']};
const AWAYS=[
 {name:'ドジャース',lv:78,cap:'#1e4fa1',capD:'#143a7a',body:'#f7f6ef',trim:'#1e4fa1',pants:'#f4f3ec',sock:'#1e4fa1'},
 {name:'ヤンキース',lv:74,cap:'#1c2841',capD:'#10182a',body:'#f4f4f0',trim:'#1c2841',pants:'#f4f4f0',sock:'#1c2841'},
 {name:'カブス',lv:60,cap:'#1d4aa0',capD:'#123274',body:'#f7f6ef',trim:'#c8323a',pants:'#f4f3ec',sock:'#1d4aa0'},
 {name:'パドレス',lv:66,cap:'#4b3a2a',capD:'#33271b',body:'#f1ece0',trim:'#d9a42b',pants:'#f1ece0',sock:'#4b3a2a'},
 {name:'マリナーズ',lv:58,cap:'#173a63',capD:'#0e2645',body:'#bfc6cf',trim:'#0f7b72',pants:'#e9ebee',sock:'#173a63'},
 {name:'エンゼルス',lv:55,cap:'#b4232e',capD:'#82171f',body:'#f7f6ef',trim:'#b4232e',pants:'#f4f3ec',sock:'#b4232e'},
 {name:'レッドソックス',lv:70,cap:'#1b2a46',capD:'#101a2e',body:'#f7f6ef',trim:'#c3303c',pants:'#f4f3ec',sock:'#c3303c'},
 {name:'ジャイアンツ',lv:64,cap:'#26262b',capD:'#141417',body:'#f1ece0',trim:'#ec6a2c',pants:'#f1ece0',sock:'#26262b'},
];
const MLB_NAMES={
 'ドジャース':['オオタニ','ベッツ','フリーマン','カーショウ','スミス','マンシー','ヤマモト','ビューラー','テオスカー','エドマン','ロハス','パヘス','キケ','グラスノー'],
 'ヤンキース':['ジャッジ','ソト','コール','スタントン','リゾ','ボルピー','チザム','ロドン','ウェルズ','ルメイユ','ジーター','リベラ','マツイ','ベリンジャー'],
 'カブス':['スズキ','ホーナー','ハップ','スワンソン','イマナガ','タッカー','ブッシュ','アマヤ','スティール','ブライアント','ソーサ','サンドバーグ','バエズ','クロウ'],
 'パドレス':['タティス','マチャド','ダルビッシュ','メリル','クロネンワース','ボガーツ','シース','キム','アラエス','ヒガシオカ','マスグローブ','グウィン','ペラルタ','プロファー'],
 'マリナーズ':['フリオ','ローリー','カスティーヨ','ギルバート','カービー','クロフォード','ポランコ','イチロー','グリフィー','マルティネス','ムニョス','ミラー','アロザレーナ','ラレイ'],
 'エンゼルス':['トラウト','レンドン','ネト','ウォード','オホッピー','デトマーズ','モニアック','シャヌエル','ソリアーノ','アンダーソン','プホルス','ハセガワ','ジョイス','アデル'],
 'レッドソックス':['デバース','カサス','デュラン','ストーリー','ブレグマン','ヨシダ','オルティス','ペドロ','アブレイユ','ラファエラ','ベロ','クロシェ','ヤズ','ウィリアムズ'],

};

let ents=[];
class Ent{
  constructor(o){Object.assign(this,{kind:'kid',x:0,z:0,tx:null,tz:null,speed:3,size:1,phase:Math.random()*6,seed:Math.random()*10,
    idlePose:'stand',idleFace:'f',poseO:null,poseUntil:0,faceO:null,stunUntil:0,fallDir:1,dizzy:false,res:null,moving:false,mface:'f',
    skin:pick(SKINS),hair:pick(HAIRS),talkUntil:0,blinkAt:rnd(1,4)},o);
    if(this.tx==null){this.tx=this.x;this.tz=this.z}
  }
  goto(x,z,sp){this.tx=x;this.tz=z;if(sp)this.speed=sp;if(this.res){this.res();}return new Promise(r=>{this.res=r})}
  walkTo(x,z,sp){this.tx=x;this.tz=z;if(sp)this.speed=sp}
  place(x,z){this.x=this.tx=x;this.z=this.tz=z}
  setPose(p,dur,face){this.poseO=p;this.poseUntil=simT+dur;this.faceO=face||null;this.poseT0=simT;this.poseDur=dur}
  fall(dur,dir,dizzy=true){this.stunUntil=simT+dur;this.fallDir=dir;this.dizzy=dizzy;this.poseO=null}
  get pose(){
    if(this.stunUntil>simT)return'fall';
    if(this.poseO)return this.poseO;
    if(this.moving)return this.speed>2.4?'run':'walk';
    return this.idlePose;
  }
  get facing(){
    if(this.poseO&&this.faceO)return this.faceO;
    if(this.moving)return this.mface;
    return this.idleFace;
  }
  update(dt){
    if(this.poseO&&simT>this.poseUntil){this.poseO=null;this.faceO=null}
    if(this.stunUntil>simT)return;
    const dx=this.tx-this.x,dz=this.tz-this.z,d=Math.hypot(dx,dz);
    if(d>0.04){
      const st=Math.min(d,this.speed*dt);this.x+=dx/d*st;this.z+=dz/d*st;this.moving=true;
      this.phase+=dt*(this.speed*2.6+2);
      this.mface=Math.abs(dx)>Math.abs(dz)*0.7?(dx>0?'r':'l'):(dz>0?'b':'f');
    }else{
      this.x=this.tx;this.z=this.tz;this.moving=false;
      if(this.res){const r=this.res;this.res=null;r()}
      if(this.despawn)this.dead=true;
    }
    if(this.dog){const dg=this.dog;dg.x=this.x-this.mdir*1.3;dg.z=this.z+0.4;dg.moving=this.moving;dg.phase=this.phase;dg.mdir=this.mdir;dg.dead=this.dead}
  }
}
class Ball{
  constructor(){this.kind='ball';this.x=0;this.z=15;this.h=1;this.vis=true;this.holder=null;this.path=null}
  flyTo(x,z,dur,arc,h0,h1,ground=false){
    this.holder=null;if(this.path&&this.path.res)this.path.res();
    const p={x0:this.x,z0:this.z,h0:h0??this.h,x1:x,z1:z,h1:h1??0.12,dur:Math.max(.05,dur),arc,ground,t0:simT};
    this.path=p;return new Promise(r=>{p.res=r});
  }
  update(){
    if(this.holder){const k=this.holder;this.path=null;this.x=k.x+0.18;this.z=k.z-0.08;this.h=(k.kind==='adult'?1.15:0.8)*k.size;return}
    const p=this.path;if(!p)return;
    let u=Math.min(1,(simT-p.t0)/p.dur);
    this.x=p.x0+(p.x1-p.x0)*u;this.z=p.z0+(p.z1-p.z0)*u;
    let h=p.h0+(p.h1-p.h0)*u;
    h+=p.ground?Math.abs(Math.sin(u*Math.PI*3))*p.arc*(1-u):p.arc*4*u*(1-u);
    this.h=Math.max(0,h);
    if(u>=1){this.path=null;if(p.res){const r=p.res;p.res=null;r()}}
  }
}
class Fly{constructor(x,z){this.kind='fly';this.x=x;this.z=z;this.h=1.2;this.leave=false;this.t=Math.random()*9}
  update(dt){this.t+=dt;if(this.leave){this.h+=dt*1.2;this.x+=dt*1.5;if(this.h>9)this.dead=true}else{this.x+=Math.sin(this.t*1.3)*dt*1.2;this.z+=Math.cos(this.t*.9)*dt*0.9;this.h=1.1+Math.sin(this.t*2.1)*.35}}}

let bubbles=[];
const TALK_P=[[0,0,0],[.12,.4,1],[.45,.85,1],[1,1,1]];
const TALK_MAX=[0,2,3,4];
function say(e,text,pri=0){
  if(!e||e.dead)return;
  if(Math.random()>=TALK_P[S.talk][pri])return;
  bubbles=bubbles.filter(b=>b.e!==e);
  if(bubbles.length>=TALK_MAX[S.talk]){
    const low=bubbles.slice().sort((a,b)=>a.pri-b.pri||a.born-b.born)[0];
    if(low.pri>pri)return;
    bubbles=bubbles.filter(b=>b!==low);
  }
  const ttl=1.8+text.length*.09;
  bubbles.push({e,text,pri,born:simT,ttl});e.talkUntil=simT+Math.min(ttl,1.6);
}

function ensureSkills(v){let ch=false;if(!v.start){v.start=Date.now();ch=true}

function progOf(p,d){const days=(Date.now()-(d.start||Date.now()))/864e5,g=((d.st.p[p.id]||{}).g)||0;return clamp(.75*days/30+.25*Math.min(1,g/30),0,1)}

function hashL(id){let h=7;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)%5===0}

function benchPos(t,k){const i=Math.max(0,t.all.indexOf(k));
  if(i<5)return[t.side*(10.9+i*1.45),-3.5];if(i<9)return[t.side*(11.4+(i-5)*1.5),-1.6];return[t.side*(12+(i-9)*1.5),.4]}
function benchIdle(t,k){const i=t.all.indexOf(k);k.role=null;k.helmet=false;k.carry=null;k.distracted=false;k.idlePose=i<5?'sit':'stand';k.idleFace=t.side<0?'r':'l'}
function cancelRun(k){k.rb=(k.rb||0)+1;k.chain=(k.chain||0)+1}
function sendToBench(t,k){cancelRun(k);k.toPos=false;const i=G.bases?G.bases.indexOf(k):-1;if(i>=0)G.bases[i]=null;const [x,z]=benchPos(t,k);benchIdle(t,k);k.walkTo(x,z,k.speed>2.4?3.2:2.2)}

/* ---------- box score ---------- */
function bx(k){if(!k||!k.pid)return null;return G.box[k.pid]||(G.box[k.pid]={g:0,pa:0,ab:0,h:0,hr:0,rbi:0,bb:0,so:0,sh:0,sb:0,hbp:0,pg:0,po:0,pk:0,pr:0,w:0,l:0})}

const POSJN={P:'ピッチャー',C:'キャッチャー','1B':'ファースト','2B':'セカン','3B':'サード',SS:'ショート',LF:'レフト',CF:'センター',RF:'ライト'};
function niceOut(){
  if(!G.field)return;const h=G.ball.holder;let k=null;
  if(h&&h.role==='C'&&!G.inPlay)k=fielder('P');
  else if(h&&h.role==='1B'&&G.lastThr&&simT-G.lastThr.t<2.5&&G.lastThr.k!==h&&G.field.kids.includes(G.lastThr.k))k=G.lastThr.k;
  else if(h&&G.field.kids.includes(h))k=h;
  if(!k||!POSJN[k.role]||!chance(.55))return;
  const who=pick(G.field.kids.filter(x=>x!==k).concat(benchKids(G.field)));
  const txt=chance(.5)?`ナイス、${k.name}!`:`ナイス${POSJN[k.role]}!`;
  (async()=>{await sleep(1.1);say(who,txt,1)})();
}
function willContinue(){if(G.rp)return rpHasMore();const m=COLD[G.inning],d=G.score[0]-G.score[1];
  if(G.top)return!((G.inning>=LAST&&d>0)||(m&&d>=m));
  return!(G.inning>=LAST||(m&&Math.abs(d)>=m)||(phaseAt(hourNow())!=='game'&&G.inning>=2))}
function chainGo(k,steps,after){k.chain=(k.chain||0)+1;const my=k.chain;(async()=>{for(const st of steps){if(typeof st==='function'){st();continue}if(st.wait){await sleep(st.wait);if(k.chain!==my)return;continue}await k.goto(st[0],st[1],st[2]);if(k.chain!==my)return}if(after)after()})()}
function changeRun(){const nf=G.bat;if(!nf)return;
  // スリーアウト：ランナーとバッターはその場からすぐベンチへ（守備につく子はベンチ経由で守備位置へ）
  nf.all.forEach(k=>{if(k.role!=='R'&&k.role!=='B')return;cancelRun(k);const bi=G.bases.indexOf(k);if(bi>=0)G.bases[bi]=null;
    const ki=nf.kids.indexOf(k),[bx,bz]=benchPos(nf,k);k.role=null;k.stealing=false;k.joy=false;k.idlePose='stand';
    if(ki<0){chainGo(k,[[bx,bz,4.2],()=>{k.helmet=false;benchIdle(nf,k)}]);return}
    const[x,z]=POS[POSN[ki]];k.toPos=true;chainGo(k,[[bx,bz,4.4],()=>{k.helmet=false;k.idlePose='ready';k.idleFace='f'},{wait:.4},[x,z,5.4]],()=>{k.toPos=false})});
  // ネクストとコーチャーはスリーアウトの瞬間にベンチへ（守備につく子はそのまま守備位置へ）
  nf.all.forEach(k=>{if(k.role!=='OD'&&k.role!=='CO')return;const i=nf.kids.indexOf(k),[bx,bz]=benchPos(nf,k);k.role=null;k.idlePose='stand';
    if(i<0){chainGo(k,[[bx,bz,4.4],()=>{k.helmet=false;benchIdle(nf,k)}]);return}
    const[x,z]=POS[POSN[i]];k.toPos=true;k.idlePose='ready';k.idleFace='f';
    chainGo(k,[[bx,bz,4.4],()=>{k.helmet=false},{wait:.4},[x,z,5.4]],()=>{k.toPos=false})});
  nf.kids.forEach((k,i)=>{if(k.role||k.toPos)return;const[x,z]=POS[POSN[i]];k.chain=(k.chain||0)+1;const my=k.chain;k.toPos=true;k.helmet=false;k.carry=null;k.idlePose='ready';k.idleFace='f';k.goto(x,z,4.6).then(()=>{if(k.chain===my)k.toPos=false})})}
function commitGame(){
  if(!REC||G.rp)return;
  const sh=G.score[0],sa=G.score[1];
  if(sh!==sa){const win=sh>sa?G.home:G.away,lose=sh>sa?G.away:G.home;
    st(win.pitchers.slice().sort((a,b)=>bv(b,'po')-bv(a,'po'))[0],'w');
    st(lose.pitchers.slice().sort((a,b)=>bv(b,'pr')-bv(a,'pr'))[0],'l')}
  editD(d=>{
    const prev={};
    for(const [pid,b] of Object.entries(G.box)){prev[pid]={...(d.st.p[pid]||{})};const s=d.st.p[pid]||(d.st.p[pid]={});for(const k in b){if(typeof b[k]==='number')s[k]=(s[k]||0)+b[k]}}
    const today=(()=>{const x=new Date();return`${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`})();
    const addEv=(pid,txt)=>{const h=d.hist[pid]||(d.hist[pid]={d:[],ev:[]});h.ev.unshift({t:Date.now(),s:txt});h.ev=h.ev.slice(0,80)};
    [G.home,G.away].forEach(t=>{if(!t.mine)return;const opp=(t===G.home?G.away:G.home).def.name;

  Object.entries(t.preCo).forEach(([b,k])=>go(k,'CO',CBOX[b][0],CBOX[b][1],b==='3'?'r':'l','stand'));

function rpSync(ev){

    if(want.join('')!==have.join('')){console.warn('replay bases fix',G.rp.i-1,have.join(''),'->',ev.bs,JSON.stringify(G.rp.evs[G.rp.i-2]||{}));
      for(let i=0;i<3;i++){if(have[i]&&!want[i]){const k=G.bases[i];G.bases[i]=null;sendToBench(G.bat,k)}}
      for(let i=0;i<3;i++){if(want[i]&&!G.bases[i]){const k=G.bat.all.find(x=>!x.role&&!G.bases.includes(x)&&!G.bat.kids.includes(x))||G.bat.all.find(x=>!x.role&&!G.bases.includes(x));if(k){k.role='R';k.helmet=true;k.idlePose='stand';k.idleFace='f';k.walkTo(BASES[i+1][0],BASES[i+1][1],5);G.bases[i]=k}}}

async function rpBetween(batter,bat){
  const r=G.rp;
  for(;;){
    const ev=r.evs[r.i];
    if(!ev||ev.t==='end'){if(ev){r.i++;if(ev.why==='cold')G.cold=true}G.walkoff='end';return'ret'}
    if(ev.t==='sub'||ev.t==='pc'){r.i++;rpApply(ev);await sleep(.8);continue}
    if(ev.t==='run'){r.i++;await replayRun(ev);if(G.outs>=3)return'ret';return'cont'}
    if(ev.t==='pa'&&ev.res==='IBB'){r.i++;G.ump.setPose('point',1.2,'b');say(G.ump,'申告敬遠!',2);await sleep(1.2);
      G.balls=G.strikes=0;updateHUD();batter.role='R';batter.idlePose='stand';batter.idleFace='f';G.playRuns=0;await walkBatter(batter);st(batter,'pa');st(batter,'bb');await sleep(.4);return'ret'}
    if(ev.t==='p'||ev.t==='pa'){r.i++;rpSync(ev);return ev}
    r.i++;
  }
}

async function ambientGame(ep){

function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,u){return a.map((v,i)=>v+(b[i]-v)*u)}
function rgb(a){return`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`}
function skyAt(h){
  let i=0;while(i<KEY.length-2&&KEY[i+1][0]<=h)i++;
  const A=KEY[i],B=KEY[i+1],u=clamp((h-A[0])/(B[0]-A[0]),0,1);
  return{top:mix(hx(A[1]),hx(B[1]),u),bot:mix(hx(A[2]),hx(B[2]),u),tint:mix(A[3],B[3],u),star:A[4]+(B[4]-A[4])*u};
}

let W=0,Hh=0,dpr=1,scale=1,base=1,Z=1,vw=1200,vh=800,portrait=false,stL=0,stT=0;

function drawBubbles(L,T){

    cx.beginPath();cx.moveTo(tx-fs*.3,by+h);cx.lineTo(sx,sy);cx.lineTo(tx+fs*.3,by+h);cx.stroke();
    cx.fillStyle='rgba(255,255,255,.96)';cx.fillRect(tx-fs*.3+1,by+h-2*dpr,fs*.6-2,3*dpr);

  phaseName=ph;const ep=epoch;updateHUD();

function rsnap(){return{t:simT,ents:ents.slice(),v:ents.map(e=>RF.map(f=>e[f])),b:bubbles.slice()}}
function applySnap(sn,sn2,u){ents=sn.ents.slice();sn.ents.forEach((e,i)=>{const v=sn.v[i];RF.forEach((f,j)=>{e[f]=v[j]});
    if(sn2&&u>0){const j=sn2.ents.indexOf(e);if(j>=0){const w=sn2.v[j];e.x+=(w[0]-e.x)*u;e.z+=(w[1]-e.z)*u;if(typeof w[20]==='number'&&typeof e.h==='number')e.h+=(w[20]-e.h)*u}}});

function replayStep(dtr){RP.rt+=dtr*(RP.slow?.5:1);while(RP.i<RBUF.length-1&&RBUF[RP.i+1].t<=RP.rt)RP.i++;
  if(RP.i>=RBUF.length-1||RP.rt>=RP.live.t){endReplay();return}const a=RBUF[RP.i],b=RBUF[RP.i+1];applySnap(a,b,clamp((RP.rt-a.t)/Math.max(.001,b.t-a.t),0,1))}

  $('#bFF').textContent='▶▶ '+ffMul+'倍';$('#bFF').setAttribute('aria-pressed',String(ffMul>1));$('#bSlow').setAttribute('aria-pressed',String(!!(RP&&RP.slow)))}

  {const zt=sp?2.1:1;if(Math.abs(spotZ-zt)>.002){spotZ+=(zt-spotZ)*Math.min(1,dt*(sp?2.2:1.1));applyScale()}else if(spotZ!==zt){spotZ=zt;applyScale()}}

  planes.forEach(p=>p.x+=p.d*14*dt);planes=planes.filter(p=>p.x>-200&&p.x<1400);

  draw();

}

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function capOf(t){return(CAPS.find(c=>c.k===t.cap)||CAPS[0]).c}
function teamPick(){return`<div class="tpick">${DB.teams.map((t,i)=>`<button data-team="${i}" aria-pressed="${i===shTeam}"><span class="dot" style="background:${capOf(t)}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name||'マイチーム')}</span></button>`).join('')}</div>`}
function avg(h,ab){if(!ab)return'-';const v=(h/ab).toFixed(3);return v.startsWith('0')?v.slice(1):v}
function ip(o){o=o||0;const r=o%3;return`${Math.floor(o/3)}${r?` ${r}/3`:''}`}
function renderSheet(){
  DB=loadD();
  document.querySelectorAll('#shTabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===shTab)));
  const t=DB.teams[shTeam];
  if(shTab==='stats'&&shNote){shBody.innerHTML=noteHTML(shNote);return}
  if(shTab==='team'){
    shBody.innerHTML=`${teamPick()}
    <div class="field"><label class="lbl" for="tName">チーム名</label><input type="text" id="tName" maxlength="10" value="${esc(t.name)}"></div>
    <div><div class="lbl">帽子・ライン</div><div class="sw" id="swCap">${CAPS.map(c=>`<button data-cap="${c.k}" aria-pressed="${t.cap===c.k}"><span class="dot" style="background:${c.c}"></span>${c.l}</button>`).join('')}</div></div>
    <div><div class="lbl">ユニフォーム</div><div class="sw" id="swBody">${BODIES.map(c=>`<button data-body="${c.k}" aria-pressed="${t.body===c.k}"><span class="dot" style="background:${c.c}"></span>${c.l}</button>`).join('')}</div></div>
    <div><div class="lbl">選手（13人）</div><div class="roster">${t.players.map((p,i)=>`<div class="prow"><span class="num">${p.num}</span><input type="text" id="pn${i}" data-p="${i}" maxlength="8" value="${esc(p.name)}" aria-label="背番号${p.num}の名前"><div class="gseg" data-g="${i}"><button data-v="0" aria-pressed="${!p.girl}">男の子</button><button data-v="1" aria-pressed="${!!p.girl}">女の子</button></div></div>`).join('')}</div></div>
    <div class="field"><label class="lbl" for="tCapt">キャプテン（試合前のじゃんけんをします）</label><select id="tCapt">${t.players.map(p=>`<option value="${p.id}"${(t.captain?t.captain===p.id:p.num===10)?' selected':''}>${p.num} ${esc(p.name)}</option>`).join('')}</select></div>
    <p class="note">変更は次の試合から反映されます。先発の9人・守備位置・打順は、出場の少ない子から公平にランダムで決まります。</p>`;
  }else{
    const ts=DB.teams.map(x=>({x,s:DB.st.t[x.id]||{g:0,w:0,l:0,d:0,rf:0,ra:0,vs:{}}}));
    const s=(DB.st.t[t.id]||{vs:{}});
    const rows=t.players.map(p=>({p,s:DB.st.p[p.id]||{}}));
    const pit=rows.filter(r=>r.s.pg);
    shBody.innerHTML=`<div><h3>チーム成績</h3><div class="tbl"><table><tr><th>チーム</th><th>試合</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th><th>得点</th><th>失点</th></tr>
      ${ts.map(({x,s})=>`<tr><td class="l"><span class="dot" style="display:inline-block;vertical-align:-1px;margin-right:5px;background:${capOf(x)}"></span>${esc(x.name)}</td><td>${s.g}</td><td>${s.w}</td><td>${s.l}</td><td>${s.d}</td><td>${s.w+s.l?avg(s.w,s.w+s.l):'-'}</td><td>${s.rf}</td><td>${s.ra}</td></tr>`).join('')}</table></div></div>
    ${teamPick()}
    <div><h3>対戦相手別</h3><div class="tbl"><table><tr><th>相手</th><th>勝</th><th>敗</th><th>分</th></tr>${Object.entries(s.vs||{}).map(([n,v])=>`<tr><td class="l">${esc(n)}</td><td>${v.w}</td><td>${v.l}</td><td>${v.d}</td></tr>`).join('')||'<tr><td class="l" colspan="4">まだ試合がありません</td></tr>'}</table></div></div>
    <div><h3>能力</h3><div class="tbl"><table><tr><th>選手</th><th>打撃</th><th>守備</th><th>送球</th><th>走塁</th><th>判断</th><th>総合</th></tr>
      ${t.players.map(p=>{const e=effSk(p,DB);return`<tr><td class="l"><button class="pname" data-note="${p.id}">${p.num} ${esc(p.name)}</button></td>${SKK.map(k=>`<td>${grade(e[k])}</td>`).join('')}<td>${grade(overall(e))}</td></tr>`}).join('')}</table></div>
      <p class="note" style="margin-top:6px">名前を押すと成長ノートが開きます。S・A・B・C・D・E・Fの順に上手。日がたつほど、試合に出るほど少しずつ上がります。</p></div>
    <div><h3>打撃成績</h3><div class="tbl"><table><tr><th>選手</th><th>試合</th><th>打席</th><th>打数</th><th>安打</th><th>本塁打</th><th>打点</th><th>四球</th><th>死球</th><th>三振</th><th>犠打</th><th>盗塁</th><th>打率</th></tr>
      ${rows.map(({p,s})=>`<tr><td class="l">${p.num} ${esc(p.name)}</td><td>${s.g||0}</td><td>${s.pa||0}</td><td>${s.ab||0}</td><td>${s.h||0}</td><td>${s.hr||0}</td><td>${s.rbi||0}</td><td>${s.bb||0}</td><td>${s.hbp||0}</td><td>${s.so||0}</td><td>${s.sh||0}</td><td>${s.sb||0}</td><td>${avg(s.h||0,s.ab||0)}</td></tr>`).join('')}</table></div></div>
    <div><h3>投手成績</h3><div class="tbl"><table><tr><th>選手</th><th>登板</th><th>投球回</th><th>奪三振</th><th>失点</th><th>勝</th><th>敗</th></tr>
      ${pit.map(({p,s})=>`<tr><td class="l">${p.num} ${esc(p.name)}</td><td>${s.pg||0}</td><td>${ip(s.po)}</td><td>${s.pk||0}</td><td>${s.pr||0}</td><td>${s.w||0}</td><td>${s.l||0}</td></tr>`).join('')||'<tr><td class="l" colspan="7">まだ登板がありません</td></tr>'}</table></div></div>
    <div><h3>最近の試合</h3><ul class="log">${DB.log.slice(0,12).map(g=>{const d=new Date(g.t);return`<li>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}　${esc(g.a)} ${g.sa} - ${g.sh} ${esc(g.h)}${g.c?'（コールド）':''}</li>`}).join('')||'<li>まだ試合がありません</li>'}</ul></div>
    <button class="danger" id="resetSt">${shConfirm?'本当に消す（もう一度押す）':'成績をすべてリセット'}</button>`;
  }
}
let rsConfirm=0;
$('#bRestart').addEventListener('click',()=>{const b=$('#bRestart');
  if(Date.now()-rsConfirm>4000){rsConfirm=Date.now();b.textContent='本当にやり直す（もう一度押す）';setTimeout(()=>{if(Date.now()-rsConfirm>=4000)b.textContent='試合を最初からやり直す'},4100);return}
  rsConfirm=0;b.textContent='試合を最初からやり直す';try{localStorage.setItem(RSKEY,String(Date.now()))}catch(e){}
  restartGame();setPanel(false)});
$('#bRpStop').addEventListener('click',()=>{rpDrop();try{localStorage.setItem(RSKEY,String(Date.now()))}catch(e){}clearResume();G.rp=null;G.forceOpp=null;G.next=null;if(phaseName==='game')startPhase('game');setPanel(false)});
$('#bTeams').addEventListener('click',()=>{setPanel(false);sheet.hidden=false;shConfirm=false;renderSheet()});
$('#shClose').addEventListener('click',()=>{sheet.hidden=true});
$('#shTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;shTab=b.dataset.t;shNote=null;shConfirm=false;renderSheet()});
shBody.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.note){shNote=b.dataset.note;renderSheet();shBody.scrollTop=0;return}
  if(b.dataset.back){shNote=null;renderSheet();return}
  if(b.dataset.team!=null){shTeam=+b.dataset.team;renderSheet();return}
  if(b.dataset.cap){editD(d=>{d.teams[shTeam].cap=b.dataset.cap});renderSheet();return}
  if(b.dataset.body){editD(d=>{d.teams[shTeam].body=b.dataset.body});renderSheet();return}
  const g=b.closest('.gseg');if(g){editD(d=>{d.teams[shTeam].players[+g.dataset.g].girl=b.dataset.v==='1'});g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
  if(b.id==='resetSt'){if(!shConfirm){shConfirm=true;renderSheet();return}editD(d=>{d.st={p:{},t:{}};d.log=[]});shConfirm=false;renderSheet()}
});
shBody.addEventListener('change',e=>{if(e.target.id==='tCapt')editD(d=>{d.teams[shTeam].captain=e.target.value})});
shBody.addEventListener('input',e=>{const el=e.target;
  if(el.id==='tName')editD(d=>{d.teams[shTeam].name=el.value.trim()});
  else if(el.dataset.p!=null)editD(d=>{d.teams[shTeam].players[+el.dataset.p].name=el.value.trim()});
});
shBody.addEventListener('change',e=>{if(e.target.id==='tName')renderSheet()});

window.addEventListener('resize',layout);
document.addEventListener('visibilitychange',()=>{if(WALL||!document.hidden){loadS();syncUI();checkUpdate();DB=loadD();applyLive();checkRestart()}});
addEventListener('storage',e=>{if(e.key==='kawajiki.v1'){loadS();syncUI()}if(e.key===DKEY){DB=loadD();applyLive();if(!sheet.hidden&&shTab==='stats')renderSheet()}if(e.key===RSKEY)checkRestart()});
if(window.KawaApp){$('#appBox').hidden=false;$('#bWp').onclick=()=>{try{KawaApp.setWallpaper()}catch(e){}}}
let updBusy=false;
const UPDKEY='kawajikiUpd.'+(WALL?'wp':window.KawaApp?'app':'web');
function checkUpdate(){if(updBusy||!/^https?:/.test(location.protocol)||BUILD.startsWith('__'))return;updBusy=true;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{updBusy=false;
    if(!v||!v.build||v.build===BUILD)return;
    let tried=null;try{tried=JSON.parse(localStorage.getItem(UPDKEY)||'null')}catch(e){}
    if(tried&&tried.b===v.build&&Date.now()-tried.t<600000)return;
    if(!WALL&&(!panel.hidden||!sheet.hidden))return;
    try{localStorage.setItem(UPDKEY,JSON.stringify({b:v.build,t:Date.now()}))}catch(e){}
    const q=new URLSearchParams(location.search);q.set('v',v.build);location.replace(location.pathname+'?'+q.toString());
  }).catch(()=>{updBusy=false})}
setTimeout(checkUpdate,4000);setInterval(()=>{if(WALL||!document.hidden)checkUpdate()},(WALL?10:30)*60*1000);
layout();syncUI();
if(document.fonts)document.fonts.load("700 16px 'Zen Maru Gothic'").catch(()=>{});
startPhase(phaseAt(hourNow()));
requestAnimationFrame(frame);
</script>

</html>
